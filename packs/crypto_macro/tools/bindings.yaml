schema_version: crypto-macro-capability-bindings.v1
default_policy: deny
capabilities:
  - schema_version: research-capability-manifest.v1
    capability_id: web.search
    version: 1.0.0
    kind: python_adapter
    implementation_ref: adapter://dsh/native-web-search
    input_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_query
    output_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_result
    permissions: [network:https, search:broad]
    allowed_domains: []
    timeout_seconds: 20
    cost_policy_ref: ../pack.yaml#execution_budget
    freshness_policy_ref: ../evidence/source_manifest.yaml
    license_status: approved
    audit_status: approved
    replay_policy: archive_required
    secret_policy: adapter_only
  - schema_version: research-capability-manifest.v1
    capability_id: web.fetch
    version: 1.0.0
    kind: python_adapter
    implementation_ref: adapter://provider/http-document
    input_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_query
    output_schema_ref: agentic_research.schema.yaml#/$defs/evidence_candidate
    permissions: [network:https]
    # Search may discover arbitrary URLs, but the evidence fetcher is limited
    # to the audited financial publishers/exchanges below. A locator outside
    # this list remains a candidate in the DSH trajectory and cannot enter the
    # Hub ledger until a new manifest/ADR approves its authority.
    allowed_domains:
      - federalreserve.gov
      - bls.gov
      - bea.gov
      - treasury.gov
      - fred.stlouisfed.org
      - cmegroup.com
      - okx.com
      - deribit.com
      - bybit.com
      - reuters.com
    timeout_seconds: 20
    cost_policy_ref: ../pack.yaml#execution_budget
    freshness_policy_ref: ../evidence/source_manifest.yaml
    license_status: approved
    audit_status: approved
    replay_policy: archive_required
    secret_policy: adapter_only
  - schema_version: research-capability-manifest.v1
    capability_id: web.search.tavily
    version: 1.0.0
    kind: provider
    implementation_ref: adapter://tavily/search
    input_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_query
    output_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_result
    permissions: [network:https]
    allowed_domains: []
    timeout_seconds: 20
    cost_policy_ref: ../pack.yaml#execution_budget
    freshness_policy_ref: ../evidence/source_manifest.yaml
    license_status: approved
    audit_status: approved
    replay_policy: archive_required
    secret_policy: local_secret_store
  - schema_version: research-capability-manifest.v1
    capability_id: official.macro
    version: 1.0.0
    kind: python_adapter
    implementation_ref: adapter://provider/official_sources
    input_schema_ref: official-source-query.v1
    output_schema_ref: agentic_research.schema.yaml#/$defs/evidence_candidate
    permissions: [network:https]
    allowed_domains:
      - federalreserve.gov
      - bls.gov
      - bea.gov
      - treasury.gov
      - cmegroup.com
    timeout_seconds: 20
    cost_policy_ref: ../pack.yaml#execution_budget
    freshness_policy_ref: ../evidence/source_manifest.yaml
    license_status: approved
    audit_status: approved
    replay_policy: archive_required
    secret_policy: none
  - schema_version: research-capability-manifest.v1
    capability_id: market.crypto_derivatives
    version: 1.1.0
    kind: provider
    implementation_ref: adapter://provider/market/crypto-multi-venue
    input_schema_ref: market-snapshot-request.v1
    output_schema_ref: agentic_research.schema.yaml#/$defs/evidence_candidate
    permissions: [network:https]
    allowed_domains: [okx.com, api.coinex.com]
    timeout_seconds: 20
    cost_policy_ref: ../pack.yaml#execution_budget
    freshness_policy_ref: ../evidence/source_manifest.yaml
    license_status: approved
    audit_status: approved
    replay_policy: archive_required
    secret_policy: none
    provider_routes:
      - provider_id: event-window-archive
        adapter_ref: adapter://provider/market/event-window-archive
        route_role: primary
        priority: 0
        service_tier: replay
        allowed_domains: []
        timeout_seconds: 5
        cost_policy_ref: no-external-cost.v1
        license_status: approved
        audit_status: approved
        requires_event_window: true
      - provider_id: okx-public
        adapter_ref: adapter://provider/market/okx-public
        route_role: primary
        priority: 10
        service_tier: free_proxy
        allowed_domains: [okx.com]
        timeout_seconds: 8
        cost_policy_ref: known-free-public.v1
        license_status: approved
        audit_status: approved
        requires_event_window: false
      - provider_id: coinex-public
        adapter_ref: adapter://provider/market/coinex-public
        route_role: fallback
        priority: 20
        service_tier: free_proxy
        allowed_domains: [api.coinex.com]
        timeout_seconds: 8
        cost_policy_ref: known-free-public.v1
        license_status: approved
        audit_status: approved
        requires_event_window: false
  - schema_version: research-capability-manifest.v1
    capability_id: market.crypto_crowding
    version: 1.0.0
    kind: provider
    implementation_ref: adapter://provider/market/crypto-crowding
    input_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_query
    output_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_result
    permissions: [network:https]
    allowed_domains: [okx.com, api.coinex.com]
    # The capability deadline must leave enough time for one retryable primary
    # failure and the audited fallback route. Otherwise the Gateway cancels the
    # Router before CoinEx can run and the declared fallback is only cosmetic.
    timeout_seconds: 18
    cost_policy_ref: ../pack.yaml#execution_budget
    freshness_policy_ref: ../evidence/source_manifest.yaml
    license_status: approved
    audit_status: approved
    replay_policy: archive_required
    secret_policy: none
    provider_routes:
      - provider_id: okx-orderbook-public
        adapter_ref: adapter://provider/market/okx-orderbook
        route_role: primary
        priority: 10
        service_tier: free_proxy
        allowed_domains: [okx.com]
        timeout_seconds: 8
        cost_policy_ref: known-free-public.v1
        license_status: approved
        audit_status: approved
        requires_event_window: false
      - provider_id: coinex-orderbook-public
        adapter_ref: adapter://provider/market/coinex-orderbook
        route_role: fallback
        priority: 20
        service_tier: free_proxy
        allowed_domains: [api.coinex.com]
        timeout_seconds: 8
        cost_policy_ref: known-free-public.v1
        license_status: approved
        audit_status: approved
        requires_event_window: false
  - schema_version: research-capability-manifest.v1
    capability_id: market.cross_asset
    version: 1.0.0
    kind: python_adapter
    implementation_ref: adapter://provider/macro_market/fred
    input_schema_ref: market-snapshot-request.v1
    output_schema_ref: agentic_research.schema.yaml#/$defs/evidence_candidate
    permissions: [network:https]
    allowed_domains: [fred.stlouisfed.org]
    timeout_seconds: 20
    cost_policy_ref: ../pack.yaml#execution_budget
    freshness_policy_ref: ../evidence/source_manifest.yaml
    license_status: approved
    audit_status: approved
    replay_policy: archive_required
    secret_policy: none
  - schema_version: research-capability-manifest.v1
    capability_id: macro.cross_asset_intraday
    version: 1.0.0
    kind: provider
    implementation_ref: adapter://provider/macro/intraday-router
    input_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_query
    output_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_result
    permissions: [network:https]
    allowed_domains: []
    timeout_seconds: 15
    cost_policy_ref: ../pack.yaml#execution_budget
    freshness_policy_ref: ../evidence/source_manifest.yaml
    # No production endpoint/domain has been selected. Keep the stable seam
    # non-executable until a provider license, allowlist and live canary pass.
    license_status: review_required
    audit_status: candidate
    replay_policy: archive_required
    secret_policy: adapter_only
    provider_routes:
      - provider_id: macro-intraday-proxy
        adapter_ref: adapter://provider/macro/intraday-primary
        route_role: primary
        priority: 10
        service_tier: free_proxy
        allowed_domains: []
        timeout_seconds: 12
        cost_policy_ref: known-free-public.v1
        license_status: review_required
        audit_status: candidate
        requires_event_window: true
      - provider_id: macro-intraday-fallback
        adapter_ref: adapter://provider/macro/intraday-fallback
        route_role: fallback
        priority: 20
        service_tier: free_proxy
        allowed_domains: []
        timeout_seconds: 12
        cost_policy_ref: known-free-public.v1
        license_status: review_required
        audit_status: candidate
        requires_event_window: true
  - schema_version: research-capability-manifest.v1
    capability_id: macro.expectation_pricing
    version: 1.0.0
    kind: provider
    implementation_ref: adapter://provider/macro/expectation-pricing
    input_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_query
    output_schema_ref: agentic_research.schema.yaml#/$defs/research_capability_result
    permissions: [network:https]
    allowed_domains: [cmegroup.com]
    timeout_seconds: 15
    cost_policy_ref: ../pack.yaml#execution_budget
    freshness_policy_ref: ../evidence/source_manifest.yaml
    license_status: review_required
    audit_status: candidate
    replay_policy: archive_required
    secret_policy: local_secret_store
    provider_routes:
      - provider_id: expectation-pricing-configured
        adapter_ref: adapter://provider/macro/expectation-primary
        route_role: primary
        priority: 10
        service_tier: licensed_live
        allowed_domains: [cmegroup.com]
        timeout_seconds: 12
        cost_policy_ref: provider-contract.v1
        license_status: review_required
        audit_status: candidate
        requires_event_window: true
  - schema_version: research-capability-manifest.v1
    capability_id: replay.research
    version: 1.0.0
    kind: replay
    implementation_ref: adapter://runtime/replay-research
    input_schema_ref: replay-research-query.v1
    output_schema_ref: agentic_research.schema.yaml#/$defs/evidence_candidate
    permissions: [fixture:read]
    allowed_domains: []
    timeout_seconds: 5
    cost_policy_ref: no-external-cost.v1
    freshness_policy_ref: fixture-pit.v1
    license_status: approved
    audit_status: approved
    replay_policy: deterministic
    secret_policy: none
