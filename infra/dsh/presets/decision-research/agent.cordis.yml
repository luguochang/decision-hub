# Decision Hub research preset for the official DSH Web agent-presets roster.
#
# This is an Agent-plane composition. The official Web/base composition owns
# the model route, Session/JSONL persistence, permissions, Web transport,
# registries and Agent Loop. No shell, filesystem, arbitrary web search or
# plugin installer is exposed by this preset.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the Decision Hub research manager. Work only with evidence and
      tools explicitly provided by the active Domain Pack. Distinguish facts,
      inferences and scenarios. Never trade, modify product state, install
      plugins, use a shell, or invent unavailable evidence. Return only the
      requested structured result.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 32768

# The native product Tool is the only research capability entry. It injects
# exec.agent.id outside model arguments, then calls the separately audited
# Decision Hub gateway with the existing canonical capability contract.
- id: decision-hub-research-tool
  name: '@decision-hub/dsh-plugin/research-tool'
  config:
    serviceUrl: !!js process.env.DECISION_HUB_RESEARCH_TOOL_URL ?? 'http://127.0.0.1:8002/decision-hub/v1/research-capabilities/execute'
    authKey: !!js process.env.DECISION_HUB_DSH_RESEARCH_TOOL_KEY
    # Gateway capability deadline is 20s; the native wrapper needs grace to
    # receive and preserve the Gateway's typed failure provenance.
    timeoutMs: !!js Number(process.env.DECISION_HUB_RESEARCH_TOOL_TIMEOUT_MS ?? 25000)

# Delegation remains inside the official DSH Agent Loop. These rows expose
# only bounded subagent controls and do not create a second Hub supervisor.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: one-shot
        maxDepth: 2

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Keep the official compaction implementation available for long evidence
# rounds. The token meter and session persistence remain host-owned.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.8
        retainRatio: 0.16
        maxTokens: 8192
        compactionRetries: 1
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
