[project]
name = "decision-hub"
version = "0.1.0"
description = "Auditable event-driven decision support core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
  "langgraph==1.2.11",
  "langchain==1.3.17",
  "langchain-openai>=0.3,<1",
  "structlog>=25,<26",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "pyright>=1.1,<2",
  "jsonschema>=4.23,<5",
]

[project.scripts]
hub-api = "apps.hub_api.main:run"
hub-worker = "apps.hub_worker.main:run"

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "pyright>=1.1,<2",
  "jsonschema>=4.23,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: requires an explicit external provider and is never part of normal CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["packages", "apps", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
reportMissingImports = false
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUntypedBaseClass = false
reportUnusedFunction = false
reportUnusedVariable = false
reportTypedDictNotRequiredAccess = false
