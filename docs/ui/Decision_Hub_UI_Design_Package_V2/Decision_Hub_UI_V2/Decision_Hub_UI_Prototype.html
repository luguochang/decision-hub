*{
  box-sizing:border-box}
html{
  color-scheme:light;
  scroll-behavior:auto}
body{
  margin:0;
  color:var(--ink);
  background:var(--canvas);
  font:14px/1.6 var(--font);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{
  font:inherit;
  color:inherit}
button,a{
  touch-action:manipulation;
  -webkit-tap-highlight-color:#dcecff}
a{
  color:var(--brand);
  text-decoration:none}
button{
  cursor:pointer}
button:disabled{
  cursor:not-allowed;
  opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #4d88e4;
  outline-offset:3px}
input,textarea,select{
  border:1px solid #cfdcf0;
  border-radius:8px;
  background:white;
  padding:9px 12px;
  min-height:40px;
  max-width:100%;
  outline-offset:2px}
input:focus,textarea:focus{
  border-color:var(--brand)}
input[type=checkbox],input[type=radio]{
  min-height:0;
  accent-color:var(--brand);
  width:16px;
  height:16px}
h1,h2,h3,h4,p{
  margin:0}
h1{
  font-size:28px;
  line-height:1.4;
  letter-spacing:-.65px;
  font-weight:700;
  text-wrap:balance}
h2{
  font-size:19px;
  line-height:1.5;
  font-weight:650}
h3{
  font-size:15px;
  font-weight:650}
h4{
  font-size:14px}
svg{
  vertical-align:middle;
  flex-shrink:0}
img{
  max-width:100%;
  height:auto}
.muted,small,.small{
  color:var(--muted);
  font-size:12px}
.secondary{
  color:var(--secondary)}
.mono{
  font:12px/1.7 ui-monospace,Consolas,monospace;
  overflow-wrap:anywhere}
.row{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0}
.between{
  justify-content:space-between}
.wrap{
  flex-wrap:wrap}
.grow{
  flex:1;
  min-width:0}
.stack{
  display:grid;
  gap:16px}
.gap6{
  gap:6px}
.gap16{
  gap:16px}
.mt8{
  margin-top:8px}
.mt12{
  margin-top:12px}
.mt16{
  margin-top:16px}
.mt24{
  margin-top:24px}
.mb12{
  margin-bottom:12px}
.mb16{
  margin-bottom:16px}
.w100{
  width:100%}
.hidden,[hidden]{
  display:none!important}
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0)}
.skip{
  position:fixed;
  top:-70px;
  left:24px;
  background:white;
  z-index:9999;
  padding:12px}
.skip:focus{
  top:12px}
.num{
  font-variant-numeric:tabular-nums}
.nowrap{
  white-space:nowrap}
hr{
  border:0;
  border-top:1px solid var(--line);
  margin:18px 0}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:38px;
  padding:8px 13px;
  border:1px solid #d5e2f5;
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  font-size:13px;
  font-weight:600;
  text-align:center;
  transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{
  background:#f0f6ff;
  border-color:#a9c6f3}
.btn.primary{
  background:linear-gradient(115deg,#2860fc,#2086ff);
  border-color:#2669fa;
  color:#fff;
  box-shadow:0 4px 10px #2563eb20}
.btn.primary:hover{
  background:linear-gradient(115deg,#184fdd,#126fe0);
  box-shadow:0 4px 14px #2563eb38}
.btn.ghost{
  background:transparent;
  border-color:transparent;
  color:var(--secondary)}
.btn.ghost:hover{
  background:#eaf2ff;
  color:var(--brand)}
.btn.soft{
  background:var(--brand-soft);
  color:var(--brand);
  border-color:#dfeaff}
.btn.danger{
  color:var(--red);
  border-color:#f1cad4;
  background:var(--red-soft)}
.btn.success{
  background:var(--green-soft);
  border-color:#bce7d7;
  color:var(--green)}
.btn.sm{
  min-height:30px;
  padding:4px 9px;
  font-size:12px}
.btn.icon{
  padding:8px;
  width:38px}
.btn.text{
  border:0;
  background:none;
  padding:0;
  min-height:28px;
  color:var(--brand);
  font-size:12px}
.btn.large{
  min-height:46px;
  font-size:15px}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  max-width:100%;
  border:1px solid transparent;
  background:#f0f3f8;
  color:#526581;
  padding:3px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:600;
  line-height:1.45;
  white-space:nowrap}
.badge.blue{
  background:var(--brand-soft);
  color:#205ac4}
.badge.green{
  background:var(--green-soft);
  color:var(--green)}
.badge.amber{
  background:var(--amber-soft);
  color:var(--amber)}
.badge.red{
  background:var(--red-soft);
  color:var(--red)}
.badge.purple{
  background:var(--purple-soft);
  color:var(--purple)}
.badge.teal{
  background:var(--teal-soft);
  color:var(--teal)}
.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
  display:inline-block;
  flex-shrink:0}
.key{
  border:1px solid #d4dfef;
  border-radius:4px;
  font-size:11px;
  padding:0 5px;
  color:var(--muted);
  background:white}
.tile{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:11px;
  flex-shrink:0;
  color:var(--brand);
  background:linear-gradient(135deg,#e3edff,#f4f8ff);
  position:relative}
.tile::before{
  content:'';
  position:absolute;
  inset:4px;
  border:1px solid #ffffffa0;
  border-radius:8px;
  pointer-events:none}
.tile.purple{
  color:var(--purple);
  background:linear-gradient(135deg,#e9ddff,#f8f4ff)}
.tile.green{
  color:var(--green);
  background:linear-gradient(135deg,#d9f7e9,#f2fff8)}
.tile.amber{
  color:#da8408;
  background:linear-gradient(135deg,#ffedcf,#fff9eb)}
.tile.red{
  color:var(--red);
  background:linear-gradient(135deg,#ffdfe6,#fff5f7)}
.tile.teal{
  color:var(--teal);
  background:linear-gradient(135deg,#d7f4f2,#f0fffc)}
.tile.solid{
  background:linear-gradient(140deg,#2a67f6,#5898ff);
  color:#fff;
  box-shadow:0 4px 9px #306df722}
.tile.solid.purple{
  background:linear-gradient(140deg,#824fe3,#ab85fd)}
.tile.solid.green{
  background:linear-gradient(140deg,#0aa476,#43cba6)}
.tile.sm{
  width:30px;
  height:30px;
  border-radius:8px}
.tile.large{
  width:56px;
  height:56px;
  border-radius:15px}
.sidebar{
  width:var(--sidebar);
  position:fixed;
  inset:0 auto 0 0;
  z-index:40;
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,#fff,#fcfdff);
  border-right:1px solid var(--line);
  padding:21px 12px 14px}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 7px 24px}
.brand-logo{
  width:34px;
  height:34px;
  background:linear-gradient(135deg,#508dff,#2550ff);
  border-radius:10px;
  display:grid;
  place-items:center;
  color:#fff;
  box-shadow:0 3px 8px #3258e326;
  flex-shrink:0}
.brand-logo svg{
  width:28px;
  height:28px}
.brand strong{
  font-size:17px;
  letter-spacing:-.5px;
  white-space:nowrap}
.brand small{
  display:block;
  font-size:8px;
  letter-spacing:1.4px;
  color:#6e85ac}
.nav-caption{
  font-size:11px;
  color:var(--muted);
  padding:10px 13px 6px}
.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 12px;
  min-height:46px;
  border-radius:9px;
  color:#435b80;
  margin:4px 0;
  font-size:14px}
.nav-item.active{
  background:linear-gradient(90deg,#eaf2ff,#f0f6ff);
  font-weight:650;
  color:var(--brand)}
.nav-item.active .nav-ico{
  background:linear-gradient(135deg,#2866f6,#468dff);
  color:#fff;
  box-shadow:0 3px 7px #3269d726}
.nav-ico{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:7px}
.nav-item:hover{
  background:#edf4ff;
  color:var(--brand)}
.scope-card{
  padding:14px 12px;
  margin:20px 6px;
  border:1px solid #dce8fb;
  border-radius:10px;
  background:linear-gradient(145deg,#f0f6ff,white)}
.scope-card b{
  font-size:12px}
.scope-card p{
  margin-top:7px;
  font-size:11px;
  color:var(--secondary)}
.nav-bottom{
  margin-top:auto}
.profile{
  padding:14px 8px 0;
  margin-top:10px;
  border-top:1px solid var(--line)}
.avatar{
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  border-radius:50%;
  background:linear-gradient(135deg,#5689fe,#1758df);
  color:white;
  font-size:11px;
  font-weight:650;
  flex-shrink:0}
.app-body{
  margin-left:var(--sidebar);
  min-width:0}
.topbar{
  height:var(--header);
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 26px;
  background:#ffffffef;
  border-bottom:1px solid var(--line);
  gap:12px}
.breadcrumb{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  color:var(--muted);
  min-width:0;
  overflow:hidden}
.breadcrumb a{
  color:var(--muted);
  white-space:nowrap}
.breadcrumb b{
  white-space:nowrap;
  text-overflow:ellipsis;
  overflow:hidden;
  color:var(--ink);
  font-weight:600}
.service-strip{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  white-space:nowrap}
.service-strip .btn{
