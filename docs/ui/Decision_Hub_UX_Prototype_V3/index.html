<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decision Hub · 研究助理交互原型</title>
  <style>
    :root { font-family: Inter, "Microsoft YaHei", "PingFang SC", sans-serif; color: #14243d; background: #f5f7fb; --blue: #265fdb; --line: #dce4ef; --muted: #60718a; --soft: #eef4ff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .review { background: #293650; color: white; padding: 9px 22px; font-size: 12px; display: flex; justify-content: space-between; gap: 15px; align-items: center; }
    .review strong { font-weight: 700; }
    .review select { color: #15243b; border: 0; border-radius: 6px; padding: 5px 8px; background: white; }
    .review button { border: 1px solid #a9bee7; border-radius: 6px; background: transparent; color: white; padding: 5px 9px; }
    .shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: calc(100vh - 36px); }
    .sidebar { background: white; border-right: 1px solid var(--line); padding: 25px 14px; display: flex; flex-direction: column; gap: 26px; }
    .brand { display: flex; gap: 11px; align-items: center; padding: 0 10px; }
    .mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #79a7ff); display: grid; place-items: center; color: white; font-weight: 800; }
    .brand strong { display: block; font-size: 16px; letter-spacing: -.03em; }
    .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    nav { display: grid; gap: 4px; }
    .nav { background: transparent; border: 0; border-radius: 9px; color: #4b5e7a; padding: 12px 13px; text-align: left; font-size: 14px; font-weight: 600; }
    .nav.active { color: #174ebd; background: #eaf1ff; }
    .nav:hover, .text-link:hover { color: var(--blue); }
    .mobile-only { display: none; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
    .main { min-width: 0; }
    .topbar { background: white; border-bottom: 1px solid var(--line); padding: 14px min(5vw, 54px); display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .topbar span { font-size: 13px; color: var(--muted); }
    .scope { display: flex; align-items: center; gap: 9px; }
    .scope label { color: var(--muted); font-size: 12px; }
    .scope strong { border: 1px solid var(--line); border-radius: 8px; color: #19304f; padding: 8px 10px; background: #f8faff; font-size: 13px; white-space: nowrap; }
    main { max-width: 1190px; margin: 0 auto; padding: 36px min(5vw, 54px) 70px; }
    .eyebrow { color: #2a62d6; text-transform: uppercase; font-size: 11px; letter-spacing: .13em; font-weight: 800; }
    h1 { margin: 7px 0 8px; font-size: clamp(28px, 3.1vw, 38px); letter-spacing: -.04em; line-height: 1.17; }
    h2 { margin: 0 0 10px; font-size: 21px; letter-spacing: -.025em; }
    h3 { margin: 0 0 6px; font-size: 17px; }
    p { line-height: 1.65; }
    .lead { margin: 0; color: var(--muted); font-size: 14px; }
    .pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
    .button { border: 1px solid var(--line); border-radius: 9px; padding: 10px 15px; font-weight: 700; font-size: 13px; background: white; color: #1c3762; white-space: nowrap; }
    .button.primary { background: var(--blue); border-color: var(--blue); color: white; }
    .button:hover { box-shadow: 0 3px 9px #254d991c; }
    .text-link { color: var(--blue); font-weight: 700; border: 0; background: transparent; padding: 0; }
    .card { border: 1px solid var(--line); background: white; border-radius: 15px; padding: 22px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 700; background: #e8f6ef; color: #18744c; }
    .status:before { content: ""; width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
    .status.warn { background: #fff2dc; color: #9c610c; }
    .status.bad { background: #fdebed; color: #ad3548; }
    .status.neutral { background: #eef2f8; color: #52647d; }
    .monitor { padding: 17px 20px; display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 18px; }
    .monitor strong { display: block; font-size: 14px; }
    .monitor p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .monitor .text-link { white-space: nowrap; }
    .hero { padding: 28px; border: 1px solid #cbdcf7; background: linear-gradient(130deg, #fff 65%, #eaf2ff); }
    .hero h2 { max-width: 760px; font-size: clamp(24px, 2.6vw, 32px); margin: 10px 0; line-height: 1.3; }
    .hero p { max-width: 780px; margin: 8px 0; }
    .hero-actions { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
    .meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 13px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 15px; margin: 30px 0 14px; }
    .section-head h2 { margin: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .row { display: flex; justify-content: space-between; gap: 18px; align-items: start; padding: 16px 0; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; padding-top: 0; }
    .row:last-child { padding-bottom: 0; }
    .row strong { display: block; font-size: 14px; }
    .row p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .notice { border: 1px solid #ead19b; background: #fff9ec; color: #775714; padding: 15px 18px; border-radius: 10px; font-size: 13px; line-height: 1.5; margin-bottom: 18px; }
    .notice.bad { border-color: #f2bfc7; background: #fff0f2; color: #9a2d41; }
    .prototype-note { display: inline-block; color: #715119; background: #fff2d3; border-radius: 6px; padding: 3px 7px; font-size: 11px; font-weight: 700; }
    .topbar-right { display: flex; align-items: center; gap: 15px; }
    .timeline { border-left: 2px solid #d7e4fa; margin: 14px 0 0 7px; padding-left: 18px; }
    .timeline > div { position: relative; margin: 0 0 18px; font-size: 13px; }
    .timeline > div:before { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #4777d7; left: -24px; top: 5px; }
    .timeline strong { display: block; margin-bottom: 4px; }
    .report-head { margin-bottom: 18px; }
    .report-summary { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; }
    .report-summary h2 { font-size: 27px; line-height: 1.35; margin-top: 10px; }
    .report-summary p { margin: 8px 0; }
    .factlist { margin: 0; padding-left: 19px; }
    .factlist li { margin: 9px 0; line-height: 1.55; font-size: 14px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    details { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 15px; }
    summary { cursor: pointer; color: #225bc5; font-weight: 700; font-size: 13px; }
    details p { color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 7px; margin: 0 0 18px; border-bottom: 1px solid var(--line); }
    .tab { border: 0; background: transparent; padding: 10px 15px; color: var(--muted); font-weight: 700; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--blue); border-color: var(--blue); }
    .report-item { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 20px; border: 1px solid var(--line); background: white; padding: 19px; border-radius: 11px; margin: 10px 0; }
    .report-item strong { display: block; font-size: 15px; margin-bottom: 5px; }
    .report-item small { color: var(--muted); }
    .field { display: grid; gap: 6px; margin-top: 14px; }
    .field label { font-size: 13px; font-weight: 700; }
    .field input, .field textarea { width: 100%; border: 1px solid #cbd6e5; border-radius: 8px; padding: 10px 12px; color: #162844; background: white; }
    .field textarea { min-height: 100px; resize: vertical; }
    .chiprow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 8px 11px; background: white; color: #31537f; font-size: 12px; }
    .chip.on { background: var(--soft); border-color: #afc7f5; color: #174ebd; }
    .inline-actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .upload { display: block; padding: 25px; border: 1px dashed #9cb8e9; border-radius: 10px; background: #f8fbff; text-align: center; color: #3a5e9e; cursor: pointer; }
    .upload input { display: none; }
    dialog { border: 1px solid var(--line); border-radius: 15px; padding: 26px; width: min(540px, calc(100vw - 28px)); box-shadow: 0 25px 80px #13254330; }
    dialog::backdrop { background: #0e1d3a8a; }
    dialog h2 { margin-top: 0; }
    .modal-top { display: flex; justify-content: space-between; gap: 20px; }
    .icon { border: 0; background: transparent; font-size: 23px; line-height: 1; color: var(--muted); }
    .empty { padding: 45px 28px; text-align: center; }
    .empty h2 { margin-bottom: 7px; }
    .empty p { color: var(--muted); margin: 0 auto 19px; max-width: 540px; }
    @media (max-width: 900px) { .shell { grid-template-columns: 78px 1fr; } .brand div:last-child { display: none; } .sidebar { padding: 20px 8px; } .nav { text-align: center; padding: 12px 3px; font-size: 12px; } .sidebar-bottom .nav { font-size: 11px; } .report-summary, .grid { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { .review { flex-wrap: wrap; padding: 8px 12px; } .shell { display: block; } .sidebar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: block; border-top: 1px solid var(--line); border-right: 0; padding: 4px; box-shadow: 0 -6px 20px #16284612; } .brand, .sidebar-bottom { display: none; } nav { display: flex; justify-content: space-around; } .nav { flex: 1; } .mobile-only { display: block; } .main { padding-bottom: 57px; } .topbar { padding: 10px 16px; } .topbar span { display: none; } .topbar-right { width: 100%; justify-content: space-between; } .scope { justify-content: space-between; } main { padding: 24px 16px 42px; } .pagehead { display: block; } .pagehead .button { margin-top: 16px; } .monitor { align-items: start; } .hero { padding: 21px; } .hero h2 { font-size: 25px; } .report-summary h2 { font-size: 24px; } .detail-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="review"><strong>交互原型 · 以下均为示意数据，不代表当前实时研究</strong><div><label>评审场景 <select id="scenario"><option value="active">有新研究</option><option value="empty">暂无重要变化</option><option value="degraded">服务异常</option></select></label> <button id="future" type="button">查看未来黄金概念</button></div></div>
  <div class="shell">
    <aside class="sidebar"><div class="brand"><div class="mark">D</div><div><strong>Decision Hub</strong><small>你的持续研究助理</small></div></div><nav id="nav"></nav><div class="sidebar-bottom"><button class="nav" data-route="management">管理与审计</button><button class="nav" data-route="status">系统状态</button></div></aside>
    <div class="main"><header class="topbar"><span>目标体验：系统主动研究，结果进入今日研究</span><div class="topbar-right"><button class="text-link" data-route="todo">待我处理 <b>1</b> · 示例</button><div class="scope"><label>当前研究</label><strong>BTC 与宏观</strong></div></div></header><main id="content"></main></div>
  </div>
  <dialog id="question"><div class="modal-top"><div><span class="eyebrow">临时研究</span><h2 id="questionTitle">补充一个你关心的问题</h2></div><button class="icon" data-action="close-question" aria-label="关闭">×</button></div><p id="questionContext" class="lead">这是额外请求。日常监控和自动研究不需要在这里输入内容。</p><div class="field"><label for="questionText">关注点</label><textarea id="questionText" placeholder="例如：这次变化会怎样影响我关注的研究领域？"></textarea></div><div class="inline-actions"><button class="button primary" data-action="submit-question">模拟提交</button><button class="button" data-action="close-question">取消</button></div><p id="questionResult" class="small muted" aria-live="polite"></p></dialog>
  <script>
    const state = { route: 'today', scope: 'btc', scenario: 'active', tab: 'reports', taskFilter: 'all', watch: ['官方宏观事件', '跨市场风险'], eventFilter: 'upcoming', documentReview: 'pending' };
    const data = {
      btc: { name: 'BTC 与宏观', event: '宏观数据变化后，BTC 研究结论已更新', headline: '短期波动风险上升，当前保持观察', reason: '新发布的数据改变了利率预期，跨市场证据仍需进一步确认。', watch: '官方数据下一次发布后复核', evidence: ['官方数据已更新，发布时间与版本可追溯', '相关市场反应与原有判断出现差异', '衍生品拥挤度尚未提供充分确认'], counter: '如果后续市场价格与资金流没有延续，当前判断需要撤回。' },
      gold: { name: '黄金与宏观', event: '实际利率变化引发黄金研究复核', headline: '关键宏观条件发生变化，方向仍待确认', reason: '实际利率与美元变化可能影响黄金，但现有证据不足以形成执行建议。', watch: '下一次利率与通胀数据发布后复核', evidence: ['利率与通胀数据使用各自的官方发布版本', '美元与实际利率变化需要交叉确认', '黄金现货和期货数据需独立核验'], counter: '避险需求若发生变化，利率解释可能不再主导。' }
    };
    const eventItems = [
      { id: 'release', group: 'upcoming', title: '宏观数据发布示例', time: '示例：明日 20:30', source: '示例官方来源', impact: 'BTC 与宏观', note: '发布后判断是否值得启动新研究。' },
      { id: 'revision', group: 'released', title: '官方事件修订示例', time: '示例：昨日 21:00', source: '示例官方来源', impact: 'BTC 与宏观', note: '同一事件身份下保留初版与修订版。' },
      { id: 'watching', group: 'watching', title: '观察中的政策事件示例', time: '示例：上周 09:00', source: '示例官方来源', impact: 'BTC 与宏观', note: '未达研究准入条件，等待进一步证据。' }
    ];
    const taskItems = [
      { id: 'active', group: 'running', title: '核验宏观变化 · 示例', detail: '正在补充原始来源', label: '研究中' },
      { id: 'recheck', group: 'done', title: '研究结论定时复查 · 示例', detail: '同一主题的第二次执行', label: '已完成' },
      { id: 'failed', group: 'failed', title: '来源不足的研究任务 · 示例', detail: '保留失败原因与可审计恢复入口', label: '失败' }
    ];
    const navItems = [['today', '今日研究'], ['watch', '市场与事件'], ['research', '研究'], ['library', '资料']];
    const d = () => data[state.scope];
    const status = (text, tone = '') => `<span class="status ${tone}">${text}</span>`;
    const head = (eyebrow, title, copy, action = '') => `<div class="pagehead"><div><span class="eyebrow">${eyebrow}</span><h1>${title}</h1><p class="lead">${copy}</p></div>${action}</div>`;
    const questionButton = '<button class="button" data-action="question">临时研究一个问题</button>';
    function today() {
      const statusCopy = state.scenario === 'degraded' ? ['示例：部分来源暂不可用', '示例状态，非实时 · 受影响的研究将明确标出', 'bad'] : ['示例：监控正常', '示例状态，非实时 · 最近检查与下次检查须来自真实接口', ''];
      let body = head('今日研究', '今天值得关注什么', `目标体验：${d().name} 的重要变化主动出现在这里。`, questionButton);
      body += `<section class="card monitor"><div><strong>${status(statusCopy[0], statusCopy[2])}</strong><p>${statusCopy[1]}</p></div><button class="text-link" data-route="status">查看状态 →</button></section>`;
      if (state.scenario === 'empty') return body + `<section class="card empty"><h2>暂无值得新增研究的重要变化</h2><p>监控仍在运行。已有报告和下一次复核计划可以在“研究”中查看。</p><button class="button primary" data-route="research">查看已有研究</button></section><div class="section-head"><h2>接下来关注</h2></div><section class="card"><div class="row"><div><strong>下一次官方数据发布</strong><p>发生后系统会判断是否需要新研究，而不是自动生成重复报告。</p></div>${status('待发布', 'neutral')}</div></section>`;
      if (state.scenario === 'degraded') body += `<div class="notice bad">一个来源未能完成本轮检查。受其影响的新结论将暂缓发布；已有报告仍可查看，并会标出证据时效。</div>`;
      body += `<section class="card hero"><span class="prototype-note">目标原型 · 示例结论 · 非实时</span><h2>${d().event}</h2><p><strong>${d().headline}</strong></p><p class="muted">${d().reason}</p><div class="meta">${status('仅供研究，暂不可执行', 'warn')}<span>更新：示例时间 10:12</span><span>下次复核：${d().watch}</span></div><div class="hero-actions"><button class="button primary" data-route="report">阅读结论与依据</button><button class="button" data-route="research" data-tab="tasks">查看研究进度</button></div></section>`;
      body += `<div class="grid"><section class="card"><h3>系统正在做什么 <span class="prototype-note">示例</span></h3><div class="row"><div><strong>核验另一项宏观变化</strong><p>正在补充原始来源；完成前不会把候选当结论。</p></div>${status('研究中', 'neutral')}</div></section><section class="card"><h3>接下来关注 <span class="prototype-note">示例</span></h3><div class="row"><div><strong>下一次官方发布</strong><p>示例：明日 20:30 · 示例官方来源 · 影响 BTC 与宏观</p></div><button class="text-link" data-route="event" data-event="release">查看事件 →</button></div></section></div>`;
      return body;
    }
    function research() {
      let body = head('研究', '研究与进展', '按主题看结论；同一事件的复查合并到报告历史，不把每次运行都当成新报告。', questionButton);
      body += `<div class="notice">目标布局示意：报告按事件归并，同时保留可见的原始任务记录和结果跟踪。现有 API 主要提供 Run 列表；新归并合同待建设。</div><div class="tabs"><button class="tab ${state.tab === 'reports' ? 'active' : ''}" data-tab="reports">报告</button><button class="tab ${state.tab === 'tasks' ? 'active' : ''}" data-tab="tasks">任务记录</button><button class="tab ${state.tab === 'results' ? 'active' : ''}" data-tab="results">结果跟踪</button></div>`;
      if (state.tab === 'tasks') return body + `<div class="chiprow">${[['all','全部'],['running','研究中'],['done','已完成'],['failed','失败']].map(([key,label]) => `<button class="chip ${state.taskFilter === key ? 'on' : ''}" data-task-filter="${key}">${label}</button>`).join('')}</div><section class="card" style="margin-top:15px">${taskItems.filter(item => state.taskFilter === 'all' || item.group === state.taskFilter).map(item => `<button class="report-item" data-route="task" data-task="${item.id}"><div><strong>${item.title}</strong><small>${item.detail} · 触发与父子关系在正式列表中可筛选</small></div>${status(item.label, item.group === 'failed' ? 'bad' : 'neutral')}</button>`).join('')}</section>`;
      if (state.tab === 'results') return body + `<div class="grid"><section class="card"><h2>预测与到期结果 <span class="prototype-note">示例布局</span></h2><p>按研究主题追踪 30 分钟、24 小时、72 小时等窗口；逐项区分已到期与尚未到期。</p><button class="text-link" data-route="report">回到关联报告 →</button></section><section class="card"><h2>效果评估</h2><p>展示校准、反证、结果偏差和适用样本，不能用一次报告宣称有效。</p><button class="text-link" data-route="management">打开管理与审计 →</button></section></div>`;
      return body + `<button class="report-item" data-route="report"><div><strong>${d().event}</strong><small>${d().headline} · 已有 2 次复核 · 示意时间 10:12</small></div>${status('仅供研究', 'warn')}</button><section class="card empty"><h3>结论归并，任务账本保留</h3><p>切换到“任务记录”仍可查看每次运行、筛选状态并追溯父子关系。</p><button class="button" data-route="research" data-tab="tasks">查看任务记录</button></section>`;
    }
    function taskDetail() {
      const item = taskItems.find(value => value.id === state.taskId) ?? taskItems[0];

      if (action === 'reject-document') { state.documentReview = 'rejected'; render(); }
      if (action === 'reset-document') { state.documentReview = 'pending'; render(); }
      if (action === 'task-command') document.querySelector('#taskResult').textContent = '仅演示命令入口；正式产品须填写原因并生成可审计的后端结果。';
    });
    document.querySelector('#future').addEventListener('click', () => { state.route = state.route === 'future' ? 'today' : 'future'; render(); window.scrollTo(0, 0); });
    document.querySelector('#scenario').addEventListener('change', event => { state.scenario = event.target.value; render(); });
    document.addEventListener('change', event => { if (event.target.id === 'file') document.querySelector('#fileResult').textContent = event.target.files?.length ? `已选择：${event.target.files[0].name}。仅模拟选择，未上传。` : '原型不会上传文件到服务器。'; });
    const initial = location.hash.replace('#', '');
    if (['today','research','task','report','watch','event','library','document','todo','future','status','management'].includes(initial)) state.route = initial;
    window.addEventListener('hashchange', () => {
      const route = location.hash.replace('#', '');
      if (['today','research','task','report','watch','event','library','document','todo','future','status','management'].includes(route) && route !== state.route) { state.route = route; render(); }
    });
    render();
  </script>
</body>
</html>
