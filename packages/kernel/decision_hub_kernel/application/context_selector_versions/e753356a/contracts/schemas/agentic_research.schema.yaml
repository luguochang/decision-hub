$schema: https://json-schema.org/draft/2020-12/schema
$id: https://decision-hub.local/contracts/agentic_research.schema.json
title: AgenticResearchContracts
type: object
additionalProperties: false
required: [schema_version]
properties:
  schema_version: {type: string, const: agentic-research.v1}
$defs:
  event_watch:
    type: object
    additionalProperties: false
    required: [schema_version, watch_id, event_id, source_id, event_family, scheduled_at, status, window_offsets, baseline_status, created_at, updated_at, next_tick_at]
    properties:
      schema_version: {type: string, const: event-watch.v1}
      watch_id: {type: string, minLength: 1, maxLength: 128}
      event_id: {type: string, minLength: 1, maxLength: 128}
      source_id: {type: string, minLength: 1, maxLength: 128}
      event_family: {type: string, minLength: 1, maxLength: 128}
      scheduled_at: {type: string, format: date-time}
      status: {type: string, enum: [scheduled, active, completed, retrospective_only, cancelled]}
      window_offsets:
        type: array
        items: {type: string, minLength: 1, maxLength: 32}
        minItems: 1
        uniqueItems: true
      baseline_status: {type: string, enum: [pending, ready, unavailable]}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      next_tick_at: {type: [string, 'null'], format: date-time}

  event_window_sample:
    type: object
    additionalProperties: false
    required: [schema_version, sample_id, watch_id, event_id, offset, target_at, status, observed_at, received_at, provider_id, payload_ref, payload_hash, error_code]
    properties:
      schema_version: {type: string, const: event-window-sample.v1}
      sample_id: {type: string, minLength: 1, maxLength: 160}
      watch_id: {type: string, minLength: 1, maxLength: 128}
      event_id: {type: string, minLength: 1, maxLength: 128}
      offset: {type: string, minLength: 1, maxLength: 32}
      target_at: {type: string, format: date-time}
      status: {type: string, enum: [pending, due, captured, missing, baseline_unavailable]}
      observed_at: {type: [string, 'null'], format: date-time}
      received_at: {type: [string, 'null'], format: date-time}
      provider_id: {type: [string, 'null'], maxLength: 128}
      payload_ref: {type: [string, 'null'], maxLength: 2048}
      payload_hash: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
      error_code: {type: [string, 'null'], maxLength: 128}

  event_window_capture:
    type: object
    additionalProperties: false
    required: [schema_version, observed_at, received_at, provider_id, payload_ref, payload_hash]
    properties:
      schema_version: {type: string, const: event-window-capture.v1}
      observed_at: {type: string, format: date-time}
      received_at: {type: string, format: date-time}
      provider_id: {type: string, minLength: 1, maxLength: 128}
      payload_ref: {type: string, minLength: 1, maxLength: 2048}
      payload_hash: {type: string, pattern: '^[a-f0-9]{64}$'}

  crypto_event_window_observation:
    type: object
    additionalProperties: false
    required: [provider_id, source_id, venue, metric_family, field, value, unit, source_url, published_at]
    properties:
      provider_id: {type: string, minLength: 1, maxLength: 128}
      source_id: {type: string, minLength: 1, maxLength: 256}
      venue: {type: string, minLength: 1, maxLength: 128}
      metric_family: {type: string, minLength: 1, maxLength: 128}
      field: {type: string, minLength: 1, maxLength: 128}
      value: {type: [number, string]}
      unit: {type: string, minLength: 1, maxLength: 64}
      source_url: {type: [string, 'null'], format: uri, maxLength: 2048}
      published_at: {type: [string, 'null'], format: date-time}

  crypto_event_window_failure:
    type: object
    additionalProperties: false
    required: [provider_id, error_code, retryable]
    properties:
      provider_id: {type: string, minLength: 1, maxLength: 128}
      error_code: {type: string, minLength: 1, maxLength: 128}
      retryable: {type: boolean}

  crypto_event_window_payload:
    type: object
    additionalProperties: false
    required: [schema_version, event_id, offset, target_at, captured_at, observations, failures]
    properties:
      schema_version: {type: string, const: crypto-event-window-payload.v1}
      event_id: {type: string, minLength: 1, maxLength: 128}
      offset: {type: string, minLength: 1, maxLength: 32}
      target_at: {type: string, format: date-time}
      captured_at: {type: string, format: date-time}
      observations:
        type: array
        items: {$ref: '#/$defs/crypto_event_window_observation'}
        maxItems: 100
      failures:
        type: array
        items: {$ref: '#/$defs/crypto_event_window_failure'}
        maxItems: 20

  unit_list:
    type: array
    items: {type: string, minLength: 1}
    minItems: 1
    uniqueItems: true

  execution_budget:
    type: object
    additionalProperties: false
    required: [max_evidence_rounds, max_tool_calls, max_subagents, total_deadline_seconds, per_tool_timeout_seconds, per_model_step_timeout_seconds, max_structured_repairs, max_estimated_cost_usd]
    properties:
      max_evidence_rounds: {type: integer, minimum: 1, maximum: 10}
      max_tool_calls: {type: integer, minimum: 1, maximum: 100}
      max_subagents: {type: integer, minimum: 0, maximum: 32}
      total_deadline_seconds: {type: integer, minimum: 1, maximum: 3600}
      per_tool_timeout_seconds: {type: integer, minimum: 1, maximum: 600}
      per_model_step_timeout_seconds: {type: integer, minimum: 1, maximum: 600}
      max_structured_repairs: {type: integer, minimum: 0, maximum: 5}
      max_estimated_cost_usd: {type: number, minimum: 0}

  product_extension_manifest:
    type: object
    additionalProperties: false
    required: [schema_version, extension_id, version, task_schema_ref, artifact_schema_ref, evaluation_policy_ref, domain_pack_refs, dsh_bundle_ref]
    properties:
      schema_version: {type: string, const: product-extension-manifest.v1}
      extension_id: {type: string, pattern: '^[a-z][a-z0-9_-]*$'}
      version: {type: string, minLength: 1}
      task_schema_ref: {type: string, minLength: 1}
      artifact_schema_ref: {type: string, minLength: 1}
      evaluation_policy_ref: {type: string, minLength: 1}
      domain_pack_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      dsh_bundle_ref: {type: [string, 'null']}

  domain_pack_manifest:
    type: object
    additionalProperties: false
    required: [schema_version, pack_id, version, product_extension_ref, doctrine_ref, evidence_policy_ref, gate_policy_ref, evaluation_policy_ref, role_profile_refs, capability_refs, horizons, execution_budget]
    properties:
      schema_version: {type: string, const: domain-pack-manifest.v1}
      pack_id: {type: string, pattern: '^[a-z][a-z0-9_-]*$'}
      version: {type: string, minLength: 1}
      product_extension_ref: {type: string, minLength: 1}
      doctrine_ref: {type: string, minLength: 1}
      evidence_policy_ref: {type: string, minLength: 1}
      gate_policy_ref: {type: string, minLength: 1}
      evaluation_policy_ref: {type: string, minLength: 1}
      role_profile_refs: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      capability_refs: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      horizons:
        type: array
        items: {type: string, enum: [30m, 24h, 72h]}
        minItems: 3
        maxItems: 3
        uniqueItems: true
      execution_budget: {$ref: '#/$defs/execution_budget'}

  research_source_policy:
    type: object
    additionalProperties: false
    required: [source_ref, tier, publisher, authority, independence_group, domains, allowed_paths, requirement_ids, allow_search, allow_fetch, allow_evidence, parser_ref, license_status, retention_policy, audit_status, redirect_policy]
    properties:
      source_ref: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
      tier: {type: string, enum: [P0, P1, P2, P3, P4]}
      publisher: {type: string, minLength: 1}
      authority: {type: string, enum: [official, exchange, audited_aggregator, verified_web, search_derived, unverified]}
      independence_group: {type: string, minLength: 1}
      domains: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      allowed_paths: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      requirement_ids: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      allow_search: {type: boolean}
      allow_fetch: {type: boolean}
      allow_evidence: {type: boolean}
      parser_ref: {type: [string, 'null']}
      license_status: {type: string, enum: [approved, review_required, denied]}
      retention_policy: {type: string, enum: [hash_only, hash_excerpt, full_text]}
      audit_status: {type: string, enum: [approved, candidate, denied]}
      redirect_policy: {type: string, enum: [deny, same_source_only]}

  research_source_registry:
    type: object
    additionalProperties: false
    required: [schema_version, pack_id, version, sources]
    properties:
      schema_version: {type: string, const: research-source-registry.v1}
      pack_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
      version: {type: string, minLength: 1}
      sources:
        type: array
        items: {$ref: '#/$defs/research_source_policy'}
        minItems: 1
        maxItems: 500

  role_profile:
    type: object
    additionalProperties: false
    required: [schema_version, profile_id, version, objective, required_capabilities, allowed_tools, output_schema_ref, evaluation_policy_ref, system_instruction_ref]
    properties:
      schema_version: {type: string, const: role-profile.v1}
      profile_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
      version: {type: string, minLength: 1}
      objective: {type: string, minLength: 1}
      required_capabilities: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      allowed_tools: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      output_schema_ref: {type: string, minLength: 1}
      evaluation_policy_ref: {type: string, minLength: 1}
      system_instruction_ref: {type: string, minLength: 1}

  provider_route:
    type: object
    additionalProperties: false
    required: [provider_id, adapter_ref, route_role, priority, service_tier, allowed_domains, timeout_seconds, cost_policy_ref, license_status, audit_status]
    properties:
      provider_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
      adapter_ref: {type: string, minLength: 1}
      route_role: {type: string, enum: [primary, fallback]}
      priority: {type: integer, minimum: 0, maximum: 10000}
      service_tier: {type: string, enum: [free_proxy, licensed_live, replay]}
      allowed_domains: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      timeout_seconds: {type: integer, minimum: 1, maximum: 600}
      cost_policy_ref: {type: string, minLength: 1}
      license_status: {type: string, enum: [approved, review_required, denied]}
      audit_status: {type: string, enum: [approved, candidate, denied]}
      requires_event_window: {type: boolean, default: false}

  provider_attempt:
    type: object
    additionalProperties: false
    required: [provider_id, route_role, service_tier, status, started_at, finished_at, latency_ms, cost_usd, error_code, retryable]
    properties:
      provider_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
      route_role: {type: string, enum: [primary, fallback]}
      service_tier: {type: string, enum: [free_proxy, licensed_live, replay]}
      status: {type: string, enum: [succeeded, failed, skipped]}
      started_at: {type: string, format: date-time}
      finished_at: {type: string, format: date-time}
      latency_ms: {type: integer, minimum: 0}
      cost_usd: {type: [number, 'null'], minimum: 0}
      error_code: {type: [string, 'null'], maxLength: 128}
      retryable: {type: [boolean, 'null']}

  research_capability_manifest:
    type: object
    additionalProperties: false
    required: [schema_version, capability_id, version, kind, implementation_ref, input_schema_ref, output_schema_ref, permissions, allowed_domains, timeout_seconds, cost_policy_ref, freshness_policy_ref, license_status, audit_status, replay_policy, secret_policy]
    properties:
      schema_version: {type: string, const: research-capability-manifest.v1}
      capability_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
      version: {type: string, minLength: 1}
      kind: {type: string, enum: [dsh_plugin, mcp, provider, python_adapter, replay]}
      implementation_ref: {type: string, minLength: 1}
      input_schema_ref: {type: string, minLength: 1}
      output_schema_ref: {type: string, minLength: 1}
      permissions: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      allowed_domains: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      timeout_seconds: {type: integer, minimum: 1, maximum: 600}
      cost_policy_ref: {type: string, minLength: 1}
      freshness_policy_ref: {type: string, minLength: 1}
      license_status: {type: string, enum: [approved, review_required, denied]}
      audit_status: {type: string, enum: [approved, candidate, denied]}
      replay_policy: {type: string, enum: [archive_required, deterministic, unavailable]}
      secret_policy: {type: string, enum: [none, adapter_only, local_secret_store]}
      provider_routes:
        type: array
        items: {$ref: '#/$defs/provider_route'}
        maxItems: 20
        default: []

  evidence_requirement:
    type: object
    additionalProperties: false
    required: [requirement_id, description, importance, source_priority, authority_floor, preferred_capabilities, freshness_seconds, minimum_independent_sources, allowed_fallbacks, confidence_cap]
    properties:
      requirement_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
      description: {type: string, minLength: 1}
      importance: {type: string, enum: [hard, soft]}
      source_priority: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      authority_floor: {type: string, enum: [official, exchange, audited_aggregator, verified_web, search_derived, unverified]}
      preferred_capabilities: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      freshness_seconds: {type: integer, minimum: 0}
      minimum_independent_sources: {type: integer, minimum: 1, maximum: 10}
      allowed_fallbacks: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      confidence_cap: {type: number, minimum: 0, maximum: 1}
      # Optional semantic declarations preserve research-session.v1 compatibility.
      accepted_metric_families: {type: array, items: {type: string, minLength: 1}, uniqueItems: true, default: []}
      required_metric_families: {type: array, items: {type: string, minLength: 1}, uniqueItems: true, default: []}
      required_fields: {type: array, items: {type: string, minLength: 1}, uniqueItems: true, default: []}
      required_event_offsets: {type: array, items: {type: string, minLength: 1}, uniqueItems: true, default: []}
      unit_policy: {type: [string, 'null'], default: null}
      field_units:
        type: object
        additionalProperties: {$ref: '#/$defs/unit_list'}
        default: {}
      minimum_venues: {type: integer, minimum: 1, maximum: 20, default: 1}
      venue_required: {type: boolean, default: false}
      minimum_independence_groups: {type: integer, minimum: 1, maximum: 20, default: 1}
      allowed_delay_classes:
        type: array
        items: {type: string, enum: [realtime, delayed, historical, unknown]}
        uniqueItems: true
        default: []
      semantic_policy_ref: {type: [string, 'null'], default: null}

  evidence_candidate:
    type: object
    additionalProperties: false
    required: [evidence_id, requirement_id, kind, authority, source_id, source_url, published_at, observed_at, received_at, content_hash, excerpt, structured_payload_ref, tool_call_id, research_session_id, round, quality, freshness_status, conflict_group]
    properties:
      evidence_id: {type: string, minLength: 1}
      requirement_id: {type: string, minLength: 1}
      kind: {type: string, enum: [official, market, web, transcript, document]}
      authority: {type: string, enum: [official, exchange, audited_aggregator, verified_web, search_derived, unverified]}
      source_id: {type: string, minLength: 1}
      source_url: {type: [string, 'null'], format: uri}
      published_at: {type: [string, 'null'], format: date-time}
      observed_at: {type: string, format: date-time}
      received_at: {type: string, format: date-time}
      content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      excerpt: {type: string, minLength: 1, maxLength: 4000}
      # Optional v1 additions. The opaque ref addresses an immutable original
      # document asset; the excerpt remains the only source text placed in the
      # model context. Older evidence payloads remain valid without these.
      content_ref: {type: [string, 'null'], maxLength: 2048, default: null}
      # Immutable acquisition receipt that produced this candidate.  A
      # candidate may be admitted only after the receipt is verified by the
      # Kernel, which keeps browser/HTTP provenance separate from model text.
      acquisition_receipt_id: {type: [string, 'null'], maxLength: 128, default: null}
      source_content_hash: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$', default: null}
      parser_ref: {type: [string, 'null'], maxLength: 256, default: null}
      structured_payload_ref: {type: [string, 'null']}
      tool_call_id: {type: [string, 'null']}
      research_session_id: {type: string, minLength: 1}
      round: {type: integer, minimum: 1}
      quality: {type: string, enum: [candidate, accepted, rejected, stale, conflicted]}
      freshness_status: {type: string, enum: [fresh, stale, unknown]}
      conflict_group: {type: [string, 'null']}

  research_capability_query:
    type: object
    additionalProperties: false
    required: [schema_version, request_id, capability_id, requirement_id, query, target_url, symbols, fields, allowed_domains, max_results, max_cost_usd, research_session_id, round, mode, observed_at, cutoff_at]
    properties:
      schema_version: {type: string, const: research-capability-query.v1}
      request_id: {type: string, minLength: 1}
      capability_id: {type: string, minLength: 1}
      requirement_id: {type: string, minLength: 1}
      query: {type: string, minLength: 1, maxLength: 2000}
      target_url: {type: [string, 'null'], format: uri}
      symbols: {type: array, items: {type: string, minLength: 1}, maxItems: 20, uniqueItems: true}
      fields: {type: array, items: {type: string, minLength: 1}, maxItems: 50, uniqueItems: true}
      allowed_domains: {type: array, items: {type: string, minLength: 1}, maxItems: 100, uniqueItems: true}
      max_results: {type: integer, minimum: 1, maximum: 20}
      max_cost_usd: {type: [number, 'null'], minimum: 0}
      research_session_id: {type: string, minLength: 1}
      round: {type: integer, minimum: 1}
      mode: {type: string, enum: [live, replay]}
      observed_at: {type: string, format: date-time}
      requested_observed_at: {type: [string, 'null'], format: date-time}
      cutoff_at: {type: string, format: date-time}
      # Optional durable execution ceiling. The gateway stamps this for live
      # calls so provider fallback shares one remaining budget.
      deadline_at: {type: [string, 'null'], format: date-time, default: null}
      event_id: {type: [string, 'null'], maxLength: 128, default: null}
      event_at: {type: [string, 'null'], format: date-time, default: null}
      window_start_at: {type: [string, 'null'], format: date-time, default: null}
      window_end_at: {type: [string, 'null'], format: date-time, default: null}
      requested_event_offsets:
        type: array
        items: {type: string, minLength: 1, maxLength: 32}
        maxItems: 20
        uniqueItems: true
        default: []
      # Local document readback uses an Evidence id and optionally asserts its
      # content ref. It never accepts a filesystem path or performs a fetch.
      evidence_ref: {type: [string, 'null'], maxLength: 128, default: null}
      content_ref: {type: [string, 'null'], maxLength: 2048, default: null}

  research_capability_invocation:
    type: object
    additionalProperties: false
    required: [schema_version, request_id, capability_id, requirement_id, query, target_url, symbols, fields, allowed_domains, max_results, max_cost_usd, research_session_id]
    properties:
      schema_version: {type: string, const: research-capability-invocation.v1}
      request_id: {type: string, minLength: 1}
      capability_id: {type: string, minLength: 1}
      requirement_id: {type: string, minLength: 1}
      query: {type: string, minLength: 1, maxLength: 2000}
      target_url: {type: [string, 'null'], format: uri}
      symbols: {type: array, items: {type: string, minLength: 1}, maxItems: 20, uniqueItems: true}
      fields: {type: array, items: {type: string, minLength: 1}, maxItems: 50, uniqueItems: true}
      allowed_domains: {type: array, items: {type: string, minLength: 1}, maxItems: 100, uniqueItems: true}
      max_results: {type: integer, minimum: 1, maximum: 20}
      max_cost_usd: {type: [number, 'null'], minimum: 0}
      research_session_id: {type: string, minLength: 1}
      event_id: {type: [string, 'null'], maxLength: 128, default: null}
      event_at: {type: [string, 'null'], format: date-time, default: null}
      window_start_at: {type: [string, 'null'], format: date-time, default: null}
      window_end_at: {type: [string, 'null'], format: date-time, default: null}
      requested_event_offsets:
        type: array
        items: {type: string, minLength: 1, maxLength: 32}
        maxItems: 20
        uniqueItems: true
        default: []
      # Local document readback uses an Evidence id and optionally asserts its
      # content ref. It never accepts a filesystem path or performs a fetch.
      evidence_ref: {type: [string, 'null'], maxLength: 128, default: null}
      content_ref: {type: [string, 'null'], maxLength: 2048, default: null}

  research_capability_result:
    type: object
    additionalProperties: false
    required: [schema_version, request_id, capability_id, provider, evidence_candidates, cost_usd, completed_at]
    properties:
      schema_version: {type: string, const: research-capability-result.v1}
      request_id: {type: string, minLength: 1}
      capability_id: {type: string, minLength: 1}
      provider: {type: string, minLength: 1}
      evidence_candidates: {type: array, items: {$ref: '#/$defs/evidence_candidate'}, maxItems: 20}
      # Additive for v1 compatibility: legacy providers return no typed facts.
      facts:
        type: array
        items: {$ref: 'research_fact.schema.yaml#/$defs/fact_envelope'}
        maxItems: 200
        default: []
      cost_usd: {type: [number, 'null'], minimum: 0}
      completed_at: {type: string, format: date-time}
      provider_attempts:
        type: array
        items: {$ref: '#/$defs/provider_attempt'}
        maxItems: 20
        default: []

  research_run_queued:
    type: object
    additionalProperties: false
    required: [schema_version, event_id, run_id, status, status_url]
    properties:
      schema_version: {type: string, const: research-run-queued.v1}
      event_id: {type: string, minLength: 1, maxLength: 128}
      run_id: {type: string, minLength: 1, maxLength: 128}
      status: {type: string, const: queued}
      status_url: {type: string, minLength: 1, maxLength: 2048}

  research_runtime_case_report:
    type: object
    additionalProperties: false
    required: [schema_version, dataset_id, case_id, runtime_id, runtime_version, status, cutoff_at, started_at, finished_at, latency_ms, result_hash, result, hard_coverage_ratio, hard_gap_count, evidence_count, unattested_evidence_count, pit_violations, horizon_count, horizon_distinct, tool_calls, subagents, total_tokens, estimated_cost_usd, failure_code]
    properties:
      schema_version: {type: string, const: research-runtime-case-report.v1}
      dataset_id: {type: string, minLength: 1}
      case_id: {type: string, minLength: 1}
      runtime_id: {type: string, minLength: 1}
      runtime_version: {type: string, minLength: 1}
      status: {type: string, enum: [completed, degraded, failed, timeout]}
      cutoff_at: {type: string, format: date-time}
      started_at: {type: string, format: date-time}
      finished_at: {type: string, format: date-time}
      latency_ms: {type: [integer, 'null'], minimum: 0}
      result_hash: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
      result: {anyOf: [{$ref: '#/$defs/research_session_result'}, {type: 'null'}]}
      hard_coverage_ratio: {type: number, minimum: 0, maximum: 1}
      hard_gap_count: {type: integer, minimum: 0}
      evidence_count: {type: integer, minimum: 0}
      unattested_evidence_count: {type: integer, minimum: 0}
      pit_violations: {type: integer, minimum: 0}
      horizon_count: {type: integer, minimum: 0, maximum: 3}
      horizon_distinct: {type: boolean}
      tool_calls: {type: integer, minimum: 0}
      subagents: {type: integer, minimum: 0}
      total_tokens: {type: [integer, 'null'], minimum: 0}
      estimated_cost_usd: {type: [number, 'null'], minimum: 0}
      failure_code: {type: [string, 'null']}
      citation_support_ratio: {type: number, minimum: 0, maximum: 1, default: 0}
      quality_success: {type: boolean, default: false}
      manual_rework_flags: {type: array, items: {type: string, minLength: 1}, default: []}

  research_runtime_summary:
    type: object
    additionalProperties: false
    required: [runtime_id, runtime_version, sample_count, completed_count, failed_count, hard_coverage_mean, evidence_count, unattested_evidence_count, pit_violations, horizon_distinct_count, total_tool_calls, total_subagents, total_tokens, estimated_cost_usd, p95_latency_ms, failure_counts]
    properties:
      runtime_id: {type: string, minLength: 1}
      runtime_version: {type: string, minLength: 1}
      sample_count: {type: integer, minimum: 0}
      completed_count: {type: integer, minimum: 0}
      failed_count: {type: integer, minimum: 0}
      hard_coverage_mean: {type: number, minimum: 0, maximum: 1}
      evidence_count: {type: integer, minimum: 0}
      unattested_evidence_count: {type: integer, minimum: 0}
      pit_violations: {type: integer, minimum: 0}
      horizon_distinct_count: {type: integer, minimum: 0}
      total_tool_calls: {type: integer, minimum: 0}
      total_subagents: {type: integer, minimum: 0}
      total_tokens: {type: [integer, 'null'], minimum: 0}
      estimated_cost_usd: {type: [number, 'null'], minimum: 0}
      p95_latency_ms: {type: [integer, 'null'], minimum: 0}
      failure_counts:
        type: object
        additionalProperties: {type: integer, minimum: 1}
      citation_support_mean: {type: number, minimum: 0, maximum: 1, default: 0}
      quality_success_count: {type: integer, minimum: 0, default: 0}
      manual_rework_count: {type: integer, minimum: 0, default: 0}

  research_runtime_comparison:
    type: object
    additionalProperties: false
    required: [schema_version, experiment_id, dataset_id, dataset_manifest_hash, baseline_runtime_id, candidate_runtime_id, case_reports, summaries, conclusion]
    properties:
      schema_version: {type: string, const: research-runtime-comparison.v1}
      experiment_id: {type: string, minLength: 1}
      dataset_id: {type: string, minLength: 1}
      dataset_manifest_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      baseline_runtime_id: {type: string, minLength: 1}
      candidate_runtime_id: {type: string, minLength: 1}
      case_reports:
        type: array
        items: {$ref: '#/$defs/research_runtime_case_report'}
        minItems: 1
      summaries:
        type: array
        items: {$ref: '#/$defs/research_runtime_summary'}
        minItems: 2
        maxItems: 2
      conclusion: {type: string, enum: [pending, promotion_recommended, retain_baseline]}

  research_evaluation_capability_fixture:
    type: object
    additionalProperties: false
    required: [capability_id, requirement_id, query_aliases, evidence_candidates]
    properties:
      capability_id: {type: string, minLength: 1}
      requirement_id: {type: string, minLength: 1}
      query_aliases:
        type: array
        items: {type: string, minLength: 1, maxLength: 2000}
        minItems: 1
        uniqueItems: true
      evidence_candidates:
        type: array
        items: {$ref: '#/$defs/evidence_candidate'}
        minItems: 1
        maxItems: 20
      # Archived replay must retain the typed values that made the evidence
      # meaningful.  Keeping only excerpts makes event windows, units and
      # baselines impossible to verify during a later evaluation.
      facts:
        type: array
        items: {$ref: 'research_fact.schema.yaml#/$defs/fact_envelope'}
        maxItems: 200
        default: []

  research_evaluation_outcome_label:
    type: object
    additionalProperties: false
    required: [label_id, value, available_at, source_ref]
    properties:
      label_id: {type: string, minLength: 1}
      value: {type: string, minLength: 1}
      available_at: {type: string, format: date-time}
      source_ref: {type: string, minLength: 1}

  research_evaluation_case:
    type: object
    additionalProperties: false
    required: [schema_version, case_id, event_family, input_text, trigger_evidence, evidence_requirements, expected_hard_requirement_ids, archived_capability_fixtures, cutoff_at, outcome_available_at, outcome_labels, source_refs]
    properties:
      schema_version: {type: string, const: research-evaluation-case.v1}
      case_id: {type: string, pattern: '^[a-z][a-z0-9_.-]*$'}
      event_family: {type: string, enum: [central_bank_speech, monetary_policy_decision, inflation_release, labor_release, geopolitical_shock]}
      input_text: {type: string, minLength: 1, maxLength: 10000}
      trigger_evidence: {$ref: '#/$defs/research_input_evidence'}
      evidence_requirements:
        type: array
        items: {$ref: '#/$defs/evidence_requirement'}
        minItems: 1
      expected_hard_requirement_ids:
        type: array
        items: {type: string, minLength: 1}
        minItems: 1
        uniqueItems: true
      archived_capability_fixtures:
        type: array
        items: {$ref: '#/$defs/research_evaluation_capability_fixture'}
        minItems: 1
      cutoff_at: {type: string, format: date-time}
      outcome_available_at: {type: [string, 'null'], format: date-time}
      outcome_labels:
        type: array
        items: {$ref: '#/$defs/research_evaluation_outcome_label'}
      source_refs:
        type: array
        items: {type: string, minLength: 1}
        minItems: 1
        uniqueItems: true

  research_snapshot_manifest:
    type: object
    additionalProperties: false
    required: [schema_version, snapshot_id, run_id, event_id, snapshot_type, generation, parent_snapshot_id, cutoff_at, snapshot_hash, evidence_refs, pack_version, created_at]
    properties:
      schema_version: {type: string, const: research-snapshot-manifest.v1}
      snapshot_id: {type: string, minLength: 1}
      run_id: {type: string, minLength: 1}
      event_id: {type: string, minLength: 1}
      snapshot_type: {type: string, enum: [trigger, decision]}
      generation: {type: integer, minimum: 1}
      parent_snapshot_id: {type: [string, 'null']}
      cutoff_at: {type: string, format: date-time}
      snapshot_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      pack_version: {type: string, minLength: 1}
      created_at: {type: string, format: date-time}

  evidence_gap:
    type: object
    additionalProperties: false
    required: [requirement_id, importance, reason_code, query_hint, attempted_capabilities, blocks_directional_output]
    properties:
      requirement_id: {type: string, minLength: 1}
      importance: {type: string, enum: [hard, soft]}
      reason_code: {type: string, enum: [missing, stale, low_authority, insufficient_sources, conflict, tool_unavailable, semantic_mismatch, no_baseline, window_missing]}
      query_hint: {type: string, minLength: 1}
      attempted_capabilities: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      blocks_directional_output: {type: boolean}

  conflict_item:
    type: object
    additionalProperties: false
    required: [conflict_id, requirement_id, evidence_refs, severity, summary, resolution_status]
    properties:
      conflict_id: {type: string, minLength: 1}
      requirement_id: {type: string, minLength: 1}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, minItems: 2, uniqueItems: true}
      severity: {type: string, enum: [hard, soft]}
      summary: {type: string, minLength: 1}
      resolution_status: {type: string, enum: [open, resolved, bounded_stop]}

  coverage_assessment:
    type: object
    additionalProperties: false
    required: [status, covered_requirement_ids, gaps, conflicts, hard_coverage_ratio, soft_coverage_ratio, assessed_at]
    properties:
      status: {type: string, enum: [insufficient, sufficient, bounded_stop]}
      covered_requirement_ids: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      gaps: {type: array, items: {$ref: '#/$defs/evidence_gap'}}
      conflicts: {type: array, items: {$ref: '#/$defs/conflict_item'}}
      hard_coverage_ratio: {type: number, minimum: 0, maximum: 1}
      soft_coverage_ratio: {type: number, minimum: 0, maximum: 1}
      assessed_at: {type: string, format: date-time}

  research_task:
    type: object
    additionalProperties: false
    required: [task_id, requirement_id, capability_id, objective, question, input_evidence_refs, output_schema_ref, depends_on, success_condition, priority]
    properties:
      task_id: {type: string, minLength: 1}
      requirement_id: {type: string, minLength: 1}
      capability_id: {type: string, minLength: 1}
      objective: {type: string, minLength: 1}
      question: {type: string, minLength: 1}
      input_evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      output_schema_ref: {type: string, minLength: 1}
      depends_on: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      success_condition: {type: string, minLength: 1}
      priority: {type: integer, minimum: 1, maximum: 100}

  research_task_policy:
    type: object
    additionalProperties: false
    required: [policy_id, policy_version, research_mode, requirement_ids, max_parallel_tasks, max_context_items, max_excerpt_chars, max_evidence_rounds, content_hash, created_at]
    properties:
      policy_id: {type: string, minLength: 1}
      policy_version: {type: string, minLength: 1}
      research_mode: {type: string, enum: [historical_review, current_decision]}
      requirement_ids: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      max_parallel_tasks: {type: integer, minimum: 1, maximum: 2}
      max_context_items: {type: integer, minimum: 1, maximum: 50}
      max_excerpt_chars: {type: integer, minimum: 1000, maximum: 4000}
      max_evidence_rounds: {type: integer, minimum: 1, maximum: 10}
      content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      created_at: {type: string, format: date-time}

  context_exclusion:
    type: object
    additionalProperties: false
    required: [evidence_ref, reason]
    properties:
      evidence_ref: {type: string, minLength: 1}
      reason: {type: string, minLength: 1}

  research_context_manifest:
    type: object
    additionalProperties: false
    required: [manifest_id, policy_ref, revision, selected_inputs, effective_inputs, excluded_inputs, rules_ref, tool_versions, data_versions, input_fingerprint, created_at]
    properties:
      manifest_id: {type: string, minLength: 1}
      policy_ref: {type: string, minLength: 1}
      revision: {type: integer, minimum: 1}
      selected_inputs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      effective_inputs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      excluded_inputs: {type: array, items: {$ref: '#/$defs/context_exclusion'}, maxItems: 50}
      rules_ref: {type: string, minLength: 1}
      tool_versions: {type: object, additionalProperties: {type: string}}
      data_versions: {type: object, additionalProperties: {type: string}}
      input_fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
      created_at: {type: string, format: date-time}

  research_review:
    type: object
    additionalProperties: false
    required: [review_id, role, target_claim, evidence_refs, result_hash, challenge, resolution, limitations, created_at]
    properties:
      review_id: {type: string, minLength: 1}
      role: {type: string, enum: [independent_reviewer, data_reviewer, policy_reviewer]}
      target_claim: {type: string, minLength: 1}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      result_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      challenge: {type: string, minLength: 1}
      resolution: {type: string, enum: [accepted, bounded, requires_new_evidence, rejected]}
      limitations: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      created_at: {type: string, format: date-time}

  research_plan:
    type: object
    additionalProperties: false
    required: [plan_id, objective, tasks, required_capabilities, created_at]
    properties:
      plan_id: {type: string, minLength: 1}
      objective: {type: string, minLength: 1}
      tasks: {type: array, items: {$ref: '#/$defs/research_task'}, minItems: 1}
      required_capabilities: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      created_at: {type: string, format: date-time}

  tool_invocation:
    type: object
    additionalProperties: false
    required: [tool_call_id, capability_id, tool_name, query_summary, started_at, finished_at, status, attempt, latency_ms, cost_usd, error_code]
    properties:
      tool_call_id: {type: string, minLength: 1}
      capability_id: {type: string, minLength: 1}
      requirement_id: {type: [string, 'null'], minLength: 1}
      tool_name: {type: string, minLength: 1}
      query_summary: {type: string, minLength: 1, maxLength: 1000}
      started_at: {type: string, format: date-time}
      finished_at: {type: [string, 'null'], format: date-time}
      status: {type: string, enum: [running, succeeded, failed, denied, timed_out]}
      attempt: {type: integer, minimum: 1}
      latency_ms: {type: [integer, 'null'], minimum: 0}
      cost_usd: {type: [number, 'null'], minimum: 0}
      error_code: {type: [string, 'null']}
      error: {anyOf: [{$ref: '#/$defs/error_provenance'}, {type: 'null'}]}

  tool_result_summary:
    type: object
    additionalProperties: false
    required: [tool_call_id, status, summary, evidence_refs, content_ref, content_hash, received_at, error_code]
    properties:
      tool_call_id: {type: string, minLength: 1}
      status: {type: string, enum: [succeeded, failed, denied, timed_out]}
      summary: {type: string, minLength: 1, maxLength: 2000}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      content_ref: {type: [string, 'null']}
      content_hash: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
      received_at: {type: string, format: date-time}
      error_code: {type: [string, 'null']}
      error: {anyOf: [{$ref: '#/$defs/error_provenance'}, {type: 'null'}]}

  error_provenance:
    type: object
    additionalProperties: false
    required: [error_code, origin, cause_code, capability_id, tool_call_id, retryable, deadline_ms]
    properties:
      error_code: {type: string, minLength: 1}
      origin: {type: string, enum: [provider, transport, mcp, dsh, gateway, pit, orchestration, source_registry, storage]}
      cause_code: {type: [string, 'null']}
      capability_id: {type: [string, 'null']}
      tool_call_id: {type: [string, 'null']}
      retryable: {type: boolean}
      deadline_ms: {type: [integer, 'null'], minimum: 0}
      # Additive route lineage: a failed stable capability may have tried
      # multiple approved providers before the durable error was recorded.
      provider_attempts:
        type: array
        items: {$ref: '#/$defs/provider_attempt'}
        maxItems: 20
        default: []

  research_round:
    type: object
    additionalProperties: false
    required: [round, plan, tool_invocations, tool_results, new_evidence_refs, coverage, started_at, finished_at]
    properties:
      round: {type: integer, minimum: 1}
      plan: {$ref: '#/$defs/research_plan'}
      tool_invocations: {type: array, items: {$ref: '#/$defs/tool_invocation'}}
      tool_results: {type: array, items: {$ref: '#/$defs/tool_result_summary'}}
      new_evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      coverage: {$ref: '#/$defs/coverage_assessment'}
      started_at: {type: string, format: date-time}
      finished_at: {type: string, format: date-time}

  research_round_view:
    type: object
    additionalProperties: false
    required: [round, plan, tool_invocations, tool_results, new_evidence_refs, coverage, started_at, finished_at]
    properties:
      round: {type: integer, minimum: 1}
      plan: {$ref: '#/$defs/research_plan'}
      tool_invocations: {type: array, items: {$ref: '#/$defs/tool_invocation'}}
      tool_results: {type: array, items: {$ref: '#/$defs/tool_result_summary'}}
      new_evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      coverage: {anyOf: [{$ref: '#/$defs/coverage_assessment'}, {type: 'null'}]}
      started_at: {type: string, format: date-time}
      finished_at: {type: string, format: date-time}

  causal_link:
    type: object
    additionalProperties: false
    required: [link_id, claim_type, statement, evidence_refs, confirmation, invalidation, affected_horizons]
    properties:
      link_id: {type: string, minLength: 1}
      claim_type: {type: string, enum: [fact, inference, scenario]}
      statement: {type: string, minLength: 1}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      confirmation: {type: string, minLength: 1}
      invalidation: {type: string, minLength: 1}
      affected_horizons:
        type: array
        items: {type: string, enum: [30m, 24h, 72h]}
        minItems: 1
        uniqueItems: true

  causal_case:
    type: object
    additionalProperties: false
    required: [case_id, thesis, main_chain, opposite_chain, unresolved_questions, evidence_refs]
    properties:
      case_id: {type: string, minLength: 1}
      thesis: {type: string, minLength: 1}
      main_chain: {type: array, items: {$ref: '#/$defs/causal_link'}, minItems: 1}
      opposite_chain: {type: array, items: {$ref: '#/$defs/causal_link'}, minItems: 1}
      unresolved_questions: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}

  horizon_decision:
    type: object
    additionalProperties: false
    required: [horizon, action, subjective_probability, probability_status, evidence_refs, trigger, invalidation, expires_at, next_review_at, missing_facts, confidence_cap_reason]
    properties:
      horizon: {type: string, enum: [30m, 24h, 72h]}
      action: {type: string, enum: [long, short, neutral, no_trade]}
      subjective_probability: {type: number, minimum: 0, maximum: 1}
      probability_status: {type: string, enum: [uncalibrated, calibrated]}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      trigger: {type: string, minLength: 1}
      invalidation: {type: string, minLength: 1}
      expires_at: {type: string, format: date-time}
      next_review_at: {type: string, format: date-time}
      missing_facts: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      confidence_cap_reason: {type: [string, 'null']}

  research_stop_reason:
    type: object
    additionalProperties: false
    required: [code, detail, bounded, remaining_hard_gaps]
    properties:
      code: {type: string, enum: [sufficient, deadline, cost_budget, tool_budget, round_budget, permission_denied, critical_data_unavailable, no_progress, no_actionable_path, synthesis_incomplete, mixed, runtime_unavailable, cancelled]}
      detail: {type: string, minLength: 1}
      bounded: {type: boolean}
      remaining_hard_gaps: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}

  research_input_evidence:
    type: object
    additionalProperties: false
    required: [evidence_id, kind, authority, source_id, source_url, published_at, observed_at, received_at, content_hash, excerpt]
    properties:
      evidence_id: {type: string, minLength: 1}
      kind: {type: string, enum: [official, market, web, transcript, document]}
      authority: {type: string, enum: [official, exchange, audited_aggregator, verified_web, search_derived, unverified]}
      source_id: {type: string, minLength: 1}
      source_url: {type: [string, 'null'], format: uri}
      published_at: {type: [string, 'null'], format: date-time}
      observed_at: {type: string, format: date-time}
      received_at: {type: string, format: date-time}
      content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      excerpt: {type: string, minLength: 1, maxLength: 4000}

  research_session_request:
    type: object
    additionalProperties: false
    required: [schema_version, request_id, run_id, event_id, trigger_snapshot_id, domain_pack_ref, role_profile_ref, execution_mode, pit_cutoff_at, current_round, evidence_refs, input_evidence, evidence_requirements, target_gaps, allowed_capabilities, execution_budget, deadline_at, output_schema_ref, repair_instructions]
    properties:
      schema_version: {type: string, const: research-session-request.v1}
      request_id: {type: string, minLength: 1}
      run_id: {type: string, minLength: 1}
      event_id: {type: string, minLength: 1}
      trigger_snapshot_id: {type: string, minLength: 1}
      domain_pack_ref: {type: string, minLength: 1}
      role_profile_ref: {type: string, minLength: 1}
      execution_mode: {type: string, enum: [live, replay]}
      # Controls which evidence contract applies. Historical reviews must not
      # be blocked by current-trading-window requirements.
      research_mode: {type: string, enum: [historical_review, current_decision], default: current_decision}
      task_policy_ref: {type: [string, 'null'], minLength: 1, default: null}
      context_manifest: {anyOf: [{$ref: '#/$defs/research_context_manifest'}, {type: 'null'}], default: null}
      pit_cutoff_at: {type: string, format: date-time}
      current_round: {type: integer, minimum: 1, maximum: 10}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      input_evidence: {type: array, items: {$ref: '#/$defs/research_input_evidence'}, minItems: 1, maxItems: 50}
      evidence_requirements: {type: array, items: {$ref: '#/$defs/evidence_requirement'}, minItems: 1}
      target_gaps: {type: array, items: {$ref: '#/$defs/evidence_gap'}, maxItems: 50}
      # Optional planning projection from the Hub-owned durable EventWatch.
      # Older request producers remain valid; null means no trusted watch exists.
      event_watch:
        anyOf: [{$ref: '#/$defs/event_watch'}, {type: 'null'}]
        default: null
      event_window_samples:
        type: array
        items: {$ref: '#/$defs/event_window_sample'}
        maxItems: 32
        default: []
      allowed_capabilities: {type: array, items: {type: string, minLength: 1}, minItems: 1, uniqueItems: true}
      execution_budget: {$ref: '#/$defs/execution_budget'}
      deadline_at: {type: string, format: date-time}
      output_schema_ref: {type: string, minLength: 1}
      repair_instructions: {type: [string, 'null'], maxLength: 4000}

  research_synthesis_candidate:
    type: object
    additionalProperties: false
    required: [schema_version, request_id, causal_case, horizons]
    properties:
      schema_version: {type: string, const: research-synthesis-candidate.v1}
      request_id: {type: string, minLength: 1}
      causal_case: {anyOf: [{$ref: '#/$defs/causal_case'}, {type: 'null'}]}
      horizons: {type: array, items: {$ref: '#/$defs/horizon_decision'}, maxItems: 3}

  research_session_result:
    type: object
    additionalProperties: false
    required: [schema_version, request_id, research_session_id, runtime_id, runtime_version, profile_ref, trace_ref, trace_hash, status, rounds, evidence_candidates, final_coverage, causal_case, horizons, stop_reason, total_tool_calls, total_subagents, total_tokens, estimated_cost_usd, started_at, finished_at]
    properties:
      schema_version: {type: string, const: research-session-result.v1}
      request_id: {type: string, minLength: 1}
      research_session_id: {type: string, minLength: 1}
      runtime_id: {type: string, minLength: 1}
      runtime_version: {type: string, minLength: 1}
      profile_ref: {type: string, minLength: 1}
      trace_ref: {type: string, minLength: 1}
      trace_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      status: {type: string, enum: [completed, degraded, failed, cancelled]}
      rounds: {type: array, items: {$ref: '#/$defs/research_round'}, minItems: 1}
      evidence_candidates: {type: array, items: {$ref: '#/$defs/evidence_candidate'}}
      # Additive for v1 compatibility. The Hub persists these independently,
      # while the runtime result carries the exact attested projection.
      facts:
        type: array
        items: {$ref: 'research_fact.schema.yaml#/$defs/fact_envelope'}
        maxItems: 1000
        default: []
      final_coverage: {$ref: '#/$defs/coverage_assessment'}
      causal_case: {anyOf: [{$ref: '#/$defs/causal_case'}, {type: 'null'}]}
      horizons: {type: array, items: {$ref: '#/$defs/horizon_decision'}, maxItems: 3}
      stop_reason: {$ref: '#/$defs/research_stop_reason'}
      # Set only when the model synthesis was rejected after trusted
      # capability progress had already been retained. This marker is not a
      # model claim; it is produced by the runtime adapter.
      synthesis_failure_code: {type: [string, 'null'], maxLength: 128}
      context_manifest: {anyOf: [{$ref: '#/$defs/research_context_manifest'}, {type: 'null'}], default: null}
      reviews: {type: array, items: {$ref: '#/$defs/research_review'}, maxItems: 10, default: []}
      total_tool_calls: {type: integer, minimum: 0}
      total_subagents: {type: integer, minimum: 0}
      total_tokens: {type: [integer, 'null'], minimum: 0}
      estimated_cost_usd: {type: [number, 'null'], minimum: 0}
      started_at: {type: string, format: date-time}
      finished_at: {type: string, format: date-time}

  research_trace_event:
    type: object
    additionalProperties: false
    required: [schema_version, run_id, research_session_id, sequence_no, event_type, occurred_at, stage, summary, reference_type, reference_id, status, error_code]
    properties:
      schema_version: {type: string, const: research-trace-event.v1}
      run_id: {type: string, minLength: 1}
      research_session_id: {type: string, minLength: 1}
      sequence_no: {type: integer, minimum: 0}
      event_type: {type: string, enum: [session_started, plan_created, task_started, model_step_started, model_step_completed, tool_started, tool_completed, tool_failed, subagent_started, subagent_completed, evidence_accepted, evidence_rejected, coverage_assessed, replan, round_completed, synthesis_started, session_stopped]}
      occurred_at: {type: string, format: date-time}
      stage: {type: string, minLength: 1}
      summary: {type: string, minLength: 1, maxLength: 2000}
      reference_type: {type: [string, 'null']}
      reference_id: {type: [string, 'null']}
      status: {type: string, enum: [running, succeeded, failed, degraded, denied]}
      error_code: {type: [string, 'null']}
      error: {anyOf: [{$ref: '#/$defs/error_provenance'}, {type: 'null'}]}
      error_verification: {type: [string, 'null'], enum: [legacy_provider_attempts_unverifiable, null], default: null}

  research_run_view:
    type: object
    additionalProperties: false
    required: [schema_version, run_id, event_id, event_title, admission_origin, priority, status, stage, runtime_id, profile_ref, current_round, budget, coverage, current_action, stop_reason, latest_sequence_no, artifact_id, available_at, parent_run_id, created_at, updated_at]
    properties:
      schema_version: {type: string, const: research-run-view.v2}
      run_id: {type: string, minLength: 1}
      event_id: {type: string, minLength: 1}
      event_title: {type: string, minLength: 1}
      admission_origin: {type: string, enum: [manual, automatic, scheduled_recheck, legacy]}
      priority: {type: string, enum: [critical, high, normal, low]}
      status: {type: string, enum: [admitted, queued, researching, retry_wait, completed, degraded, research_only, rejected, failed, cancelled]}
      stage: {type: string, enum: [admission, planning, acquiring_evidence, assessing_sufficiency, synthesis, gate, monitoring, done]}
      runtime_id: {type: string, minLength: 1}
      profile_ref: {type: [string, 'null'], minLength: 1}
      current_round: {type: integer, minimum: 0}
      budget: {anyOf: [{$ref: '#/$defs/execution_budget'}, {type: 'null'}]}
      budget_basis: {type: string, enum: [saved_request, unavailable, invalid], default: unavailable}
      coverage: {anyOf: [{$ref: '#/$defs/coverage_assessment'}, {type: 'null'}]}
      coverage_basis: {type: [string, 'null'], enum: [saved_result, saved_request, saved_task_request, saved_checkpoint, round_request_only, unavailable, invalid, null]}
      coverage_cutoff_at: {type: [string, 'null'], format: date-time}
      current_action: {type: [string, 'null']}
      stop_reason: {anyOf: [{$ref: '#/$defs/research_stop_reason'}, {type: 'null'}]}
      failure: {anyOf: [{$ref: '#/$defs/error_provenance'}, {type: 'null'}]}
      latest_sequence_no: {type: integer, minimum: 0}
      artifact_id: {type: [string, 'null']}
      available_at: {type: [string, 'null'], format: date-time}
      parent_run_id: {type: [string, 'null']}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}

  research_action_summary:
    type: object
    additionalProperties: false
    required: [schema_version, recommendation, headline, rationale, reliability, trade_authorized, artifact_status, data_status, accepted_evidence_count, stale_evidence_count, rejected_evidence_count, blocking_gap_ids, warning_codes, supporting_evidence_refs, next_review_at]
    properties:
      schema_version: {type: string, const: research-action-summary.v1}
      recommendation: {type: string, enum: [do_not_trade, wait_for_confirmation, manual_review_required, unavailable]}
      headline: {type: string, minLength: 1, maxLength: 500}
      rationale: {type: string, minLength: 1, maxLength: 2000}
      reliability: {type: string, enum: [unavailable, low, limited, reviewable]}
      trade_authorized: {type: boolean, const: false}
      artifact_status: {type: string, enum: [pending, saved, limited, rejected]}
      data_status: {type: string, enum: [insufficient, partial, sufficient]}
      accepted_evidence_count: {type: integer, minimum: 0}
      stale_evidence_count: {type: integer, minimum: 0}
      rejected_evidence_count: {type: integer, minimum: 0}
      blocking_gap_ids: {type: array, items: {type: string, minLength: 1}}
      warning_codes: {type: array, items: {type: string, minLength: 1}}
      supporting_evidence_refs: {type: array, items: {type: string, minLength: 1}}
      next_review_at: {type: [string, 'null'], format: date-time}
      research_outlook: {anyOf: [{$ref: '#/$defs/research_outlook'}, {type: 'null'}], default: null}
      market_view: {anyOf: [{$ref: '#/$defs/research_market_view'}, {type: 'null'}], default: null}
      execution_view: {anyOf: [{$ref: '#/$defs/research_execution_view'}, {type: 'null'}], default: null}

  research_strategy_receipt:
    type: object
    additionalProperties: false
    required: [schema_version, strategy_version, data_hash, bar_count, as_of, parameters, features, outlook, action_candidate, trigger, counter_case, invalidation, rationale, evidence_refs, probability, probability_status]
    properties:
      schema_version: {type: string, const: strategy-receipt.v1}
      strategy_version: {type: string, minLength: 1}
      data_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      bar_count: {type: integer, minimum: 1}
      as_of: {type: string, minLength: 1}
      parameters: {type: object, additionalProperties: {type: integer, minimum: 1}}
      features: {type: object, additionalProperties: {type: number}}
      outlook: {type: string, enum: [bullish, bearish, range, unresolved]}
      action_candidate: {type: string, minLength: 1, maxLength: 500}
      trigger: {type: string, minLength: 1, maxLength: 1000}
      counter_case: {type: string, minLength: 1, maxLength: 1000}
      invalidation: {type: string, minLength: 1, maxLength: 1000}
      rationale: {type: string, minLength: 1, maxLength: 2000}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      probability: {type: [number, 'null'], minimum: 0, maximum: 1}
      probability_status: {type: string, enum: [unavailable, uncalibrated, calibrated]}

  research_outlook:
    type: object
    additionalProperties: false
    required: [schema_version, horizon, outlook, basis, action_candidate, trigger, counter_case, rationale, invalidation, evidence_refs, missing_impact, probability, probability_status, strategy_status, execution_permission, strategy_receipt]
    properties:
      schema_version: {type: string, const: research-outlook.v1}
      horizon: {type: string, const: 7d}
      outlook: {type: string, enum: [bullish, bearish, range, unresolved]}
      basis: {type: string, enum: [rule_based, statistical, hybrid]}
      action_candidate: {type: string, minLength: 1, maxLength: 500}
      trigger: {type: string, minLength: 1, maxLength: 1000}
      counter_case: {type: string, minLength: 1, maxLength: 1000}
      rationale: {type: string, minLength: 1, maxLength: 2000}
      invalidation: {type: string, minLength: 1, maxLength: 1000}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      missing_impact: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      probability: {type: [number, 'null'], minimum: 0, maximum: 1}
      probability_status: {type: string, enum: [unavailable, uncalibrated, calibrated]}
      strategy_status: {type: string, enum: [baseline_only, unvalidated, calibrated, rejected]}
      execution_permission: {type: boolean, const: false}
      strategy_receipt: {anyOf: [{$ref: '#/$defs/research_strategy_receipt'}, {type: 'null'}]}

  # Native decision projection. ``research_outlook`` remains the legacy
  # daily-strategy receipt projection; these objects make the semantic
  # separation explicit at the API boundary so execution status cannot erase
  # a directional research view.
  research_market_view:
    type: object
    additionalProperties: false
    required: [schema_version, horizon, direction, basis, rationale, evidence_refs, probability, probability_status, action_candidate, counter_case, invalidation, missing_impact]
    properties:
      schema_version: {type: string, const: market-view.v1}
      horizon: {type: string, const: 7d}
      direction: {type: string, enum: [bullish, bearish, range, unresolved]}
      basis: {type: string, enum: [rule_based, composite, calibrated]}
      rationale: {type: string, minLength: 1, maxLength: 2000}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      probability: {type: [number, 'null'], minimum: 0, maximum: 1}
      probability_status: {type: string, enum: [unavailable, uncalibrated, calibrated]}
      action_candidate: {type: string, minLength: 1, maxLength: 500}
      counter_case: {type: string, minLength: 1, maxLength: 1000}
      invalidation: {type: string, minLength: 1, maxLength: 1000}
      missing_impact: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}

  research_execution_view:
    type: object
    additionalProperties: false
    required: [schema_version, status, action_candidate, reasons, blocking_gap_ids, trade_authorized]
    properties:
      schema_version: {type: string, const: execution-view.v1}
      status: {type: string, enum: [blocked, manual_review, authorized]}
      action_candidate: {type: string, minLength: 1, maxLength: 500}
      reasons: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      blocking_gap_ids: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      trade_authorized: {type: boolean}

  research_process_step:
    type: object
    additionalProperties: false
    required: [step_id, order, kind, label, status, objective, outcome, evidence_refs, tool_call_refs, warning_codes, occurred_at]
    properties:
      step_id: {type: string, minLength: 1}
      order: {type: integer, minimum: 1}
      kind: {type: string, enum: [intake, plan, acquire, assess, review, replan, synthesize, gate]}
      label: {type: string, minLength: 1, maxLength: 200}
      status: {type: string, enum: [waiting, running, completed, limited, failed]}
      objective: {type: string, minLength: 1, maxLength: 1000}
      outcome: {type: string, minLength: 1, maxLength: 2000}
      evidence_refs: {type: array, items: {type: string, minLength: 1}}
      tool_call_refs: {type: array, items: {type: string, minLength: 1}}
      warning_codes: {type: array, items: {type: string, minLength: 1}}
      occurred_at: {type: [string, 'null'], format: date-time}

  # Read-only explanation graph projected from attested research artifacts.
  # The graph is deliberately a projection contract: it exposes the claims,
  # evidence and gates that produced a decision without pretending to expose
  # hidden model chain-of-thought.
  decision_graph_node:
    type: object
    additionalProperties: false
    required: [node_id, node_type, label, status, summary, evidence_refs]
    properties:
      node_id: {type: string, minLength: 1}
      node_type: {type: string, enum: [trigger, evidence, coverage, causal_claim, horizon, action, gate, invalidation, review, stop, assumption]}
      label: {type: string, minLength: 1, maxLength: 200}
      status: {type: string, enum: [confirmed, supporting, opposing, derived, unresolved, blocked, scheduled]}
      summary: {type: string, minLength: 1, maxLength: 2000}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}

  decision_graph_edge:
    type: object
    additionalProperties: false
    required: [edge_id, from_node, to_node, relation, label]
    properties:
      edge_id: {type: string, minLength: 1}
      from_node: {type: string, minLength: 1}
      to_node: {type: string, minLength: 1}
      relation: {type: string, enum: [supports, contradicts, derived_from, gates, invalidates, reviews, follows, bounded_by]}
      label: {type: string, minLength: 1, maxLength: 300}

  decision_graph:
    type: object
    additionalProperties: false
    required: [schema_version, graph_status, generation_mode, nodes, edges, stop_reason]
    properties:
      schema_version: {type: string, const: decision-graph.v1}
      graph_status: {type: string, enum: [causal, bounded_fallback, unavailable]}
      generation_mode: {type: string, enum: [causal_case, evidence_projection, rule_projection]}
      nodes: {type: array, items: {$ref: '#/$defs/decision_graph_node'}, maxItems: 200}
      edges: {type: array, items: {$ref: '#/$defs/decision_graph_edge'}, maxItems: 400}
      stop_reason: {type: [string, 'null'], maxLength: 1000}

  # Durable role packets are a public projection of specialist work. They
  # contain only typed claims, evidence and gaps; they never expose private
  # model chain-of-thought.
  research_claim_transition:
    type: object
    additionalProperties: false
    required: [schema_version, transition_id, round, from_direction, to_direction, changed, reason, evidence_refs, gap_ids, created_at]
    properties:
      schema_version: {type: string, const: claim-transition.v1}
      transition_id: {type: string, minLength: 1}
      round: {type: integer, minimum: 1}
      from_direction: {type: [string, 'null'], enum: [bullish, bearish, range, unresolved, null]}
      to_direction: {type: [string, 'null'], enum: [bullish, bearish, range, unresolved, null]}
      changed: {type: boolean}
      reason: {type: string, minLength: 1, maxLength: 2000}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      gap_ids: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      created_at: {type: string, format: date-time}

  research_role_packet:
    type: object
    additionalProperties: false
    required: [schema_version, packet_id, role, round, status, claims, evidence_refs, gap_ids, transition_ids, conclusion, created_at]
    properties:
      schema_version: {type: string, const: role-packet.v1}
      packet_id: {type: string, minLength: 1}
      role: {type: string, enum: [manager, market_structure, derivatives_crowding, macro_calendar, cross_asset_risk, narrative_source_critic, counter_thesis, data_quality, reviewer, synthesizer]}
      round: {type: integer, minimum: 1}
      status: {type: string, enum: [sufficient, partial, blocked]}
      claims: {type: array, items: {type: string, minLength: 1}, maxItems: 20}
      evidence_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      gap_ids: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      transition_ids: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      conclusion: {type: string, minLength: 1, maxLength: 2000}
      created_at: {type: string, format: date-time}

  research_run_comparison_view:
    type: object
    additionalProperties: false
    required: [schema_version, run_id, previous_run_id, same_event, current_status, previous_status, current_evidence_count, previous_evidence_count, current_graph_status, previous_graph_status, current_direction, previous_direction, changed_fields, compared_at]
    properties:
      schema_version: {type: string, const: research-run-comparison-view.v1}
      run_id: {type: string, minLength: 1}
      previous_run_id: {type: [string, 'null']}
      same_event: {type: boolean}
      current_status: {type: string, minLength: 1}
      previous_status: {type: [string, 'null']}
      current_evidence_count: {type: integer, minimum: 0}
      previous_evidence_count: {type: [integer, 'null'], minimum: 0}
      current_graph_status: {type: string, enum: [causal, bounded_fallback, unavailable]}
      previous_graph_status: {type: [string, 'null'], enum: [causal, bounded_fallback, unavailable, null]}
      current_direction: {type: [string, 'null']}
      previous_direction: {type: [string, 'null']}
      changed_fields: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      compared_at: {type: string, format: date-time}

  research_run_detail_view:
    type: object
    additionalProperties: false
    required: [schema_version, run, trigger_snapshot, decision_snapshot, evidence, rounds, causal_case, horizons, trace, action_summary, process_steps, total_tool_calls, total_subagents, total_tokens, estimated_cost_usd, scheduled_recheck_at]
    properties:
      schema_version: {type: string, const: research-run-detail-view.v1}
      run: {$ref: '#/$defs/research_run_view'}
      research_focus: {type: [string, 'null'], default: null, description: 'Full saved user focus for a Desk snapshot request; empty means the default template, null means unavailable or not applicable.'}
      trigger_snapshot: {anyOf: [{$ref: '#/$defs/research_snapshot_manifest'}, {type: 'null'}]}
      decision_snapshot: {anyOf: [{$ref: '#/$defs/research_snapshot_manifest'}, {type: 'null'}]}
      evidence: {type: array, items: {$ref: '#/$defs/evidence_candidate'}}
      rounds: {type: array, items: {$ref: '#/$defs/research_round_view'}}
      causal_case: {anyOf: [{$ref: '#/$defs/causal_case'}, {type: 'null'}]}
      horizons: {type: array, items: {$ref: '#/$defs/horizon_decision'}, maxItems: 3}
      trace: {type: array, items: {$ref: '#/$defs/research_trace_event'}}
      action_summary: {$ref: '#/$defs/research_action_summary'}
      process_steps: {type: array, items: {$ref: '#/$defs/research_process_step'}, minItems: 1, maxItems: 100}
      total_tool_calls: {type: integer, minimum: 0}
      total_subagents: {type: integer, minimum: 0}
      total_tokens: {type: [integer, 'null'], minimum: 0}
      estimated_cost_usd: {type: [number, 'null'], minimum: 0}
      scheduled_recheck_at: {type: [string, 'null'], format: date-time}
      decision_graph: {anyOf: [{$ref: '#/$defs/decision_graph'}, {type: 'null'}], default: null}
      context_manifest: {anyOf: [{$ref: '#/$defs/research_context_manifest'}, {type: 'null'}], default: null}
      reviews: {type: array, items: {$ref: '#/$defs/research_review'}, maxItems: 10, default: []}
      role_packets: {type: array, items: {$ref: '#/$defs/research_role_packet'}, maxItems: 20, default: []}
      claim_transitions: {type: array, items: {$ref: '#/$defs/research_claim_transition'}, maxItems: 50, default: []}

  research_run_command:
    type: object
    additionalProperties: false
    required: [schema_version, request_id, command, reason]
    properties:
      schema_version: {type: string, const: research-run-command.v1}
      request_id: {type: string, minLength: 1}
      command: {type: string, enum: [cancel, retry, recheck, feedback]}
      reason: {type: string, minLength: 1}

  research_run_command_result:
    type: object
    additionalProperties: false
    required: [schema_version, request_id, command, source_run_id, target_run_id, status, created_at]
    properties:
      schema_version: {type: string, const: research-run-command-result.v1}
      request_id: {type: string, minLength: 1}
      command: {type: string, enum: [cancel, retry, recheck, feedback]}
      source_run_id: {type: string, minLength: 1}
      target_run_id: {type: [string, 'null']}
      status: {type: string, enum: [accepted, already_applied, rejected]}
      created_at: {type: string, format: date-time}

  research_run_command_receipt:
    type: object
    additionalProperties: false
    required: [schema_version, request_id, owner_id, source_run_id, command, result]
    properties:
      schema_version: {type: string, const: research-run-command-receipt.v1}
      request_id: {type: string, minLength: 1}
      owner_id: {type: string, minLength: 1}
      source_run_id: {type: string, minLength: 1}
      command: {$ref: '#/$defs/research_run_command'}
      result: {$ref: '#/$defs/research_run_command_result'}
