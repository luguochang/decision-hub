        },
        "run_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "graph_round": {
          "type": "integer",
          "minimum": 1,
          "maximum": 10
        }
      },
      "required": [
        "kind",
        "reference_id",
        "run_id",
        "graph_round"
      ]
    },
    "research_context_evidence_row_declaration_v1": {
      "title": "ResearchContextEvidenceRowDeclarationV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
