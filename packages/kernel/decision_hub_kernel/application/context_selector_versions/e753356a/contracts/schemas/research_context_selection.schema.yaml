          ]
        },
        "decision_basis_ref": {
          "anyOf": [
            {
              "$ref": "#/$defs/research_context_declared_prior_ref_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "selector_identity": {
          "$ref": "#/$defs/research_context_selector_identity_v1"
        },
        "context_policy": {
          "$ref": "agentic_research.schema.yaml#/$defs/research_task_policy"
        },
        "considered_inputs": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/research_context_input_witness_v1"
          },
          "minItems": 1,
          "maxItems": 2050
        },
        "inherited_exclusions": {
          "type": "array",
          "items": {
            "$ref": "agentic_research.schema.yaml#/$defs/context_exclusion"
