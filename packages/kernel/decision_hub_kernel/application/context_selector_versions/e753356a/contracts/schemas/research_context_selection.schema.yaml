            },
            {
              "type": "null"
            }
          ]
        },
        "effective_eligibility_cutoff_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        },
        "cutoff_basis": {
          "type": "string",
          "enum": [
            "live_clock_min_original_pit",
            "replay_original_pit"
          ]
        },
        "decision_cutoff_before_selection": {
          "type": "string",
