        },
        "authority": {
          "type": "string",
          "minLength": 1,
          "maxLength": 32
        },
        "source_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "source_url": {
          "anyOf": [
            {
              "type": "string",
              "format": "uri",
              "maxLength": 2048
            },
            {
              "type": "null"
            }
          ]
        },
        "published_at": {
          "anyOf": [
            {
              "type": "string",
              "format": "date-time",
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
            },
            {
              "type": "null"
            }
          ]
        },
        "observed_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        },
        "received_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        },
        "content_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "excerpt": {
          "type": "string",
          "minLength": 1,
          "maxLength": 4000
        },
        "content_ref": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 2048
            },
            {
              "type": "null"
            }
          ]
        },
        "acquisition_receipt_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            {
              "type": "null"
            }
          ]
        },
        "source_content_hash": {
          "anyOf": [
            {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$",
              "minLength": 64,
              "maxLength": 64
            },
            {
              "type": "null"
            }
          ]
        },
        "parser_ref": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            },
            {
              "type": "null"
            }
          ]
        },
        "structured_payload_ref": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 2048
            },
            {
              "type": "null"
            }
          ]
        },
        "tool_call_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            {
              "type": "null"
            }
          ]
        },
        "quality": {
          "type": "string",
          "minLength": 1,
          "maxLength": 32
        },
        "freshness_status": {
          "type": "string",
          "minLength": 1,
          "maxLength": 32
        },
        "conflict_group": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            {
              "type": "null"
            }
          ]
        },
        "accepted_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        }
      },
      "required": [
        "evidence_id",
        "run_id",
        "capability_id",
        "requirement_id",
        "research_session_id",
        "round",
        "kind",
        "authority",
        "source_id",
        "source_url",
        "published_at",
        "observed_at",
        "received_at",
        "content_hash",
        "excerpt",
        "content_ref",
        "acquisition_receipt_id",
        "source_content_hash",
        "parser_ref",
        "structured_payload_ref",
        "tool_call_id",
        "quality",
        "freshness_status",
        "conflict_group",
        "accepted_at"
      ]
    },
    "research_context_input_witness_v1": {
      "title": "ResearchContextInputWitnessV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "source_kind": {
          "type": "string",
          "enum": [
            "original_task_input",
            "same_run_evidence"
          ]
        },
        "origin_basis": {
          "type": "string",
          "enum": [
            "frozen_task_declaration",
            "durable_evidence_declaration"
          ]
        },
        "input": {
          "$ref": "agentic_research.schema.yaml#/$defs/research_input_evidence"
        },
        "input_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "input_hash_kind": {
          "type": "string",
          "const": "canonical_context_input.v1"
        },
        "task_anchor": {
          "anyOf": [
            {
              "$ref": "#/$defs/research_context_task_anchor_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "row": {
          "anyOf": [
            {
              "$ref": "#/$defs/research_context_evidence_row_declaration_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "row_hash": {
          "anyOf": [
            {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$",
              "minLength": 64,
              "maxLength": 64
            },
            {
              "type": "null"
            }
          ]
        },
        "row_hash_kind": {
          "anyOf": [
            {
              "type": "string",
              "const": "canonical_research_evidence_row_witness.v1"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "source_kind",
        "origin_basis",
        "input",
        "input_hash",
        "input_hash_kind",
        "task_anchor",
        "row",
        "row_hash",
        "row_hash_kind"
      ],
      "allOf": [
        {
          "if": {
            "properties": {
              "source_kind": {
                "const": "original_task_input"
              }
            }
          },
          "then": {
            "properties": {
              "origin_basis": {
                "type": "string",
                "const": "frozen_task_declaration"
              },
              "task_anchor": {
                "$ref": "#/$defs/research_context_task_anchor_v1"
              },
              "row": {
                "type": "null"
              },
              "row_hash": {
                "type": "null"
              },
              "row_hash_kind": {
                "type": "null"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "source_kind": {
                "const": "same_run_evidence"
              }
            }
          },
          "then": {
            "properties": {
              "origin_basis": {
                "type": "string",
                "const": "durable_evidence_declaration"
              },
              "task_anchor": {
                "type": "null"
              },
              "row": {
                "$ref": "#/$defs/research_context_evidence_row_declaration_v1"
              },
              "row_hash": {
                "type": "string",
                "pattern": "^[a-f0-9]{64}$",
                "minLength": 64,
                "maxLength": 64
              },
              "row_hash_kind": {
                "type": "string",
                "const": "canonical_research_evidence_row_witness.v1"
              }
            }
          }
        }
      ]
    },
    "research_context_selection_row_identity_v1": {
