          "maxLength": 128
        },
        "capability_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "requirement_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "research_session_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "round": {
          "type": "integer",
          "minimum": 1,
          "maximum": 10
        },
