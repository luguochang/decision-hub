        },
        "recorded_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        }
      },
      "required": [
        "output_id",
        "run_id",
        "role",
        "row_schema_version",
        "payload_hash",
        "recorded_at"
      ]
    },
