        "run_id",
        "role",
        "row_schema_version",
        "payload_hash",
        "recorded_at"
      ]
    },
    "research_context_selection_receipt_v1": {
      "title": "ResearchContextSelectionReceiptV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "type": "string",
          "const": "research-context-selection.v1"
        },
        "receipt_state": {
          "type": "string",
          "const": "context_selected"
        },
        "selection_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 71,
          "pattern": "^ctxsel_[a-f0-9]{64}$"
        },
        "run_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "event_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "graph_round": {
          "type": "integer",
          "minimum": 1,
          "maximum": 10
        },
        "attempt_no": {
          "type": "integer",
          "minimum": 1,
          "maximum": 2147483647
        },
        "attempt_basis": {
          "type": "string",
          "enum": [
            "initial_round",
            "next_round",
            "explicit_reselection"
          ]
        },
        "parent_selection_id": {
          "anyOf": [
            {
              "type": "string",
