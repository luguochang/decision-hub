{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://decision-hub.local/contracts/research_context_selection.schema.json",
  "title": "ResearchContextSelectionContracts",
  "description": "New time declarations only; no SQL origin, sampled clock, execution, checker, or publication permission attestation.",
  "$defs": {
    "research_context_task_anchor_v1": {
      "title": "ResearchContextTaskAnchorV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "output_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "run_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "role": {
          "type": "string",
          "const": "research_task_request"
        },
        "row_schema_version": {
          "type": "string",
          "enum": [
            "research-task-request.v1",
            "research-task-request.v2"
          ]
        },
        "payload_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "recorded_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        },
        "payload_hash_kind": {
          "type": "string",
          "const": "raw_run_role_output_payload_utf8.v1"
        },
        "original_task_request_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "original_task_request_hash_kind": {
          "type": "string",
          "const": "canonical_research_session_request.v1"
        }
      },
      "required": [
        "output_id",
        "run_id",
        "role",
        "row_schema_version",
        "payload_hash",
        "recorded_at",
        "payload_hash_kind",
        "original_task_request_hash",
        "original_task_request_hash_kind"
      ]
    },
    "research_context_selector_identity_v1": {
      "title": "ResearchContextSelectorIdentityV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "time_rule_ref": {
          "type": "string",
          "const": "research-context.received-cutoff.v1"
        },
        "ranking_rules_ref": {
          "type": "string",
          "const": "research-context.relevance-authority-recency.v1"
        },
        "context_policy_source_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "producer_source_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "implementation_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "implementation_hash_kind": {
          "type": "string",
          "const": "canonical_context_selector_sources.v1"
        }
      },
      "required": [
        "time_rule_ref",
        "ranking_rules_ref",
        "context_policy_source_hash",
        "producer_source_hash",
        "implementation_hash",
        "implementation_hash_kind"
      ]
    },
    "research_context_declared_prior_ref_v1": {
      "title": "ResearchContextDeclaredPriorRefV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "kind": {
          "type": "string",
