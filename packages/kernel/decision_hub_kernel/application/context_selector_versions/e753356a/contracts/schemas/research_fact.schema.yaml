$schema: https://json-schema.org/draft/2020-12/schema
$id: https://decision-hub.local/contracts/research_fact.schema.json
title: ResearchFactContracts
type: object
additionalProperties: false
required: [schema_version]
properties:
  schema_version: {type: string, const: research-fact.v1}
$defs:
  fact_envelope:
    type: object
    additionalProperties: false
    required: [schema_version, fact_id, evidence_id, requirement_id, metric_family, field, instrument, venue, value, unit, window_start_at, window_end_at, event_offset, observed_at, received_at, published_at, source_id, independence_group, quality, delay_class, payload_schema_ref, payload_hash, attributes]
    properties:
      schema_version: {type: string, const: fact-envelope.v1}
      fact_id: {type: string, minLength: 1}
      evidence_id: {type: string, minLength: 1}
      requirement_id: {type: string, minLength: 1}
      metric_family: {type: string, minLength: 1}
      field: {type: string, minLength: 1}
      instrument: {type: [string, 'null']}
      venue: {type: [string, 'null']}
      value: {type: [number, string, 'null']}
      unit: {type: string, minLength: 1}
      window_start_at: {type: [string, 'null'], format: date-time}
      window_end_at: {type: [string, 'null'], format: date-time}
      event_offset: {type: [string, 'null']}
      observed_at: {type: string, format: date-time}
      received_at: {type: string, format: date-time}
      published_at: {type: [string, 'null'], format: date-time}
      source_id: {type: string, minLength: 1}
      independence_group: {type: string, minLength: 1}
      quality: {type: string, enum: [candidate, accepted, rejected, stale, conflicted]}
      delay_class: {type: string, enum: [realtime, delayed, historical, unknown]}
      payload_schema_ref: {type: string, minLength: 1}
      payload_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      attributes:
        type: object
        additionalProperties: {type: [number, string, boolean, 'null']}

  raw_capture_view:
    type: object
    additionalProperties: false
    properties:
      capture_id: &id001
        type: string
      url: *id001
      body_ref: &id002
        type:
        - string
        - 'null'
      body_hash: *id002
      status_code:
        type:
        - integer
        - 'null'
      byte_count: &id004
        type: integer
        minimum: 0
      media_type: *id001
      started_at: &id003
        type: string
        format: date-time
      completed_at: *id003
    required:
    - capture_id
    - url
    - body_ref
    - body_hash
    - status_code
    - byte_count
    - media_type
    - started_at
    - completed_at
  run_input_view:
    type: object
    additionalProperties: false
    properties:
      run_id: *id001
      fact_id: *id001
      use_mode:
        type: string
        enum:
        - fresh
        - reused
        - legacy
      as_of: *id003
      adopted_at: *id003
    required:
    - run_id
    - fact_id
    - use_mode
    - as_of
    - adopted_at
  fact_version_view:
    type: object
    additionalProperties: false
    properties:
      structured_payload_ref: {type: [string, "null"], default: null}
      fact_version_id: *id001
      semantic_key: *id001
      market: *id001
      scope_instrument: *id001
      known_at: *id003
      recorded_at: *id003
      fact:
        $ref: '#/$defs/fact_envelope'
      parsed_version_id: *id001
      archive_status:
        type: string
        enum:
        - captured
        - reference_only
        - legacy_unarchived
        - unarchived
        - missing
      parser_version: *id001
      content_ref: *id002
      acquisition_receipt_id: *id002
      raw_captures:
        type: array
        items:
          $ref: '#/$defs/raw_capture_view'
      run_inputs:
        type: array
        items:
          $ref: '#/$defs/run_input_view'
        default: []
    required:
    - fact_version_id
    - semantic_key
    - market
    - scope_instrument
    - known_at
    - recorded_at
    - fact
    - parsed_version_id
    - archive_status
    - parser_version
    - content_ref
    - acquisition_receipt_id
    - raw_captures
  fact_version_list_view:
    type: object
    additionalProperties: false
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/fact_version_view'
      total: *id004
      limit:
        type: integer
        minimum: 1
        maximum: 100
      offset: *id004
      as_of: *id003
    required:
    - items
    - total
    - limit
    - offset
    - as_of

  archived_input_view:
    type: object
    additionalProperties: false
    required: [kind, ref, verified, payload]
    properties:
      kind: {type: string, enum: [coverage_manifest, historical_partition, event_window, original_text]}
      ref: {type: string}
      verified: {type: boolean}
      payload: {type: object, additionalProperties: true}
