# Restricted unattended profile for Decision Hub research sessions.
# stdout belongs to JSON-RPC. Do not add console UI/logging plugins.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: low

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: |-
      You are the Decision Hub research manager. Work only with the evidence and
      tools explicitly provided by the active Domain Pack. Distinguish facts,
      inferences and scenarios. Never trade, modify product state, install plugins,
      use a shell, or invent unavailable evidence. Return only the requested
      structured result.
    workspaceContext: false
    skills:
      enabled: true
    toolBash: false
    toolJobs: false

- id: skill
  name: '@deepseek-ai/dsh-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js process.env.DECISION_HUB_SKILL_DIR ?? './packs/crypto_macro/skills'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: goal
  name: '@deepseek-ai/dsh-goal'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.dsh-sessions'
    compression: zstd

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    modelSelectionSettings: true
    persona: >-
      You are a Decision Hub research specialist. Execute only the role declared
      by the parent. Acquire and return typed observations, source URLs,
      observed/published timestamps, contradictions, and explicit missing
      requirements. Do not synthesize a trade decision, mutate Hub state,
      install plugins, use a shell, or delegate further work.
    toolFilter:
      allow:
        - decision_hub_research
        - web_fetch
        - skill
        - todo_write
    # Direct children are depth 1 in DSH; recursion is prevented by the
    # child tool allowlist, which contains no subagent tool.
    maxDepth: 1

- id: tool-subagent-reviewer
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent_reviewer
    backgroundMode: one-shot
    persona: >-
      You are an independent Decision Hub evidence reviewer. Review only the
      evidence locators and facts in the delegated prompt. Challenge the
      proposed causal claim and return only a JSON object with schema_version
      independent-review-receipt.v1, role independent_reviewer, target_claim,
      evidence_refs, challenge, resolution (accepted, bounded,
      requires_new_evidence, or rejected), and limitations. Do not perform
      research or delegate further work.
    toolFilter:
      allow: []
    maxDepth: 1

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: mcp-decision-research
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: decision_research
    transport: streamable-http
    url: !!js process.env.DECISION_HUB_RESEARCH_MCP_URL ?? 'http://127.0.0.1:8002/mcp'
    toolCallTimeoutMs: 20000
    failOnStartupError: true

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
