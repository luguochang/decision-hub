{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://decision-hub.local/contracts/research_context_execution.schema.json",
  "title": "ResearchContextExecutionContracts",
  "description": "Required selection declarations; strict shape is not source, clock, execution or publication permission.",
  "$defs": {
    "research_context_selection_row_identity_v3": {
      "title": "ResearchContextSelectionRowIdentityV3",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "output_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^ctxsel_[a-f0-9]{64}$"
        },
        "run_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "role": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^context_select\\.r[1-9][0-9]?\\.a[1-9][0-9]{0,9}$"
        },
        "row_schema_version": {
          "type": "string",
          "const": "research-context-selection.v3"
        },
        "payload_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "recorded_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        }
      },
      "required": [
        "output_id",
        "run_id",
        "role",
        "row_schema_version",
        "payload_hash",
        "recorded_at"
      ]
    },
    "research_context_execution_row_identity_v3": {
      "title": "ResearchContextExecutionRowIdentityV3",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "output_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "run_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "role": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^dsh_execution_request:[1-9][0-9]{0,9}$"
        },
        "row_schema_version": {
          "type": "string",
          "const": "dsh-execution-request.v3"
        },
        "payload_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "recorded_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        }
      },
      "required": [
        "output_id",
        "run_id",
        "role",
        "row_schema_version",
        "payload_hash",
        "recorded_at"
      ]
    },
    "research_required_context_selection_binding_v1": {
      "title": "ResearchRequiredContextSelectionBindingV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "mode": {
          "type": "string",
          "const": "required_before_rpc"
        },
        "selection_schema": {
          "type": "string",
          "const": "research-context-selection.v3"
        },
        "ranking_rules_ref": {
          "type": "string",
          "const": "research-context.relevance-authority-recency.v2"
        },
        "time_rule_ref": {
          "type": "string",
          "const": "research-context.received-cutoff.v1"
        },
        "first_selection_row": {
          "$ref": "#/$defs/research_context_selection_row_identity_v3"
        },
        "first_selection_payload_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "first_selection_full_request_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "first_selection_full_request_hash_kind": {
          "type": "string",
          "const": "canonical_research_session_request.v1"
        }
      },
      "required": [
        "mode",
        "selection_schema",
        "ranking_rules_ref",
        "time_rule_ref",
        "first_selection_row",
        "first_selection_payload_hash",
        "first_selection_full_request_hash",
        "first_selection_full_request_hash_kind"
      ]
    },
    "research_execution_method_definition_v3": {
      "title": "ResearchExecutionMethodDefinitionV3",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "type": "string",
          "const": "research-execution-method.v3"
        },
        "runtime_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^\\S(?:.*\\S)?$"
        },
        "runtime_version": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^\\S(?:.*\\S)?$"
        },
        "profile_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^\\S(?:.*\\S)?$"
        },
        "prompt_policy_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "upstream_identity": {
          "allOf": [
            {
              "$ref": "dsh_host_bridge.schema.yaml#/$defs/dsh_upstream_identity"
            },
            {
              "type": "object",
              "properties": {
                "source_commit": {
                  "type": "string",
                  "pattern": "^[a-f0-9]{40}$",
                  "minLength": 40,
                  "maxLength": 40
                },
                "source_version": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128,
                  "pattern": "^\\S(?:.*\\S)?$"
                },
                "plugin_build_hash": {
                  "type": "string",
                  "pattern": "^[a-f0-9]{64}$",
                  "minLength": 64,
                  "maxLength": 64
                },
                "package_versions": {
                  "type": "object",
                  "minProperties": 0,
                  "maxProperties": 64,
                  "propertyNames": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128,
                    "pattern": "^\\S(?:.*\\S)?$"
                  },
                  "additionalProperties": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128,
                    "pattern": "^\\S(?:.*\\S)?$"
                  }
                }
              },
              "required": [
                "source_commit",
                "source_version",
                "plugin_build_hash",
                "package_versions"
              ],
              "additionalProperties": false
            }
          ]
        },
        "domain_pack_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^\\S(?:.*\\S)?$"
        },
        "role_profile_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^\\S(?:.*\\S)?$"
        },
        "execution_mode": {
          "type": "string",
          "enum": [
            "live",
            "replay"
          ]
        },
        "research_mode": {
          "type": "string",
          "enum": [
            "historical_review",
            "current_decision"
          ]
        },
        "context_policy_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "allowed_capabilities": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^\\S(?:.*\\S)?$"
          },
          "minItems": 1,
          "maxItems": 32,
          "uniqueItems": true
        },
        "execution_budget": {
          "anyOf": [
            {"$ref": "agentic_research.schema.yaml#/$defs/execution_budget"},
            {"$ref": "agentic_research.schema.yaml#/$defs/execution_budget_v2"}
          ]
        },
        "deadline_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
        },
        "output_schema_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 2048,
          "pattern": "^\\S(?:.*\\S)?$"
        },
        "workspace_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 2048,
          "pattern": "^\\S(?:.*\\S)?$"
        },
        "agent_preset": {
          "type": "string",
          "const": "decision-research"
        },
        "permission_ref": {
          "type": "string",
          "const": "decision-hub://permissions/research-only"
        },
        "provider_configuration_attested": {
          "type": "boolean",
          "const": false
        },
        "evolution_pointer_consumed": {
          "type": "boolean",
          "const": false
        },
        "candidate_id": {
          "type": "null"
        },
        "research_policy_renderer_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "research_policy_prompt_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "bundle": {
          "$ref": "research_execution_binding.schema.yaml#/$defs/research_prepared_bundle_identity"
        },
        "policy_binding": {
          "$ref": "research_policy.schema.yaml#/$defs/research_policy_method_binding"
        },
        "first_execution_request_hash_kind": {
          "type": "string",
          "const": "canonical_research_session_request.v1"
        },
        "request_pack_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "context_selection_binding": {
          "anyOf": [
            {
              "$ref": "#/$defs/research_required_context_selection_binding_v1"
            },
            {
              "$ref": "#/$defs/research_required_context_selection_binding_v2"
            }
          ]
        }
      },
      "required": [
        "schema_version",
        "runtime_id",
        "runtime_version",
        "profile_ref",
        "prompt_policy_hash",
        "upstream_identity",
        "domain_pack_ref",
        "role_profile_ref",
        "execution_mode",
        "research_mode",
        "context_policy_hash",
        "allowed_capabilities",
        "execution_budget",
        "deadline_at",
        "output_schema_ref",
        "workspace_ref",
        "agent_preset",
        "permission_ref",
        "provider_configuration_attested",
        "evolution_pointer_consumed",
        "candidate_id",
        "research_policy_renderer_hash",
        "research_policy_prompt_hash",
        "bundle",
        "policy_binding",
        "first_execution_request_hash_kind",
        "request_pack_hash",
        "context_selection_binding"
      ]
    },
