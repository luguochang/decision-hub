{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://decision-hub.local/contracts/action-execution-v1.schema.json",
  "title": "ActionExecutionContractsV1",
  "description": "Immutable paper execution declarations. Wire validation never grants source authenticity, actual fill authority, or financial qualification.",
  "$defs": {
    "action_execution_ref_v1": {
      "title": "ActionExecutionRefV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        },
        "hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "ref",
        "hash"
      ]
    },
    "action_execution_target_v1": {
      "title": "ActionExecutionTargetV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "horizon": {
          "type": "string",
          "enum": [
            "30m",
            "24h",
            "72h"
          ]
        },
        "target_spec_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        },
        "target_spec_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "horizon",
        "target_spec_ref",
        "target_spec_hash"
      ]
    },
