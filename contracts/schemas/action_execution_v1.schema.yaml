          "description": "Canonical fixed-point Decimal string, at most 50 significant digits; no exponent, negative zero, leading integer zeros or trailing fractional zeros. No float conversion."
        },
        "quantity": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256,
