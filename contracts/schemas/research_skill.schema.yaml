{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://decision-hub.local/contracts/research_skill.schema.json",
  "title": "ResearchSkillContractsV1",
  "$defs": {
    "research_skill_list_item_v1": {
      "title": "ResearchSkillListItemV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "use_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "skill_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "version_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "package_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "workflow_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "compiled_plan_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "use_id",
        "skill_version_id",
        "version_hash",
        "package_hash",
        "workflow_hash",
        "compiled_plan_hash"
      ]
    },
    "research_skill_list_response_v1": {
      "title": "ResearchSkillListResponseV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "const": "research-skill-list.v1"
        },
        "status": {
          "const": "selected"
        },
        "items": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/research_skill_list_item_v1"
          },
          "minItems": 1,
          "maxItems": 1
        },
        "stage_receipts": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/research_skill_stage_receipt_v1"
          },
          "minItems": 0,
          "maxItems": 8
        }
      },
      "required": [
        "schema_version",
        "status",
        "items",
        "stage_receipts"
      ]
    },
    "research_skill_load_response_v1": {
      "title": "ResearchSkillLoadResponseV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "const": "research-skill-load.v1"
        },
        "status": {
          "const": "delivered"
        },
        "use_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "skill_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "version_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "package_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "workflow_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "compiled_plan_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "method_body": {
          "type": "string",
          "minLength": 1,
          "maxLength": 262144
        },
        "method_body_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "schema_version",
        "status",
        "use_id",
        "skill_version_id",
        "version_hash",
        "package_hash",
        "workflow_hash",
        "compiled_plan_hash",
        "method_body",
        "method_body_hash"
      ]
    },
    "research_skill_resource_v1": {
      "title": "ResearchSkillResourceV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "path": {
          "type": "string",
          "minLength": 1,
          "maxLength": 240,
          "pattern": "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$))(?!.*[\\\\:]).+\\.(?:md|json)$"
        },
        "body_ref": {
          "type": "string",
          "pattern": "^raw://sha256/[a-f0-9]{64}$"
        },
        "body_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "size_bytes": {
          "type": "integer",
          "minimum": 1,
          "maximum": 1000000
        }
      },
      "required": [
        "path",
        "body_ref",
        "body_hash",
        "size_bytes"
      ]
    },
    "research_skill_schema_binding_v1": {
      "title": "ResearchSkillSchemaBindingV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "contract_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "resource_path": {
          "type": "string",
          "minLength": 1,
          "maxLength": 2000
        },
        "schema_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "contract_ref",
        "resource_path",
        "schema_hash"
      ]
    },
    "research_skill_component_version_ref_v1": {
      "title": "ResearchSkillComponentVersionRefV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "payload_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "version_id",
        "payload_hash"
      ]
    },
    "research_skill_component_audit_ref_v1": {
      "title": "ResearchSkillComponentAuditRefV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "audit_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "payload_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "audit_id",
        "payload_hash"
      ]
    },
    "research_skill_gateway_reservation_ref_v1": {
      "title": "ResearchSkillGatewayReservationRefV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "run_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "request_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "research_session_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "generation": {
          "type": "integer",
          "minimum": 1
        },
        "capability_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "query_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "result_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "run_id",
        "request_id",
        "research_session_id",
        "generation",
        "capability_id",
        "query_hash",
        "result_hash"
      ]
    },
    "research_skill_capability_surface_v1": {
      "title": "ResearchSkillCapabilitySurfaceV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "capability_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "protocol_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "adapter_version": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "adapter_code_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "input_schema_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "output_schema_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "scope_ids": {
          "type": "array",
          "items": {
            "type": "string",
            "enum": [
              "crypto:spot:okx:BTC-USDT:trade:1m",
              "crypto:spot:okx:ETH-USDT:trade:1m"
            ]
          },
          "minItems": 1,
          "maxItems": 2,
          "uniqueItems": true
        },
        "unit_bindings_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "controlled_routes_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "controlled_routes_ref": {
          "type": "string",
          "pattern": "^raw://sha256/[a-f0-9]{64}$"
        }
      },
      "required": [
        "capability_id",
        "protocol_ref",
        "adapter_version",
        "adapter_code_hash",
        "input_schema_hash",
        "output_schema_hash",
        "scope_ids",
        "unit_bindings_hash",
        "controlled_routes_hash",
        "controlled_routes_ref"
      ]
    },
    "research_skill_version_v1": {
      "title": "ResearchSkillVersionV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "const": "research-skill-version.v1"
        },
        "skill_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "parent_version_id": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            {
              "type": "null"
            }
          ]
        },
        "kind": {
          "enum": [
            "method_workflow",
            "method_readonly"
          ]
        },
        "domain_pack_ref": {
          "const": "crypto_macro.v1"
        },
        "scope_ids": {
          "type": "array",
          "items": {
            "type": "string",
            "enum": [
              "crypto:spot:okx:BTC-USDT:trade:1m",
              "crypto:spot:okx:ETH-USDT:trade:1m"
            ]
          },
          "minItems": 1,
          "maxItems": 2,
          "uniqueItems": true
        },
        "horizon": {
          "const": "24h"
        },
        "files": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/research_skill_resource_v1"
          },
          "minItems": 1,
          "maxItems": 128
        },
        "input_contract": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "output_contract": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "schema_bindings": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/research_skill_schema_binding_v1"
          },
          "minItems": 1,
          "maxItems": 128
        },
        "workflow_hash": {
          "anyOf": [
            {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$",
              "minLength": 64,
              "maxLength": 64
            },
            {
              "type": "null"
            }
          ]
        },
        "compiler_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "required_capability_surface_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "capability_surfaces": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/research_skill_capability_surface_v1"
          },
          "minItems": 0,
          "maxItems": 16
        },
        "component_manifest_refs": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/research_skill_component_version_ref_v1"
          },
          "minItems": 0,
          "maxItems": 16
        },
        "evaluation_protocol_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "origin_refs": {
          "type": "array",
          "items": {
            "$ref": "provider_input.schema.yaml#/$defs/research_provider_callback_reference"
          },
          "minItems": 0,
          "maxItems": 32
        },
        "first_known_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:Z|\\+00:00)$"
        }
      },
      "required": [
        "schema_version",
        "skill_id",
        "version_id",
        "parent_version_id",
        "kind",
        "domain_pack_ref",
        "scope_ids",
        "horizon",
        "files",
        "input_contract",
        "output_contract",
        "schema_bindings",
        "workflow_hash",
        "compiler_hash",
        "required_capability_surface_hash",
        "capability_surfaces",
        "component_manifest_refs",
        "evaluation_protocol_hash",
        "origin_refs",
        "first_known_at"
      ],
      "allOf": [
        {
          "if": {
            "properties": {
              "kind": {
                "const": "method_workflow"
              }
            }
          },
          "then": {
            "properties": {
              "workflow_hash": {
                "type": "string",
                "pattern": "^[a-f0-9]{64}$",
                "minLength": 64,
                "maxLength": 64
              }
            }
          },
          "else": {
            "properties": {
              "workflow_hash": {
                "type": "null"
              }
            }
          }
        }
      ]
    },
    "research_skill_workflow_schema_id_v2": {
      "type": "string",
      "pattern": "^[A-Za-z0-9_.:-]+$",
      "minLength": 1
    },
    "research_skill_workflow_node_id_v2": {
      "type": "string",
      "pattern": "^[A-Za-z][A-Za-z0-9_-]{0,63}$"
    },
    "research_skill_workflow_pointer_v2": {
      "type": "string",
      "pattern": "^(?:/[A-Za-z_][A-Za-z0-9_]*)*$"
    },
    "research_skill_workflow_binding_v2": {
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "from",
            "pointer"
          ],
          "properties": {
            "from": {
              "const": "workflow_input"
            },
            "pointer": {
              "$ref": "#/$defs/research_skill_workflow_pointer_v2"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "from",
            "node_id",
            "pointer"
          ],
          "properties": {
            "from": {
              "const": "node_output"
            },
            "node_id": {
              "$ref": "#/$defs/research_skill_workflow_node_id_v2"
            },
            "pointer": {
              "$ref": "#/$defs/research_skill_workflow_pointer_v2"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "from",
            "value"
          ],
          "properties": {
            "from": {
              "const": "literal"
            },
            "value": {}
          }
        }
      ]
    },
    "research_skill_workflow_node_v2": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "op",
        "depends_on",
        "input_schema",
        "inputs",
        "output_schema",
        "capability_id",
        "component_ref"
      ],
      "properties": {
        "id": {
          "$ref": "#/$defs/research_skill_workflow_node_id_v2"
        },
        "op": {
          "enum": [
            "fact.select",
            "evidence.acquire",
            "component.compute",
            "case.retrieve",
            "hypothesis.check",
            "decision.compose",
            "monitor.propose"
          ]
        },
        "depends_on": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "$ref": "#/$defs/research_skill_workflow_node_id_v2"
          }
        },
        "input_schema": {
          "$ref": "#/$defs/research_skill_workflow_schema_id_v2"
        },
        "inputs": {
          "type": "object",
          "additionalProperties": {
            "$ref": "#/$defs/research_skill_workflow_binding_v2"
          }
        },
        "output_schema": {
          "$ref": "#/$defs/research_skill_workflow_schema_id_v2"
        },
        "capability_id": {
          "type": [
            "string",
            "null"
          ],
          "minLength": 1
        },
        "component_ref": {
          "type": [
            "string",
            "null"
          ],
          "minLength": 1
        }
      },
      "allOf": [
        {
          "if": {
            "properties": {
              "op": {
                "const": "evidence.acquire"
              }
            }
          },
          "then": {
            "properties": {
              "capability_id": {
                "type": "string"
              },
              "component_ref": {
                "type": "null"
              }
            }
          },
          "else": {
            "properties": {
              "capability_id": {
                "type": "null"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "op": {
                "const": "component.compute"
              }
            }
          },
          "then": {
            "properties": {
              "component_ref": {
                "type": "string"
              }
            }
          },
          "else": {
            "properties": {
              "component_ref": {
                "type": "null"
              }
            }
          }
        }
      ]
    },
    "research_skill_workflow_v2": {
      "title": "ResearchSkillWorkflowV2",
      "type": "object",
      "additionalProperties": false,
      "required": [
        "schema_version",
        "workflow_id",
        "version_id",
        "scope_id",
        "input_schema",
        "output_schema",
        "required_capability_surface_hash",
        "required_capabilities",
        "nodes",
        "exports",
        "horizon"
      ],
      "properties": {
        "schema_version": {
          "const": "skill-workflow.v2"
        },
        "workflow_id": {
          "type": "string",
          "minLength": 1
        },
        "version_id": {
          "type": "string",
          "minLength": 1
        },
        "scope_id": {
          "type": "string",
          "enum": [
            "crypto:spot:okx:BTC-USDT:trade:1m",
            "crypto:spot:okx:ETH-USDT:trade:1m"
          ]
        },
        "input_schema": {
          "$ref": "#/$defs/research_skill_workflow_schema_id_v2"
        },
        "output_schema": {
          "$ref": "#/$defs/research_skill_workflow_schema_id_v2"
        },
        "required_capabilities": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "nodes": {
          "type": "array",
          "minItems": 1,
          "maxItems": 128,
          "items": {
            "$ref": "#/$defs/research_skill_workflow_node_v2"
          }
        },
        "exports": {
          "type": "object",
          "minProperties": 1,
          "additionalProperties": {
            "$ref": "#/$defs/research_skill_workflow_binding_v2"
          }
        },
        "horizon": {
          "const": "24h"
        },
        "required_capability_surface_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      }
    },
    "research_skill_selection_v1": {
      "title": "ResearchSkillSelectionV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "const": "research-skill-selection.v1"
        },
        "selection_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "use_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "run_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "generation": {
          "type": "integer",
          "minimum": 1
        },
        "task_request_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "compiled_task_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "method_binding_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "scope_id": {
          "type": "string",
          "enum": [
            "crypto:spot:okx:BTC-USDT:trade:1m",
            "crypto:spot:okx:ETH-USDT:trade:1m"
          ]
        },
        "horizon": {
          "const": "24h"
        },
        "producer_cutoff_at": {
          "type": "string",
          "format": "date-time",
          "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:Z|\\+00:00)$"
        },
        "skill_version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "version_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
        "package_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        },
