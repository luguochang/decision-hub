        "valid_until": {
          "type": "string",
          "format": "date-time"
        },
        "id": {
          "type": "string",
          "pattern": "^clock_[a-f0-9]{64}$"
        },
        "payload_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        }
