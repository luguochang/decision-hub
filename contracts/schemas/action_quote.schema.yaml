        "schema_version": {
          "const": "action-quote-availability.v1"
        },
        "quote_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "quote_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "available_at": {
          "type": "string",
          "format": "date-time"
        },
        "basis": {
          "const": "first_service_read_of_committed_quote"
        }
      },
      "required": [
        "schema_version",
        "quote_id",
        "quote_hash",
        "available_at",
        "basis"
      ]
