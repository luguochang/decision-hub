        },
        "offset_upper_us": {
          "type": "integer"
        },
        "provider_observed_at": {
          "type": "string",
          "format": "date-time"
        },
        "observed_local_lower": {
          "type": "string",
          "format": "date-time"
        },
        "observed_local_upper": {
          "type": "string",
          "format": "date-time"
        },
        "established_at": {
