          "format": "date-time"
        },
        "owner_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "generation": {
          "type": "integer",
          "minimum": 1
        },
        "lease_expires_at": {
          "type": "string",
          "format": "date-time"
        },
        "event": {
          "enum": [
            "claimed",
            "captured",
            "rejected",
            "failed"
          ]
        },
        "recorded_at": {
          "type": "string",
          "format": "date-time"
        },
        "capture_ids": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "maxItems": 1
        },
        "quote_id": {
          "type": [
            "string",
            "null"
