        "scope": {
          "additionalProperties": false,
          "properties": {
            "schema_version": {
              "const": "market-path-scope.v1",
              "default": "market-path-scope.v1",
              "title": "Schema Version",
              "type": "string"
            },
            "scope_id": {
              "minLength": 1,
              "title": "Scope Id",
              "type": "string"
            },
            "asset_class": {
              "default": "crypto",
              "title": "Asset Class",
              "type": "string"
            },
            "instrument_kind": {
              "default": "spot",
              "enum": [
                "spot",
                "perpetual_swap"
              ],
              "title": "Instrument Kind",
              "type": "string"
            },
            "venue": {
              "minLength": 1,
              "title": "Venue",
              "type": "string"
            },
            "instrument": {
              "minLength": 1,
              "title": "Instrument",
              "type": "string"
            },
            "quote_currency": {
              "minLength": 1,
              "title": "Quote Currency",
              "type": "string"
            },
            "price_type": {
              "default": "trade",
              "enum": [
                "trade",
                "mark",
                "index"
              ],
              "title": "Price Type",
              "type": "string"
            },
            "price_unit": {
              "minLength": 1,
              "title": "Price Unit",
              "type": "string"
            },
            "volume_unit": {
              "minLength": 1,
              "title": "Volume Unit",
              "type": "string"
            },
            "timezone": {
              "const": "UTC",
              "default": "UTC",
              "title": "Timezone",
              "type": "string"
            },
            "calendar_ref": {
              "default": "crypto-24x7.v1",
              "title": "Calendar Ref",
              "type": "string"
            },
            "interval_seconds": {
              "const": 60,
              "default": 60,
              "title": "Interval Seconds",
              "type": "integer"
            }
          },
          "required": [
            "scope_id",
            "venue",
            "instrument",
            "quote_currency",
            "price_unit",
            "volume_unit"
          ],
          "title": "MarketPathScope",
          "type": "object"
        },
        "price_basis": {
          "const": "bid_ask"
        },
        "bid_text": {
          "type": "string",
          "maxLength": 80,
          "pattern": "^(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?$"
        },
        "ask_text": {
          "type": "string",
          "maxLength": 80,
          "pattern": "^(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?$"
        },
        "observed_at": {
          "type": "string",
          "format": "date-time"
        },
        "received_at": {
          "type": "string",
          "format": "date-time"
        },
        "admitted_at": {
          "type": "string",
          "format": "date-time"
        },
        "semantic_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$"
        },
        "capture": {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "capture_id": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            },
            "context_id": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            },
            "url": {
              "type": "string",
              "maxLength": 2048
            },
            "status_code": {
              "const": 200
            },
            "body_ref": {
              "type": "string",
              "pattern": "^raw://sha256/[a-f0-9]{64}$"
            },
            "body_hash": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            },
            "byte_count": {
              "type": "integer",
              "minimum": 1
            },
            "adapter_version": {
              "const": "okx-action-quote.v1"
            },
            "error_code": {
              "type": "null"
            },
            "started_at": {
              "type": "string",
              "format": "date-time"
            },
            "completed_at": {
              "type": "string",
              "format": "date-time"
            },
            "recorded_at": {
              "type": "string",
              "format": "date-time"
            }
          },
          "required": [
            "capture_id",
            "context_id",
            "url",
            "status_code",
            "body_ref",
            "body_hash",
            "byte_count",
            "adapter_version",
            "error_code",
            "started_at",
            "completed_at",
            "recorded_at"
          ]
        }
