                  "format": "date-time"
                },
                "recorded_at": {
                  "type": "string",
                  "format": "date-time"
                }
              },
              "required": [
                "capture_id",
                "context_id",
                "url",
                "status_code",
                "body_ref",
                "body_hash",
                "byte_count",
                "adapter_version",
                "error_code",
                "started_at",
                "completed_at",
                "recorded_at"
              ]
            },
            "measurement": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "started_at": {
                  "type": "string",
                  "format": "date-time"
                },
                "completed_at": {
                  "type": "string",
                  "format": "date-time"
                },
                "elapsed_monotonic_ns": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 14000000000
                }
              },
              "required": [
                "started_at",
                "completed_at",
                "elapsed_monotonic_ns"
              ]
            }
          },
