          "minLength": 64,
          "maxLength": 64
        },
        "unit": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        },
        "known_at": {
          "type": "string",
          "format": "date-time"
        }
      },
      "required": [
        "ref",
        "hash",
        "unit",
        "known_at"
      ]
    },
    "decision_gap_v1": {
      "title": "DecisionGapV1",
