    },
    "decision_condition_compare_v1": {
      "title": "DecisionConditionCompareV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "op": {
          "const": "compare"
        },
        "feature": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        },
        "scope_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 192,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        },
        "unit": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        },
        "cmp": {
          "type": "string",
          "enum": [
            "gt",
            "gte",
            "lt",
            "lte"
          ]
        },
        "threshold": {
          "type": "string",
          "minLength": 1,
          "maxLength": 80,
          "pattern": "^(?:0|-?(?:[1-9][0-9]*(?:\\.[0-9]*[1-9])?|0\\.[0-9]*[1-9]))$"
        },
        "max_age_seconds": {
          "type": "integer",
          "minimum": 1,
          "maximum": 604800
        }
      },
      "required": [
        "op",
        "feature",
        "scope_id",
        "unit",
        "cmp",
        "threshold",
        "max_age_seconds"
      ]
    },
    "decision_condition_expression_depth_8_v1": {
      "title": "DecisionConditionExpressionDepth8V1",
      "$ref": "#/$defs/decision_condition_compare_v1"
    },
    "decision_condition_group_depth_7_v1": {
