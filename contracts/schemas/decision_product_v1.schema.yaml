    "decision_hypothesis_v1": {
      "title": "DecisionHypothesisV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "direction": {
          "type": "string",
          "enum": [
            "long",
            "short",
            "range"
          ]
        },
        "evidence_refs": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
          },
          "minItems": 0,
          "maxItems": 128
        },
        "counter_refs": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
          },
          "minItems": 0,
          "maxItems": 128
        },
        "rationale": {
          "type": "string",
          "minLength": 1,
          "maxLength": 8000,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        }
      },
      "required": [
        "direction",
        "evidence_refs",
        "counter_refs",
        "rationale"
      ]
    },
    "decision_probability_v1": {
      "title": "DecisionProbabilityV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "target_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        },
        "value": {
          "type": [
            "number",
            "null"
          ],
          "minimum": 0,
          "maximum": 1
        },
        "kind": {
          "type": "string",
          "enum": [
            "subjective",
            "calibrated",
            "unavailable"
          ]
        },
        "provenance_ref": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 256,
              "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "target_id",
        "value",
        "kind",
        "provenance_ref"
      ],
      "allOf": [
        {
          "if": {
            "properties": {
              "kind": {
                "const": "unavailable"
              }
            }
          },
          "then": {
            "properties": {
              "value": {
                "type": "null"
              },
              "provenance_ref": {
                "type": "null"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "kind": {
                "const": "subjective"
              }
            }
          },
          "then": {
            "properties": {
              "value": {
                "type": "number"
              },
              "provenance_ref": {
                "type": "null"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "kind": {
                "const": "calibrated"
              }
            }
          },
          "then": {
            "properties": {
              "value": {
                "type": "number"
              },
              "provenance_ref": {
                "type": "string",
                "minLength": 1,
                "maxLength": 256,
                "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
              }
            }
          }
        }
      ]
    },
    "decision_condition_input_v1": {
      "title": "DecisionConditionInputV1",
      "type": "object",
