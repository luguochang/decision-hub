{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://decision-hub.local/contracts/decision-product-v1.schema.json",
  "title": "DecisionProductContractsV1",
  "description": "Closed action contracts. Parsing does not authenticate stored references or grant financial qualification.",
  "$defs": {
    "decision_basis_ref_v1": {
      "title": "DecisionBasisRefV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        },
        "hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "ref",
        "hash"
      ]
    },
    "decision_skill_ref_v1": {
      "title": "DecisionSkillRefV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "version_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$"
        },
        "hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$",
          "minLength": 64,
          "maxLength": 64
        }
      },
      "required": [
        "version_id",
        "hash"
      ]
    },
    "decision_factor_ref_v1": {
      "title": "DecisionFactorRefV1",
