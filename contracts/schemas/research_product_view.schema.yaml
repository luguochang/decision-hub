$schema: https://json-schema.org/draft/2020-12/schema
$id: https://decision-hub.local/contracts/research-product-view.schema.json
title: ResearchProductViewContracts
type: object
additionalProperties: false
required: [schema_version]
properties:
  schema_version: {type: string, const: research-product-view.v1}
$defs:
  research_inbox_item:
    type: object
    additionalProperties: false
    required: [schema_version, event_id, event_title, event_family, watch_id, run_id, dsh_session_id, artifact_id, parent_run_id, admission_origin, status, baseline_status, gate_status, report_available, headline, summary, scheduled_at, next_recheck_at, notification_status, domain_pack_ref, role_profile_ref, created_at, updated_at]
    properties:
      schema_version: {type: string, const: research-inbox-item.v1}
      event_id: {type: string, minLength: 1}
      event_title: {type: string, minLength: 1}
      event_family: {type: [string, 'null']}
      watch_id: {type: [string, 'null']}
      run_id: {type: [string, 'null'], minLength: 1}
      dsh_session_id: {type: [string, 'null']}
      artifact_id: {type: [string, 'null']}
      parent_run_id: {type: [string, 'null']}
      admission_origin: {type: string, enum: [manual, automatic, scheduled_recheck, legacy]}
      status: {type: string, enum: [watching, queued, researching, report_ready, research_only, rejected, failed, cancelled]}
      baseline_status: {type: string, enum: [not_applicable, pending, ready, unavailable]}
      gate_status: {type: [string, 'null'], enum: [publish, degraded, research_only, reject, null]}
      report_available: {type: boolean}
      headline: {type: [string, 'null']}
      summary: {type: [string, 'null']}
      scheduled_at: {type: [string, 'null'], format: date-time}
      next_recheck_at: {type: [string, 'null'], format: date-time}
      notification_status: {type: string, enum: [not_applicable, pending, retry_wait, delivered, failed]}
      domain_pack_ref: {type: [string, 'null'], minLength: 1}
      role_profile_ref: {type: [string, 'null'], minLength: 1}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
  research_inbox_view:
    type: object
    additionalProperties: false
    required: [schema_version, items, generated_at]
    properties:
      schema_version: {type: string, const: research-inbox-view.v1}
      items: {type: array, items: {$ref: '#/$defs/research_inbox_item'}}
      generated_at: {type: string, format: date-time}
  research_version_lineage:
    type: object
    additionalProperties: false
    required: [domain_pack_ref, domain_pack_version, role_profile_ref, runtime_id, runtime_version, capability_versions, gate_policy_ref, source_registry_ref]
    properties:
      domain_pack_ref: {type: [string, 'null'], minLength: 1}
      domain_pack_version: {type: [string, 'null'], minLength: 1}
      role_profile_ref: {type: [string, 'null'], minLength: 1}
      runtime_id: {type: string, minLength: 1}
      runtime_version: {type: string, minLength: 1}
      capability_versions: {type: array, items: {type: string, minLength: 1}}
      gate_policy_ref: {type: [string, 'null'], minLength: 1}
      source_registry_ref: {type: [string, 'null'], minLength: 1}
      pack_basis: {type: string, enum: [saved_pack, unavailable, invalid], default: unavailable}
      request_basis: {type: string, enum: [saved_request, unavailable, invalid], default: unavailable}
      unverified_fields: {type: array, items: {type: string}, default: []}
      pack_receipt_ref: {type: [string, 'null'], default: null}
  requirement_readiness_item:
    type: object
    additionalProperties: false
    required: [requirement_id, importance, status, reason_code, required_fields, missing_fields, required_event_offsets, attempted_capabilities, next_capability]
    properties:
      requirement_id: {type: string, minLength: 1}
      importance: {type: string, enum: [hard, soft]}
      status: {type: string, enum: [ready, missing, stale, rejected, conflict, no_baseline, window_missing, tool_unavailable]}
      reason_code: {type: [string, 'null']}
      required_fields: {type: array, items: {type: string}}
      missing_fields: {type: array, items: {type: string}}
      required_event_offsets: {type: array, items: {type: string}}
      attempted_capabilities: {type: array, items: {type: string}}
      next_capability: {type: [string, 'null']}
  source_attempt_view:
    type: object
    additionalProperties: false
    required: [capability_id, provider_id, route_role, service_tier, status, latency_ms, cost_usd, cost_status, error_code, retryable]
    properties:
      capability_id: {type: string, minLength: 1}
      provider_id: {type: string, minLength: 1}
      route_role: {type: string, enum: [primary, fallback, direct]}
      service_tier: {type: string, enum: [free_proxy, licensed_live, replay, unknown]}
      status: {type: string, enum: [succeeded, failed, skipped, denied, timed_out]}
      latency_ms: {type: [integer, 'null'], minimum: 0}
      cost_usd: {type: [number, 'null'], minimum: 0}
      cost_status: {type: string, enum: [known, unknown]}
      error_code: {type: [string, 'null']}
      retryable: {type: boolean}
  research_cost_component:
    type: object
    additionalProperties: false
    required: [component, amount_usd, status, policy_ref]
    properties:
      component: {type: string, enum: [model, search, typed_provider, subscription]}
      amount_usd: {type: [number, 'null'], minimum: 0}
      status: {type: string, enum: [known, known_free, unknown]}
      policy_ref: {type: [string, 'null']}
  research_cost_breakdown:
    type: object
    additionalProperties: false
    required: [status, known_subtotal_usd, total_usd, currency, unknown_components, components]
    properties:
      status: {type: string, enum: [known, partial, unknown]}
      known_subtotal_usd: {type: [number, 'null'], minimum: 0}
      total_usd: {type: [number, 'null'], minimum: 0}
      currency: {type: string, const: USD}
      unknown_components: {type: array, items: {type: string}}
      components: {type: array, items: {$ref: '#/$defs/research_cost_component'}}
  research_observability_view:
    type: object
    additionalProperties: false
    required: [schema_version, run_id, versions, readiness, source_attempts, cost, trajectory_ref, telemetry_ref, ledger_ref, generated_at]
    properties:
      schema_version: {type: string, const: research-observability-view.v1}
      # Authenticated display only; no execution/retry/publication permission.
      first_native_failure: {anyOf: [{$ref: 'agentic_research.schema.yaml#/$defs/research_authenticated_native_failure'}, {type: 'null'}], default: null}
      current_authenticated_native_failure: {anyOf: [{$ref: 'agentic_research.schema.yaml#/$defs/research_authenticated_native_failure'}, {type: 'null'}], default: null}
      native_failure_coverage: {anyOf: [{$ref: 'agentic_research.schema.yaml#/$defs/research_native_failure_coverage'}, {type: 'null'}], default: null}
      coverage_basis: {type: [string, 'null'], enum: [saved_result, saved_request, saved_task_request, saved_checkpoint, round_request_only, unavailable, invalid, null]}
      coverage_cutoff_at: {type: [string, 'null'], format: date-time}
      run_id: {type: string, minLength: 1}
      versions: {$ref: '#/$defs/research_version_lineage'}
      readiness: {type: array, items: {$ref: '#/$defs/requirement_readiness_item'}}
      source_attempts: {type: array, items: {$ref: '#/$defs/source_attempt_view'}}
      cost: {$ref: '#/$defs/research_cost_breakdown'}
      trajectory_ref: {type: [string, 'null']}
      telemetry_ref: {type: [string, 'null']}
      ledger_ref: {type: string, minLength: 1}
      generated_at: {type: string, format: date-time}
  horizon_outcome_view:
    type: object
    additionalProperties: false
    required: [forecast_id, horizon, direction, quality_status, return_pct, net_return_pct, brier_score, direction_correct, mfe_pct, mae_pct, unavailable_reason, observed_at]
    properties:
      forecast_id: {type: string, minLength: 1}
      horizon: {type: string, enum: [30m, 24h, 72h]}
      direction: {type: string, enum: [long, short, neutral, no_trade]}
      quality_status: {type: string, minLength: 1}
      return_pct: {type: [number, 'null']}
      net_return_pct: {type: [number, 'null']}
      brier_score: {type: [number, 'null'], minimum: 0, maximum: 1}
      direction_correct: {type: [boolean, 'null']}
      mfe_pct: {type: [number, 'null']}
      mae_pct: {type: [number, 'null']}
      unavailable_reason: {type: [string, 'null']}
      observed_at: {type: [string, 'null'], format: date-time}
  research_value_evaluation:
    type: object
    additionalProperties: false
    required: [schema_version, evaluation_id, run_id, artifact_id, evaluation_version, mode, hard_coverage_ratio, soft_coverage_ratio, accepted_evidence_count, rejected_evidence_count, typed_fact_count, baseline_status, latency_ms, cost_status, known_cost_usd, citation_traceability, usefulness, terminal_reason, outcomes, evaluated_at]
    properties:
      schema_version: {type: string, const: research-value-evaluation.v1}
      evaluation_id: {type: string, minLength: 1}
      run_id: {type: string, minLength: 1}
      artifact_id: {type: [string, 'null']}
      evaluation_version: {type: string, minLength: 1}
      mode: {type: string, enum: [directional, research_only, failed]}
      coverage_basis: {type: [string, 'null'], enum: [saved_result, saved_request, saved_task_request, saved_checkpoint, round_request_only, unavailable, invalid, null]}
      coverage_basis_ref: {type: [string, 'null']}
      coverage_cutoff_at: {type: [string, 'null'], format: date-time}
      hard_coverage_ratio: {type: [number, 'null'], minimum: 0, maximum: 1}
      soft_coverage_ratio: {type: [number, 'null'], minimum: 0, maximum: 1}
      accepted_evidence_count: {type: integer, minimum: 0}
      rejected_evidence_count: {type: integer, minimum: 0}
      typed_fact_count: {type: integer, minimum: 0}
      baseline_status: {type: string, enum: [not_applicable, pending, ready, unavailable]}
      latency_ms: {type: [integer, 'null'], minimum: 0}
      cost_status: {type: string, enum: [known, partial, unknown]}
      known_cost_usd: {type: [number, 'null'], minimum: 0}
      citation_traceability: {type: number, minimum: 0, maximum: 1}
      usefulness: {type: string, enum: [useful, partial, not_useful, unlabeled]}
      terminal_reason: {type: [string, 'null']}
      outcomes: {type: array, items: {$ref: '#/$defs/horizon_outcome_view'}}
      evaluated_at: {type: string, format: date-time}
  evolution_candidate_summary:
    type: object
    additionalProperties: false
    required: [candidate_id, candidate_type, version, status, source, input_refs, stages, owner_status]
    properties:
      candidate_id: {type: string, minLength: 1}
      candidate_type: {type: string, minLength: 1}
      version: {type: string, minLength: 1}
      status: {type: string, minLength: 1}
      source: {type: string, minLength: 1}
      input_refs: {type: array, items: {type: string}}
      stages: {type: array, items: {type: string, enum: [replay, holdout, shadow]}}
      owner_status: {type: string, enum: [not_ready, pending_owner_review, promoted, retained, rejected]}

  research_usage_call:
    type: object
    additionalProperties: false
    required: [ordinal, kind, turn, step, attempt, provider, model, state, usage_source, started_at, observed_at, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, reasoning_tokens, total_tokens, issues]
    properties:
      ordinal: {type: integer, minimum: 1}
      kind: {type: string, enum: [model, compaction]}
      turn: {type: [integer, 'null'], minimum: 0}
      step: {type: [integer, 'null'], minimum: 0}
      attempt: {type: integer, minimum: 1}
      provider: {type: [string, 'null']}
      model: {type: [string, 'null']}
      state: {type: string, enum: [finalized, failed, incomplete]}
      usage_source: {type: string, enum: [final, stream, none]}
      started_at: {type: [string, 'null'], format: date-time}
      observed_at: {type: [string, 'null'], format: date-time}
      input_tokens: {type: [integer, 'null'], minimum: 0}
      output_tokens: {type: [integer, 'null'], minimum: 0}
      cache_read_tokens: {type: [integer, 'null'], minimum: 0}
      cache_write_tokens: {type: [integer, 'null'], minimum: 0}
      reasoning_tokens: {type: [integer, 'null'], minimum: 0}
      total_tokens: {type: [integer, 'null'], minimum: 0}
      issues: {type: array, items: {type: string}}
  research_tool_attempt:
    type: object
    additionalProperties: false
    required: [ordinal, call_id, kind, state, failure_kind]
    properties:
      ordinal: {type: integer, minimum: 1}
      call_id: {type: string}
      kind: {type: string, enum: [research, other]}
      state: {type: string, enum: [succeeded, failed, incomplete]}
      failure_kind: {type: [string, 'null'], enum: [argument_validation, tool_error, null]}
  research_usage_session:
    type: object
    additionalProperties: false
    required: [session_id, role, model_steps, usage_samples, recorded_tokens, status, issues, archive_sha256]
    properties:
      session_id: {type: string}
      role: {type: string, enum: [main, delegated]}
      model_steps: {type: integer, minimum: 0}
      usage_samples: {type: integer, minimum: 0}
      recorded_tokens: {type: [integer, 'null'], minimum: 0}
      status: {type: string, enum: [accounted, partial]}
      issues: {type: array, items: {type: string}}
      archive_sha256: {type: string}
      calls: {type: array, items: {$ref: '#/$defs/research_usage_call'}}
      tool_attempts: {type: array, items: {$ref: '#/$defs/research_tool_attempt'}}
      tool_issues: {type: array, items: {type: string}}
  usage_collection_view:
    type: object
    additionalProperties: false
    required: [run_id, session_id, generation, status, checked_at, next_check_at, attempts, last_snapshot_id, error_code]
    properties:
      run_id: {type: string}
      session_id: {type: string}
      generation: {type: integer, minimum: 0}
      status: {type: string, enum: [pending, waiting_archive, partial, captured, retry_wait]}
      checked_at: {type: [string, 'null'], format: date-time}
      next_check_at: {type: string, format: date-time}
      attempts: {type: integer, minimum: 0}
      last_snapshot_id: {type: [string, 'null']}
      error_code: {type: [string, 'null']}
  research_usage_view:
    type: object
    additionalProperties: false
    required: [schema_version, run_id, status, sessions, total_run_tokens, estimated_cost_usd, limitations, observed_at]
    properties:
      schema_version: {type: string, const: research-usage-view.v1}
      run_id: {type: string}
      status: {type: string, enum: [partial, unavailable]}
      sessions: {type: array, items: {$ref: '#/$defs/research_usage_session'}}
      total_run_tokens: {type: 'null'}
      estimated_cost_usd: {type: 'null'}
      limitations: {type: array, items: {type: string}}
      observed_at: {type: string, format: date-time}
  research_usage_snapshot:
    type: object
    additionalProperties: false
    required: [schema_version, snapshot_id, run_id, recorded_at, accounting_version, session_generation, payload_sha256, view]
    properties:
      schema_version: {type: string, const: research-usage-snapshot.v1}
      snapshot_id: {type: string}
      run_id: {type: string}
      recorded_at: {type: string, format: date-time}
      accounting_version: {type: string}
      session_generation: {type: [integer, 'null'], minimum: 0}
      payload_sha256: {type: string}
      view: {$ref: '#/$defs/research_usage_view'}
  research_usage_snapshot_page:
    type: object
    additionalProperties: false
    required: [items, total, offset, limit]
    properties:
      items: {type: array, items: {$ref: '#/$defs/research_usage_snapshot'}}
      total: {type: integer, minimum: 0}
      offset: {type: integer, minimum: 0}
      limit: {type: integer, minimum: 1}
