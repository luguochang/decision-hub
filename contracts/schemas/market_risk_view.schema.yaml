$schema: https://json-schema.org/draft/2020-12/schema
$id: https://decision-hub.local/contracts/market_risk_view.schema.json
title: MarketRiskViewContracts
$defs:
  risk_scope:
    type: object
    additionalProperties: false
    properties:
      scope_id: {type: string, minLength: 1}
      label: {type: string, minLength: 1}
      instrument: {type: string, minLength: 1}
      venue: {type: string, minLength: 1}
      market_type: {type: string, const: spot}
      price_type: {type: string, const: trade}
      enabled: {type: boolean}
    required: [scope_id, label, instrument, venue, market_type, price_type, enabled]
  risk_scopes_view:
    type: object
    additionalProperties: false
    properties:
      schema_version: {type: string, const: market-risk-scopes.v1}
      as_of: {type: string, format: date-time}
      items: {type: array, items: {$ref: '#/$defs/risk_scope'}}
    required: [schema_version, as_of, items]
  risk_quote_view:
    type: object
    additionalProperties: false
    properties:
      price: {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'}
      quoted_at: {type: string, format: date-time}
      known_at: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
      source_name: {type: string, minLength: 1}
      price_kind: {type: string, const: close_1m}
      change_24h_pct: {type: [number, 'null']}
    required: [price, quoted_at, known_at, source_name, price_kind, change_24h_pct]
  risk_observed_window:
    type: object
    additionalProperties: false
    properties:
      kind: {type: string, const: observed_path}
      start_at: {type: string, format: date-time}
      end_at: {type: string, format: date-time}
      samples: {type: integer, minimum: 0}
      expected_samples: {type: integer, minimum: 0}
      coverage_ratio: {type: number, minimum: 0, maximum: 1}
      max_adverse_move_pct: {type: [number, 'null']}
    required: [kind, start_at, end_at, samples, expected_samples, coverage_ratio, max_adverse_move_pct]
  risk_research_ref:
    type: object
    additionalProperties: false
    properties:
      run_id: {type: [string, 'null'], minLength: 1}
      artifact_id: {type: [string, 'null'], minLength: 1}
      status: {type: string, enum: [not_available, legacy_unquantified, partial, qualified]}
      summary: {type: [string, 'null']}
    required: [run_id, artifact_id, status, summary]
  risk_monitor_status:
    type: object
    additionalProperties: false
    properties:
      plan_id: {type: string, minLength: 1}
      scope_id: {type: string, minLength: 1}
      status: {type: string, enum: [active, paused, degraded, expired, unknown]}
      last_evaluated_at: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
      next_evaluation_at: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
      error_code: {type: [string, 'null']}
      last_truth: {type: [string, 'null'], enum: ['true', 'false', unknown, error, null]}
      active_alert_id: {type: [string, 'null'], minLength: 1}
    required: [plan_id, scope_id, status, last_evaluated_at, next_evaluation_at, error_code, last_truth, active_alert_id]
  risk_alert_research_request:
    type: object
    additionalProperties: false
    properties:
      request_id: {type: string, minLength: 1}
      scope_id: {type: string, minLength: 1}
      status: {type: string, enum: [pending_admission, claiming, queued, completed, failed]}
      error_code: {type: [string, 'null']}
      attempts: {type: integer, minimum: 0, maximum: 3}
      run_id: {type: [string, 'null'], minLength: 1}
    required: [request_id, scope_id, status, error_code, attempts, run_id]
  risk_alert_view:
    type: object
    additionalProperties: false
    properties:
      schema_version: {type: string, const: market-risk-alert.v1}
      alert_id: {type: string, minLength: 1}
      scope_id: {type: string, minLength: 1}
      plan_id: {type: string, minLength: 1}
      severity: {type: string, enum: [info, warning, critical]}
      status: {type: string, enum: [active, resolved]}
      headline: {type: string, minLength: 1}
      explanation: {type: string, minLength: 1}
      triggered_at: {type: string, format: date-time}
      resolved_at: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
      condition_label: {type: string, minLength: 1}
      observed_value: {type: [number, 'null']}
      threshold_value: {type: [number, 'null']}
      value_unit: {type: string}
      report_run_id: {type: [string, 'null'], minLength: 1}
      research_request: {anyOf: [{$ref: '#/$defs/risk_alert_research_request'}, {type: 'null'}]}
      displayed_at: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
      acknowledged_at: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
    required: [schema_version, alert_id, scope_id, plan_id, severity, status, headline, explanation, triggered_at, resolved_at, condition_label, observed_value, threshold_value, value_unit, report_run_id, displayed_at, acknowledged_at]
  risk_summary_view:
    type: object
    additionalProperties: false
    properties:
      schema_version: {type: string, const: market-risk-summary.v1}
      scope_id: {type: string, minLength: 1}
      as_of: {type: string, format: date-time}
      risk_level: {type: string, enum: [unknown, normal, elevated, high]}
      data_status: {type: string, enum: [fresh, stale, missing, invalid]}
      headline: {type: string, minLength: 1}
      explanation: {type: string, minLength: 1}
      quote: {anyOf: [{$ref: '#/$defs/risk_quote_view'}, {type: 'null'}]}
      window: {anyOf: [{$ref: '#/$defs/risk_observed_window'}, {type: 'null'}]}
      strongest_counterargument: {type: [string, 'null']}
      research: {$ref: '#/$defs/risk_research_ref'}
      monitors: {type: array, items: {$ref: '#/$defs/risk_monitor_status'}}
      recent_alerts: {type: array, items: {$ref: '#/$defs/risk_alert_view'}}
    required: [schema_version, scope_id, as_of, risk_level, data_status, headline, explanation, quote, window, strongest_counterargument, research, monitors, recent_alerts]
  risk_timeline_point:
    type: object
    additionalProperties: false
    properties:
      at: {type: string, format: date-time}
      price: {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'}
      low: {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'}
      high: {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'}
    required: [at, price]
  risk_timeline_aggregation:
    type: object
    additionalProperties: false
    properties:
      method: {type: string, enum: [full_minutes, extreme_samples]}
      source_points: {type: integer, minimum: 0}
      output_points: {type: integer, minimum: 0, maximum: 2000}
      bucket_minutes: {type: integer, minimum: 1}
      path_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      provenance_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
    required: [method, source_points, output_points, bucket_minutes, path_hash, provenance_hash]
  risk_timeline_marker:
    type: object
    additionalProperties: false
    properties:
      marker_id: {type: string, minLength: 1}
      kind: {type: string, enum: [report, event, fact, interruption]}
      label: {type: string, minLength: 1}
      at: {type: string, format: date-time}
      occurred_at: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
      run_id: {type: [string, 'null']}
      artifact_id: {type: [string, 'null']}
      source_ref: {type: string, minLength: 1}
    required: [marker_id, kind, label, at, occurred_at, run_id, artifact_id, source_ref]
  risk_missing_range:
    type: object
    additionalProperties: false
    properties:
      start_at: {type: string, format: date-time}
      end_at: {type: string, format: date-time}
    required: [start_at, end_at]
  risk_timeline_view:
    type: object
    additionalProperties: false
    properties:
      schema_version: {type: string, const: market-risk-timeline.v1}
      scope_id: {type: string, minLength: 1}
      start: {type: string, format: date-time}
      end: {type: string, format: date-time}
      as_of: {type: string, format: date-time}
      data_status: {type: string, enum: [fresh, stale, missing, invalid]}
      points: {type: array, items: {$ref: '#/$defs/risk_timeline_point'}}
      missing_ranges: {type: array, items: {$ref: '#/$defs/risk_missing_range'}}
      alerts: {type: array, items: {$ref: '#/$defs/risk_alert_view'}}
      aggregation: {$ref: '#/$defs/risk_timeline_aggregation'}
      markers: {type: array, items: {$ref: '#/$defs/risk_timeline_marker'}}
      markers_truncated: {type: boolean}
    required: [schema_version, scope_id, start, end, as_of, data_status, points, missing_ranges, alerts]
  risk_receipt_command:
    type: object
    additionalProperties: false
    properties:
      request_id: {type: string, minLength: 1, maxLength: 128}
      client_time: {type: string, format: date-time}
    required: [request_id, client_time]
  risk_receipt_view:
    type: object
    additionalProperties: false
    properties:
      schema_version: {type: string, const: market-risk-receipt.v1}
      alert_id: {type: string, minLength: 1}
      request_id: {type: string, minLength: 1}
      status: {type: string, enum: [recorded, already_recorded]}
      recorded_at: {type: string, format: date-time}
    required: [schema_version, alert_id, request_id, status, recorded_at]
  risk_monitor_command:
    type: object
    additionalProperties: false
    properties:
      action: {type: string, enum: [pause, resume]}
      request_id: {type: string, minLength: 1, maxLength: 128}
    required: [action, request_id]
  risk_monitor_command_receipt:
    type: object
    additionalProperties: false
    properties:
      schema_version: {type: string, const: market-risk-monitor-command-receipt.v1}
      plan_id: {type: string, minLength: 1}
      request_id: {type: string, minLength: 1}
      action: {type: string, enum: [pause, resume]}
      status: {type: string, enum: [applied, already_applied]}
      monitor: {$ref: '#/$defs/risk_monitor_status'}
    required: [schema_version, plan_id, request_id, action, status, monitor]
