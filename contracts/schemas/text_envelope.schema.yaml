$schema: https://json-schema.org/draft/2020-12/schema
$id: https://decision-hub.local/contracts/text-envelope.schema.json
title: TextEnvelope
type: object
additionalProperties: false
required: [schema_version, source_id, source_type, observed_at, received_at, raw_text, language, content_hash]
properties:
  schema_version: {type: string, const: 'text-envelope.v1'}
  source_id: {type: string, minLength: 1}
  source_type: {type: string, enum: [manual, transcript, official_feed, web, document]}
  observed_at: {type: string, format: date-time}
  published_at: {type: [string, 'null'], format: date-time}
  received_at: {type: string, format: date-time}
  raw_text: {type: string, minLength: 1, maxLength: 200000}
  language: {type: string, minLength: 2, maxLength: 16}
  event_hint: {type: [string, 'null'], maxLength: 128}
  source_url: {type: [string, 'null'], format: uri}
  revision_of: {type: [string, 'null']}
  content_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
