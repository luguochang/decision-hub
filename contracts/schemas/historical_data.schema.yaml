$schema: https://json-schema.org/draft/2020-12/schema
$id: https://decision-hub.local/contracts/historical-data.schema.json
title: HistoricalDataContracts
type: object
additionalProperties: false
required: [schema_version]
properties:
  schema_version: {type: string, const: historical-data-contracts.v1}
$defs:
  data_job_create:
    type: object
    additionalProperties: false
    required: [idempotency_key, requested_by, dataset_ids, window_start_at, window_end_at]
    properties:
      idempotency_key: {type: string, minLength: 8, maxLength: 256}
      requested_by: {type: string, enum: [owner]}
      dataset_ids:
        type: array
        minItems: 1
        maxItems: 6
        uniqueItems: true
        items: {$ref: '#/$defs/dataset_id'}
      window_start_at: {type: string, format: date-time}
      window_end_at: {type: string, format: date-time}
  data_job_view:
    type: object
    additionalProperties: false
    required: [schema_version, job_id, idempotency_key, request_hash, requested_by, dataset_ids, window_start_at, window_end_at, status, attempt, partition_refs, coverage_manifest_ref, errors, created_at, updated_at, finished_at]
    properties:
      schema_version: {type: string, const: data-job.v1}
      job_id: {type: string, pattern: '^datajob_[a-f0-9]{32}$'}
      idempotency_key: {type: string, minLength: 8, maxLength: 256}
      request_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      requested_by: {type: string, enum: [owner]}
      dataset_ids:
        type: array
        minItems: 1
        maxItems: 6
        uniqueItems: true
        items: {$ref: '#/$defs/dataset_id'}
      window_start_at: {type: string, format: date-time}
      window_end_at: {type: string, format: date-time}
      status: {type: string, enum: [queued, running, partial, failed, completed]}
      attempt: {type: integer, minimum: 0}
      partition_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      coverage_manifest_ref: {type: [string, 'null'], maxLength: 2048}
      errors: {type: array, items: {type: string, minLength: 1, maxLength: 512}, uniqueItems: true}
      created_at: {type: string, format: date-time}
      updated_at: {type: string, format: date-time}
      finished_at: {type: [string, 'null'], format: date-time}
  dataset_coverage:
    type: object
    additionalProperties: false
    required: [dataset_id, status, source_id, requested_start_at, requested_end_at, actual_start_at, actual_end_at, row_count, unit, frequency, instrument, venue, contract_type, publication_time_precision, revision_policy, partition_refs, gaps]
    properties:
      dataset_id: {$ref: '#/$defs/dataset_id'}
      status: {type: string, enum: [complete, partial, missing]}
      source_id: {type: string, minLength: 1}
      requested_start_at: {type: string, format: date-time}
      requested_end_at: {type: string, format: date-time}
      actual_start_at: {type: [string, 'null'], format: date-time}
      actual_end_at: {type: [string, 'null'], format: date-time}
      row_count: {type: integer, minimum: 0}
      unit: {type: string, minLength: 1}
      frequency: {type: string, minLength: 1}
      instrument: {type: string, minLength: 1}
      venue: {type: [string, 'null']}
      contract_type: {type: [string, 'null']}
      publication_time_precision: {type: string, enum: [millisecond, second, date, unknown]}
      revision_policy: {type: string, enum: [immutable, revisable, unknown]}
      raw_capture_ids: {type: [array, 'null'], items: {type: string, minLength: 1}, uniqueItems: true}
      partition_refs: {type: array, items: {type: string, minLength: 1}, uniqueItems: true}
      gaps: {type: array, items: {type: string, minLength: 1, maxLength: 512}, uniqueItems: true}
  coverage_manifest:
    type: object
    additionalProperties: false
    required: [schema_version, job_id, requested_start_at, requested_end_at, datasets, generated_at]
    properties:
      schema_version: {type: string, const: coverage-manifest.v1}
      job_id: {type: string, pattern: '^datajob_[a-f0-9]{32}$'}
      requested_start_at: {type: string, format: date-time}
      requested_end_at: {type: string, format: date-time}
      datasets: {type: array, minItems: 1, maxItems: 6, items: {$ref: '#/$defs/dataset_coverage'}}
      generated_at: {type: string, format: date-time}
  partition_manifest:
    type: object
    additionalProperties: false
    required: [schema_version, dataset_id, partition_key, source_id, payload_ref, payload_hash, row_count, actual_start_at, actual_end_at, unit, frequency, instrument, venue, contract_type, created_at]
    properties:
      schema_version: {type: string, const: historical-partition-manifest.v1}
      dataset_id: {$ref: '#/$defs/dataset_id'}
      partition_key: {type: string, pattern: '^\d{4}-\d{2}$'}
      source_id: {type: string, minLength: 1}
      payload_ref: {type: string, minLength: 1, maxLength: 2048}
      payload_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
      row_count: {type: integer, minimum: 1}
      actual_start_at: {type: string, format: date-time}
      actual_end_at: {type: string, format: date-time}
      unit: {type: string, minLength: 1}
      frequency: {type: string, minLength: 1}
      instrument: {type: string, minLength: 1}
      venue: {type: [string, 'null']}
      contract_type: {type: [string, 'null']}
      created_at: {type: string, format: date-time}
  dataset_id:
    type: string
    enum:
      - crypto.btc_usdt.ohlcv_1h
      - crypto.btc_usdt.ohlcv_1d
      - crypto.eth_usdt.ohlcv_1d
      - crypto.btc_usdt_swap.funding_rate
      - crypto.btc_usdt_swap.open_interest
      - macro.fred.dgs2
      - macro.fred.dgs10
      - macro.fred.dtwexbgs
