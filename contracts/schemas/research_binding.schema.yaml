        "perpetual_scope_id": {
          "type": "string",
          "enum": [
            "crypto:perp:okx:BTC-USDT-SWAP:trade:1m",
            "crypto:perp:okx:ETH-USDT-SWAP:trade:1m"
          ]
        },
        "admission_ref": {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "ref": {
              "type": "string",
