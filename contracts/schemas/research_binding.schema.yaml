        "study_id",
        "selected_from",
        "watch",
        "event",
        "study",
        "trigger",
        "library_scope",
        "source_hash"
      ],
      "allOf": [
        {
          "if": {
            "properties": {
              "selected_from": {
                "const": "watch"
              }
            }
          },
          "then": {
            "properties": {
              "watch": {
                "$ref": "agentic_research.schema.yaml#/$defs/event_watch"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "selected_from": {
                "const": "event"
              }
            }
          },
          "then": {
            "properties": {
              "watch": {
                "type": "null"
              },
              "event": {
                "$ref": "#/$defs/research_factory_event_source"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "selected_from": {
                "const": "none"
              }
            }
          },
          "then": {
            "properties": {
              "watch": {
                "type": "null"
              },
              "event": {
                "anyOf": [
                  {
                    "title": "ResearchFactoryEmptyEventSource",
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "event_id": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 128
                      },
                      "event_type": {
                        "type": "string",
                        "const": ""
                      },
                      "occurred_at": {
                        "type": "string",
                        "format": "date-time",
                        "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                      },
                      "received_at": {
                        "type": "string",
                        "format": "date-time",
                        "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                      },
                      "generation": {
                        "type": "integer",
                        "minimum": 1
                      },
                      "status": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 32
                      }
                    },
                    "required": [
                      "event_id",
                      "event_type",
                      "occurred_at",
                      "received_at",
                      "generation",
                      "status"
                    ]
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            }
          }
        }
      ]
    }
