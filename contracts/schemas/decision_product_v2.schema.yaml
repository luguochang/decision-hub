          "maxItems": 128
        }
      },
      "required": [
        "status",
        "reason",
        "evidence_refs"
      ],
      "allOf": [
        {
          "if": {
            "properties": {
              "status": {
                "const": "passed"
              }
            }
          },
          "then": {
            "properties": {
              "evidence_refs": {
                "minItems": 1
              }
            }
          }
        }
      ]
