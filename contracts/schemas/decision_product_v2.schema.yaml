{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://decision-hub.local/contracts/decision-product-v2.schema.json",
  "title": "DecisionProductContractsV2",
  "description": "Canonical V2 settings, unit comparison, full candidate, native review and publication contracts. Validation grants no source, review, account or execution authority.",
  "$defs": {
    "decision_source_ref_v1": {
      "title": "DecisionSourceRefV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$(?![\\s\\S])"
        },
        "hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$(?![\\s\\S])"
        }
      },
      "required": [
        "ref",
        "hash"
      ]
    },
    "decision_decimal_v2": {
      "title": "DecisionDecimalV2",
      "type": "string",
      "maxLength": 52,
      "pattern": "^-?(?:0|[1-9][0-9]{0,31})(?:\\.[0-9]{1,18})?$(?![\\s\\S])",
      "description": "Finite decimal text; up to 32 integer and 18 fractional digits; field units."
    },
    "decision_nonnegative_decimal_v2": {
      "title": "DecisionNonnegativeDecimalV2",
      "type": "string",
      "maxLength": 51,
      "pattern": "^(?:0|[1-9][0-9]{0,31})(?:\\.[0-9]{1,18})?$(?![\\s\\S])"
    },
    "decision_positive_decimal_v2": {
      "title": "DecisionPositiveDecimalV2",
      "type": "string",
      "maxLength": 51,
      "pattern": "^(?!0(?:\\.0+)?$)(?:0|[1-9][0-9]{0,31})(?:\\.[0-9]{1,18})?$(?![\\s\\S])"
    },
    "decision_utc_timestamp_v2": {
      "title": "DecisionUtcTimestampV2",
      "type": "string",
      "format": "date-time",
      "maxLength": 27,
      "pattern": "^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]{1,6})?Z$(?![\\s\\S])",
      "description": "UTC RFC3339 Z, real Gregorian date, microsecond precision or less."
    },
    "instrument_contract_v1": {
      "title": "InstrumentContractV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "const": "instrument-contract.v1"
        },
        "venue": {
          "const": "okx"
        },
        "inst_id": {
          "type": "string",
          "enum": [
            "BTC-USDT-SWAP",
            "ETH-USDT-SWAP"
          ]
        },
        "instrument_kind": {
          "const": "perpetual"
        },
        "linear_or_inverse": {
          "const": "linear"
        },
        "base": {
          "type": "string",
          "enum": [
            "BTC",
            "ETH"
          ]
        },
        "quote": {
          "const": "USDT"
        },
        "settle": {
          "const": "USDT"
        },
        "ct_val": {
          "$ref": "#/$defs/decision_positive_decimal_v2"
        },
        "ct_mult": {
          "$ref": "#/$defs/decision_positive_decimal_v2"
        },
        "ct_val_ccy": {
          "type": "string",
          "enum": [
            "BTC",
            "ETH",
            "USDT"
          ]
        },
        "lot_sz": {
          "$ref": "#/$defs/decision_positive_decimal_v2"
        },
        "min_sz": {
          "$ref": "#/$defs/decision_positive_decimal_v2"
        },
        "tick_sz": {
          "$ref": "#/$defs/decision_positive_decimal_v2"
        },
        "price_basis_refs": {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "trade": {
              "oneOf": [
                {
                  "$ref": "#/$defs/decision_source_ref_v1"
                },
                {
                  "type": "null"
                }
              ]
            },
            "mark": {
              "oneOf": [
                {
                  "$ref": "#/$defs/decision_source_ref_v1"
                },
                {
                  "type": "null"
                }
              ]
            },
            "index": {
              "oneOf": [
                {
                  "$ref": "#/$defs/decision_source_ref_v1"
                },
                {
                  "type": "null"
                }
              ]
            }
          },
          "required": [
            "trade",
            "mark",
            "index"
          ]
        },
        "rule_source_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "rule_source_hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$(?![\\s\\S])"
        },
        "funding_schedule_ref": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_source_ref_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "margin_tier_ref": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_source_ref_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "effective_at": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_utc_timestamp_v2"
            },
            {
              "type": "null"
            }
          ]
        },
        "known_at": {
          "$ref": "#/$defs/decision_utc_timestamp_v2"
        },
        "state": {
          "type": "string",
          "enum": [
            "live",
            "preopen",
            "suspended",
            "expired",
            "unknown"
          ]
        },
        "effective_at_source": {
          "type": "string",
          "enum": [
            "venue_rule",
            "unknown"
          ]
        }
      },
      "required": [
        "schema_version",
        "venue",
        "inst_id",
        "instrument_kind",
        "linear_or_inverse",
        "base",
        "quote",
        "settle",
        "ct_val",
        "ct_mult",
        "ct_val_ccy",
        "lot_sz",
        "min_sz",
        "tick_sz",
        "price_basis_refs",
        "rule_source_ref",
        "rule_source_hash",
        "funding_schedule_ref",
        "margin_tier_ref",
        "effective_at",
        "effective_at_source",
        "known_at",
        "state"
      ],
      "allOf": [
        {
          "if": {
            "properties": {
              "inst_id": {
                "const": "BTC-USDT-SWAP"
              }
            }
          },
          "then": {
            "properties": {
              "base": {
                "const": "BTC"
              },
              "ct_val_ccy": {
                "type": "string",
                "enum": [
                  "BTC",
                  "USDT"
                ]
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "inst_id": {
                "const": "ETH-USDT-SWAP"
              }
            }
          },
          "then": {
            "properties": {
              "base": {
                "const": "ETH"
              },
              "ct_val_ccy": {
                "type": "string",
                "enum": [
                  "ETH",
                  "USDT"
                ]
              }
            }
          }
        }
      ]
    },
    "decision_execution_profile_v1": {
      "title": "DecisionExecutionProfileV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "const": "decision-execution-profile.v1"
        },
        "profile_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$(?![\\s\\S])"
        },
        "execution": {
          "const": "paper_only"
        },
        "position_mode": {
          "const": "net"
        },
        "margin_mode": {
          "const": "isolated"
        },
        "settle_ccy": {
          "const": "USDT"
        },
        "initial_notional_to_margin_ratio": {
          "const": "1"
        }
      },
      "required": [
        "schema_version",
        "profile_ref",
        "hash",
        "execution",
        "position_mode",
        "margin_mode",
        "settle_ccy",
        "initial_notional_to_margin_ratio"
      ]
    },
    "position_context_v2": {
      "title": "PositionContextV2",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "const": "position-context.v2"
        },
        "instrument_id": {
          "type": "string",
          "enum": [
            "okx:BTC-USDT-SWAP",
            "okx:ETH-USDT-SWAP"
          ]
        },
        "instrument_ref": {
          "$ref": "#/$defs/decision_source_ref_v1"
        },
        "state": {
          "type": "string",
          "enum": [
            "flat",
            "long",
            "short",
            "unknown"
          ]
        },
        "signed_contracts": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_decimal_v2"
            },
            {
              "type": "null"
            }
          ]
        },
        "entry_price": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_positive_decimal_v2"
            },
            {
              "type": "null"
            }
          ],
          "description": "USDT/base"
        },
        "isolated_margin": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_nonnegative_decimal_v2"
            },
            {
              "type": "null"
            }
          ],
          "description": "USDT"
        },
        "margin_mode": {
          "type": "string",
          "enum": [
            "isolated",
            "cross",
            "unknown"
          ]
        },
        "position_mode": {
          "type": "string",
          "enum": [
            "net",
            "hedge",
            "unknown"
          ]
        },
        "hedge_leg": {
          "type": [
            "string",
            "null"
          ],
          "enum": [
            "long",
            "short",
            null
          ]
        },
        "leverage": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_positive_decimal_v2"
            },
            {
              "type": "null"
            }
          ]
        },
        "liquidation_estimate": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_positive_decimal_v2"
            },
            {
              "type": "null"
            }
          ],
          "description": "USDT/base; supplied derivation, never inferred from unknown funds."
        },
        "source": {
          "type": "string",
          "enum": [
            "user_declared",
            "verified",
            "paper_policy",
            "unknown"
          ]
        },
        "ref": {
          "type": [
            "string",
            "null"
          ],
          "minLength": 1,
          "maxLength": 256
        },
        "hash": {
          "type": [
            "string",
            "null"
          ],
          "pattern": "^[a-f0-9]{64}$(?![\\s\\S])"
        },
        "account_ref": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_source_ref_v1"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "schema_version",
        "instrument_id",
        "instrument_ref",
        "state",
        "signed_contracts",
        "entry_price",
        "isolated_margin",
        "margin_mode",
        "position_mode",
        "hedge_leg",
        "leverage",
        "liquidation_estimate",
        "source",
        "ref",
        "hash",
        "account_ref"
      ],
      "allOf": [
        {
          "if": {
            "properties": {
              "state": {
                "const": "flat"
              }
            }
          },
          "then": {
            "properties": {
              "signed_contracts": {
                "const": "0"
              },
              "entry_price": {
                "type": "null"
              },
              "liquidation_estimate": {
                "type": "null"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "state": {
                "const": "long"
              }
            }
          },
          "then": {
            "properties": {
              "signed_contracts": {
                "type": "string",
                "pattern": "^(?!0(?:\\.0+)?$)(?:0|[1-9][0-9]{0,31})(?:\\.[0-9]{1,18})?$(?![\\s\\S])"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "state": {
                "const": "short"
              }
            }
          },
          "then": {
            "properties": {
              "signed_contracts": {
                "type": "string",
                "pattern": "^-(?!0(?:\\.0+)?$)(?:0|[1-9][0-9]{0,31})(?:\\.[0-9]{1,18})?$(?![\\s\\S])"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "state": {
                "const": "unknown"
              }
            }
          },
          "then": {
            "properties": {
              "signed_contracts": {
                "type": "null"
              }
            }
          }
        }
      ]
    },
    "decision_collateral_v1": {
      "title": "DecisionCollateralV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "ccy": {
          "type": "string",
          "pattern": "^[A-Z0-9]{2,16}$(?![\\s\\S])"
        },
        "amount": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_decimal_v2"
            },
            {
              "type": "null"
            }
          ]
        },
        "usdt_value": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_decimal_v2"
            },
            {
              "type": "null"
            }
          ]
        },
        "valuation_ref": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_source_ref_v1"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "ccy",
        "amount",
        "usdt_value",
        "valuation_ref"
      ]
    },
    "decision_risk_limit_v1": {
      "title": "DecisionRiskLimitV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "unit": {
          "type": "string",
          "enum": [
            "USDT",
            "equity_fraction"
          ]
        },
        "value": {
          "type": "string",
          "maxLength": 51,
          "pattern": "^(?:0|[1-9][0-9]{0,31})(?:\\.[0-9]{1,18})?$(?![\\s\\S])"
        }
      },
      "required": [
        "unit",
        "value"
      ],
      "allOf": [
        {
          "if": {
            "properties": {
              "unit": {
                "const": "equity_fraction"
              }
            }
          },
          "then": {
            "properties": {
              "value": {
                "type": "string",
                "pattern": "^(?:0(?:\\.[0-9]{1,18})?|1(?:\\.0{1,18})?)$(?![\\s\\S])"
              }
            }
          }
        }
      ]
    },
    "decision_account_limits_v1": {
      "title": "DecisionAccountLimitsV1",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "max_gross_notional": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_risk_limit_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "max_reserved_margin": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_risk_limit_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "max_fee_buffer": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_risk_limit_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "max_stress_loss": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_risk_limit_v1"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "max_gross_notional",
        "max_reserved_margin",
        "max_fee_buffer",
        "max_stress_loss"
      ]
    },
    "account_snapshot_v2": {
      "title": "AccountSnapshotV2",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "const": "account-snapshot.v2"
        },
        "owner_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$(?![\\s\\S])"
        },
        "account_kind": {
          "type": "string",
          "enum": [
            "user_declared",
            "paper"
          ]
        },
        "account_id": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^\\S(?:[\\s\\S]*\\S)?$(?![\\s\\S])"
        },
        "source": {
          "type": "string",
          "enum": [
            "user_declared",
            "verified",
            "paper_policy",
            "unknown"
          ]
        },
        "as_of": {
          "$ref": "#/$defs/decision_utc_timestamp_v2"
        },
        "account_mode": {
          "type": "string",
          "enum": [
            "single_currency",
            "multi_currency",
            "portfolio_margin",
            "unknown"
          ]
        },
        "positions": {
          "oneOf": [
            {
              "type": "array",
              "maxItems": 128,
              "items": {
                "$ref": "#/$defs/position_context_v2"
              }
            },
            {
              "type": "null"
            }
          ]
        },
        "collateral": {
          "oneOf": [
            {
              "type": "array",
              "maxItems": 64,
              "items": {
                "$ref": "#/$defs/decision_collateral_v1"
              }
            },
            {
              "type": "null"
            }
          ]
        },
        "valuation_ccy": {
          "const": "USDT"
        },
        "equity": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_decimal_v2"
            },
            {
              "type": "null"
            }
          ]
        },
        "available_margin": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_decimal_v2"
            },
            {
              "type": "null"
            }
          ]
        },
        "fee_tier": {
          "type": [
            "string",
            "null"
          ],
          "minLength": 1,
          "maxLength": 128
        },
        "limits": {
          "$ref": "#/$defs/decision_account_limits_v1"
        },
        "original": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_source_ref_v1"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "schema_version",
        "owner_id",
        "account_kind",
        "account_id",
        "source",
        "as_of",
        "account_mode",
        "positions",
        "collateral",
        "valuation_ccy",
        "equity",
        "available_margin",
        "fee_tier",
        "limits",
        "original"
      ],
      "allOf": [
        {
          "if": {
            "properties": {
              "source": {
                "const": "user_declared"
              }
            }
          },
          "then": {
            "properties": {
              "account_kind": {
                "const": "user_declared"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "source": {
                "const": "paper_policy"
              }
            }
          },
          "then": {
            "properties": {
              "account_kind": {
                "const": "paper"
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "source": {
                "const": "unknown"
              }
            }
          },
          "then": {
            "properties": {
              "positions": {
                "type": "null"
              },
              "collateral": {
                "type": "null"
              },
              "equity": {
                "type": "null"
              },
              "available_margin": {
                "type": "null"
              },
              "original": {
                "type": "null"
              }
            }
          }
        }
      ]
    },
    "utility_policy_v2": {
      "title": "UtilityPolicyV2",
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema_version": {
          "const": "utility-policy.v2"
        },
        "policy_ref": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "hash": {
          "type": "string",
          "pattern": "^[a-f0-9]{64}$(?![\\s\\S])"
        },
        "source": {
          "type": "string",
          "enum": [
            "user",
            "research_default"
          ]
        },
        "objective": {
          "const": "mean_net"
        },
        "risk_penalty": {
          "const": "0"
        },
        "max_gross_notional": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_risk_limit_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "max_planned_loss": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_risk_limit_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "tail_constraints": {
          "oneOf": [
            {
              "type": "array",
              "maxItems": 16,
              "items": {
                "$ref": "#/$defs/decision_source_ref_v1"
              }
            },
            {
              "type": "null"
            }
          ]
        },
        "position_scenario": {
          "type": "string",
          "enum": [
            "flat",
            "long",
            "short",
            "unknown"
          ]
        },
        "margin_buffer_policy": {
          "oneOf": [
            {
              "$ref": "#/$defs/decision_source_ref_v1"
            },
            {
              "type": "null"
            }
          ]
        },
        "allowed_leverage": {
          "oneOf": [
            {
              "type": "array",
              "minItems": 1,
              "maxItems": 16,
              "uniqueItems": true,
              "items": {
                "$ref": "#/$defs/decision_positive_decimal_v2"
              }
            },
            {
              "type": "null"
            }
          ]
        },
        "allowed_sides": {
          "oneOf": [
            {
              "type": "array",
              "minItems": 1,
              "maxItems": 3,
              "uniqueItems": true,
              "items": {
                "type": "string",
                "enum": [
                  "flat",
                  "long",
                  "short"
                ]
              }
            },
            {
              "type": "null"
            }
