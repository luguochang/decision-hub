{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://decision-hub.local/contracts/revision_feedback_evaluation.schema.json",
  "title": "RevisionFeedbackEvaluationContracts",
  "$defs": {
    "revision_feedback_source_reason": {
      "type": "string",
      "enum": ["source_missing", "source_invalid", "source_identity_mismatch", "source_hash_mismatch", "source_conflict", "source_not_research", "source_not_terminal"]
    },
    "revision_feedback_source_witness": {
      "title": "RevisionFeedbackSourceWitness",
      "type": "object",
      "additionalProperties": false,
      "required": ["source_table", "primary_key", "row_hash_kind", "row_hash", "source_schema"],
      "properties": {
        "source_table": {"type": "string", "enum": ["workbench_feedback", "report_revisions", "runs", "artifacts", "research_results", "run_role_outputs", "snapshots", "forecasts", "outcomes", "evaluations", "research_evidence", "research_facts", "event_watches", "observations", "dsh_session_links", "dsh_session_prompts", "studies", "research_run_scopes"]},
        "primary_key": {"type": "array", "minItems": 1, "maxItems": 2, "items": {"type": "string", "minLength": 1, "maxLength": 256}},
        "row_hash_kind": {"type": "string", "const": "sqlite-complete-row.v1"},
        "row_hash": {"type": "string", "minLength": 64, "maxLength": 64, "pattern": "^[0-9a-f]{64}$"},
        "source_schema": {"type": ["string", "null"], "minLength": 1, "maxLength": 128}
      },
      "oneOf": [
        {"properties": {"source_table": {"const": "dsh_session_prompts"}, "primary_key": {"minItems": 2, "maxItems": 2}}},
        {"properties": {"source_table": {"enum": ["workbench_feedback", "report_revisions", "runs", "artifacts", "research_results", "run_role_outputs", "snapshots", "forecasts", "outcomes", "evaluations", "research_evidence", "research_facts", "event_watches", "observations", "dsh_session_links", "studies", "research_run_scopes"]}, "primary_key": {"minItems": 1, "maxItems": 1}}}
      ]
    },
    "revision_feedback_evaluation_binding": {
      "title": "RevisionFeedbackEvaluationBinding",
      "type": "object",
      "additionalProperties": false,
      "required": ["binding_id", "recorded_order", "source_run_id", "artifact_id", "evaluation_version", "basis_ref", "basis_hash", "feedback_payload_hash", "value_payload_hash", "binding_hash", "recorded_at", "validation_issues", "source_witnesses"],
      "properties": {
        "binding_id": {"type": "string", "minLength": 1, "maxLength": 128},
        "recorded_order": {"type": "integer", "minimum": 1},
        "source_run_id": {"type": ["string", "null"], "minLength": 1, "maxLength": 128},
        "artifact_id": {"type": ["string", "null"], "minLength": 1, "maxLength": 128},
        "evaluation_version": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^research-value\\.revision-feedback\\.v1:[0-9a-f]{64}$"},
        "basis_ref": {"type": "string", "minLength": 1, "maxLength": 2048},
        "basis_hash": {"type": "string", "minLength": 64, "maxLength": 64, "pattern": "^[0-9a-f]{64}$"},
        "feedback_payload_hash": {"type": "string", "minLength": 64, "maxLength": 64, "pattern": "^[0-9a-f]{64}$"},
        "value_payload_hash": {"type": ["string", "null"], "minLength": 64, "maxLength": 64, "pattern": "^[0-9a-f]{64}$"},
        "binding_hash": {"type": "string", "minLength": 64, "maxLength": 64, "pattern": "^[0-9a-f]{64}$"},
        "recorded_at": {"type": "string", "format": "date-time"},
        "validation_issues": {"type": "array", "maxItems": 7, "uniqueItems": true, "items": {"$ref": "#/$defs/revision_feedback_source_reason"}},
        "source_witnesses": {"type": "array", "uniqueItems": true, "items": {"$ref": "#/$defs/revision_feedback_source_witness"}}
      }
    },
    "revision_feedback_evaluation": {
      "title": "RevisionFeedbackEvaluation",
      "type": "object",
      "additionalProperties": false,
      "required": ["schema_version", "owner_id", "revision_id", "feedback", "status", "reason", "confirmation_basis", "binding", "value"],
      "properties": {
        "schema_version": {"type": "string", "const": "research-revision-feedback-evaluation.v1"},
        "owner_id": {"type": "string", "minLength": 1, "maxLength": 128},
        "revision_id": {"type": "string", "minLength": 1, "maxLength": 128},
        "feedback": {"$ref": "workbench_assets.schema.yaml#/$defs/feedback"},
        "status": {"type": "string", "enum": ["available", "unavailable"]},
        "reason": {"type": ["string", "null"], "enum": ["source_missing", "source_invalid", "source_identity_mismatch", "source_hash_mismatch", "source_conflict", "source_not_research", "source_not_terminal", "legacy_feedback_not_bound", null]},
        "confirmation_basis": {"type": "string", "enum": ["stored_feedback_evaluation_binding", "legacy_feedback_receipt_only"]},
        "binding": {"anyOf": [{"$ref": "#/$defs/revision_feedback_evaluation_binding"}, {"type": "null"}]},
        "value": {"anyOf": [{"$ref": "research_product_view.schema.yaml#/$defs/research_value_evaluation"}, {"type": "null"}]}
      },
      "oneOf": [
        {"properties": {
          "status": {"const": "available"}, "reason": {"type": "null"}, "confirmation_basis": {"const": "stored_feedback_evaluation_binding"},
          "binding": {"type": "object", "properties": {"source_run_id": {"type": "string"}, "artifact_id": {"type": "string"}, "value_payload_hash": {"type": "string"}, "validation_issues": {"maxItems": 0}}},
          "value": {"type": "object", "properties": {"artifact_id": {"type": "string", "minLength": 1}}}
        }},
        {"properties": {
          "status": {"const": "unavailable"}, "reason": {"$ref": "#/$defs/revision_feedback_source_reason"}, "confirmation_basis": {"const": "stored_feedback_evaluation_binding"},
          "binding": {"type": "object", "properties": {"value_payload_hash": {"type": "null"}, "validation_issues": {"minItems": 1}}}, "value": {"type": "null"}
        }},
        {"properties": {
          "status": {"const": "unavailable"}, "reason": {"const": "legacy_feedback_not_bound"}, "confirmation_basis": {"const": "legacy_feedback_receipt_only"}, "binding": {"type": "null"}, "value": {"type": "null"}
        }}
      ]
    },
    "revision_feedback_evaluation_basis": {
      "title": "RevisionFeedbackEvaluationBasis",
      "type": "object",
      "additionalProperties": false,
      "required": ["schema_version", "owner_id", "revision_id", "request_id", "binding_id", "basis_ref", "basis_hash", "basis_json"],
      "properties": {
        "schema_version": {"type": "string", "const": "research-revision-feedback-evaluation-basis.v1"},
        "owner_id": {"type": "string", "minLength": 1, "maxLength": 128},
        "revision_id": {"type": "string", "minLength": 1, "maxLength": 128},
        "request_id": {"type": "string", "minLength": 1, "maxLength": 256},
        "binding_id": {"type": "string", "minLength": 1, "maxLength": 128},
        "basis_ref": {"type": "string", "minLength": 1, "maxLength": 2048},
        "basis_hash": {"type": "string", "minLength": 64, "maxLength": 64, "pattern": "^[0-9a-f]{64}$"},
        "basis_json": {"type": "string", "minLength": 1}
      }
    }
  }
}
