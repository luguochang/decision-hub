    "schema_version",
    "owner_authenticated",
    "protocol_id",
    "state",
    "prepared_registered_at",
    "independently_confirmed_registered_at",
    "first_hour",
    "last_hour",
    "actual_as_of",
    "expected_total",
    "publication_due_count",
    "label_due_count",
    "publication_counts",
    "label_counts",
    "paired_count",
    "latest_score",
    "opportunities",
    "pagination",
    "current_originals_verified",
    "financial_qualified",
    "historical_pit_verified",
    "promotion_allowed",
    "ci",
    "ci_status"
