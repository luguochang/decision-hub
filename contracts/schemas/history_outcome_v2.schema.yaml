        "n_pair": {
          "maximum": 48,
          "minimum": 0,
          "title": "N Pair",
          "type": "integer"
        },
        "baseline_brier": {
          "anyOf": [
            {
              "pattern": "^-?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d{1,3})?$",
