              "maxLength": 96
            },
            {
              "type": "null"
            }
          ],
          "title": "Baseline Brier"
        },
        "conditional_brier": {
          "anyOf": [
            {
              "pattern": "^-?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d{1,3})?$",
