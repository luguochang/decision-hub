$schema: https://json-schema.org/draft/2020-12/schema
$id: https://decision-hub.local/contracts/artifact.schema.json
title: DecisionArtifact
type: object
additionalProperties: false
required: [artifact_id, run_id, event_id, gate_status, headline, summary, facts, inferences, counter_thesis, uncertainty, forecasts]
properties:
  artifact_id: {type: string}
  run_id: {type: string}
  event_id: {type: string}
  gate_status: {type: string, enum: [publish, degraded, research_only, reject]}
  headline: {type: string}
  summary: {type: string}
  facts: {type: array, items: {type: string}}
  inferences: {type: array, items: {type: string}}
  counter_thesis: {type: string}
  uncertainty: {type: array, items: {type: string}}
  transmission_chain: {type: array, items: {type: string}, default: []}
  citations: {type: array, items: {type: string}, default: []}
  forecasts: {type: array, items: {$ref: 'forecast.schema.yaml'} }
